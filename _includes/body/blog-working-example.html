<figure class="blog-figure">
  <a href="{{ workingFigure.image | relativeUrl(page.url) }}" aria-label="Open the working example at full size"><img src="{{ workingFigure.image | relativeUrl(page.url) }}" width="{{ workingFigure.width }}" height="{{ workingFigure.height }}" alt="{{ workingFigure.alt | escape }}" loading="lazy" decoding="async"></a>
  <figcaption>{{ workingCaption or workingFigure.caption }} <a href="{{ workingFigure.image | relativeUrl(page.url) }}">View full size</a></figcaption>
</figure>
