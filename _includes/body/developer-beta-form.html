<form class="beta-form" id="developer-beta-form" action="https://forminit.com/f/{{ site.forminitFormId }}" method="POST" data-forminit-request data-pending-message="Sending your beta inquiry…" data-success-message="Thanks, your beta inquiry has been sent. We’ll reply by email." accept-charset="UTF-8" aria-labelledby="developer-beta-heading">
  <input type="hidden" name="fi-text-request" value="Decision Lab developer beta inquiry">
  <input type="hidden" name="fi-text-subject" value="Decision Lab — Developer beta inquiry">
  <input type="hidden" name="_gotcha" value="">
  <fieldset>
    <legend class="visually-hidden">Your developer beta inquiry</legend>
    <div class="form-field"><label for="developer-name">Name <span>(required)</span></label><input id="developer-name" type="text" name="fi-sender-fullName" autocomplete="name" maxlength="160" required></div>
    <div class="form-field"><label for="developer-email">Email <span>(required)</span></label><input id="developer-email" type="email" name="fi-sender-email" autocomplete="email" maxlength="254" required></div>
    <div class="form-field"><label for="developer-company">Organization <span>(optional)</span></label><input id="developer-company" type="text" name="fi-sender-company" autocomplete="organization" maxlength="200"></div>
    <div class="form-field"><label for="developer-message">What application are you building? <span>(required)</span></label><textarea id="developer-message" name="fi-text-message" rows="5" maxlength="5000" placeholder="Describe your real use case, who will use the application, and what you’d like to try with the CLI or SDK." required></textarea></div>
  </fieldset>
  <button class="button" type="submit">Send beta inquiry <span aria-hidden="true">↗</span></button>
  <p class="form-status" id="developer-beta-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
</form>
