<form class="beta-form footer-contact-form" id="footer-contact-form" action="https://forminit.com/f/{{ site.forminitFormId }}" method="POST" data-forminit-request data-pending-message="Sending your message…" data-success-message="Thanks, your message has been sent. We’ll reply by email." accept-charset="UTF-8" aria-labelledby="footer-contact-heading">
  <input type="hidden" name="fi-text-request" value="Hermod Labs contact">
  <input type="hidden" name="fi-text-subject" value="Hermod Labs — Contact form">
  <input type="hidden" name="_gotcha" value="">
  <fieldset>
    <legend class="visually-hidden">Contact Hermod Labs</legend>
    <div class="footer-contact-fields">
      <div class="form-field"><label for="footer-name">Name <span>(required)</span></label><input id="footer-name" type="text" name="fi-sender-fullName" autocomplete="name" maxlength="160" required></div>
      <div class="form-field"><label for="footer-email">Email <span>(required)</span></label><input id="footer-email" type="email" name="fi-sender-email" autocomplete="email" maxlength="254" required></div>
    </div>
    <div class="form-field"><label for="footer-message">Message <span>(required)</span></label><textarea id="footer-message" name="fi-text-message" rows="3" maxlength="5000" placeholder="Tell us what you’d like to discuss." required></textarea></div>
  </fieldset>
  <button class="button" type="submit">Send message <span aria-hidden="true">↗</span></button>
  <p class="form-status" id="footer-contact-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
</form>
