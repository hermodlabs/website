<svg class="gantt-chart" data-figure="paired" data-time-unit="minutes" data-origin="10:00" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1085" width="760" height="1085" role="img" aria-labelledby="article-10-comparison-gantt-title article-10-comparison-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
<title id="article-10-comparison-gantt-title">Shared workers and dependencies with two queue orders</title>
<desc id="article-10-comparison-gantt-desc">A shared relationship map assigns Check agent to Check A and Check B, and Maya to Decide A and Decide B. Each worker has capacity one. Each check produces a record for its own versioned draft; each corresponding decision requires a passing record. A is due at 10:25 and B at 10:15. Both drafts are ready at 10:06. In the FIFO schedule, Check A runs 10:06–10:10, Check B 10:10–10:14, Decide A 10:10–10:15, and Decide B 10:15–10:20. B is five minutes late. Earlier-deadline-first swaps A and B: Check B, Check A, Decide B, then Decide A. Both deadlines are met with the same workers, four-minute checks and five-minute decisions, without overlapping one worker’s tasks. Dashed red lines mark B’s 10:15 deadline. These are calculated examples assuming passing checks, approvals, and zero handoff time, not observed completion. Times in the data are elapsed minutes from 10:00.</desc>
<defs><marker id="article-10-comparison-arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#264e70"/></marker><marker id="article-10-comparison-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#287d80"/></marker><marker id="article-10-comparison-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a9681d"/></marker></defs>
