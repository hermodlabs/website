<svg class="gantt-chart" data-figure="paired" data-time-unit="minutes" data-origin="10:00" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 850" width="760" height="850" role="img" aria-labelledby="article-10-route-gantt-title article-10-route-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
<title id="article-10-route-gantt-title">Assignments, required outputs, and a conditional release decision</title>
<desc id="article-10-route-gantt-desc">The proposed route assigns Trace agent to draft the brief, Check agent to check its claims, and Maya to decide release. Drafting produces Draft v1 with source links; checking requires that draft and produces a check record for the same version. The decision requires a passing record. Estimated work begins at 10:00: Trace drafts for six minutes, Check checks for four, and Maya has a five-minute decision slot from 10:10 to 10:15. That slot has a dashed outline because a passing check is required. All work and approval are still pending. The schedule uses elapsed minutes from 10:00 and has no added deadline line.</desc>
<defs><marker id="article-10-route-arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#264e70"/></marker><marker id="article-10-route-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#287d80"/></marker><marker id="article-10-route-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a9681d"/></marker></defs>
<g data-panel="route">
<g data-view="relationships">
<text x="24" y="34" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Relationships in the proposed route</text>
<g data-node="trace" data-kind="person"><ellipse cx="120" cy="100" rx="85" ry="27" fill="white" stroke="#264e70" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="120" y="105.44">Trace agent</tspan></text></g>
<g data-node="check" data-kind="person"><ellipse cx="380" cy="100" rx="85" ry="27" fill="white" stroke="#287d80" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="380" y="105.44">Check agent</tspan></text></g>
<g data-node="maya" data-kind="person"><ellipse cx="640" cy="100" rx="76" ry="27" fill="white" stroke="#a9681d" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="640" y="105.44">Maya</tspan></text></g>
<g data-node="draftwork" data-kind="task"><rect x="30" y="230" width="180" height="66" fill="#edf1f6" stroke="#264e70" stroke-width="1.5" rx="5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="120" y="268.44">Draft brief</tspan></text></g>
<g data-node="checkwork" data-kind="task"><rect x="290" y="230" width="180" height="66" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" rx="5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="380" y="268.44">Check claims</tspan></text></g>
<g data-node="decision" data-kind="task"><rect x="550" y="230" width="180" height="66" fill="#fbefdf" stroke="#a9681d" stroke-width="1.5" rx="5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="640" y="268.44">Decide release</tspan></text></g>
<g data-node="draft" data-kind="artifact"><rect x="150" y="395" width="200" height="76" fill="white" stroke="#cfd5dc" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="250" y="428.44">Draft v1 </tspan><tspan x="250" y="448.44">with source links</tspan></text></g>
<g data-node="record" data-kind="artifact"><rect x="410" y="395" width="200" height="76" fill="white" stroke="#cfd5dc" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="510" y="428.44">Check record </tspan><tspan x="510" y="448.44">for draft v1</tspan></text></g>
<path data-from="trace" data-to="draftwork" data-relation="assigned to" d="M 120 127 V 230" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-10-route-arrow-navy)"/><rect x="75" y="170" width="90" height="21" fill="white"/><text x="120" y="185" font-size="14" text-anchor="middle" fill="#252525">assigned to</text>
<path data-from="check" data-to="checkwork" data-relation="assigned to" d="M 380 127 V 230" fill="none" stroke="#287d80" stroke-width="1.5" marker-end="url(#article-10-route-arrow-teal)"/><rect x="335" y="170" width="90" height="21" fill="white"/><text x="380" y="185" font-size="14" text-anchor="middle" fill="#252525">assigned to</text>
<path data-from="maya" data-to="decision" data-relation="assigned to" d="M 640 127 V 230" fill="none" stroke="#a9681d" stroke-width="1.5" marker-end="url(#article-10-route-arrow-amber)"/><rect x="595" y="170" width="90" height="21" fill="white"/><text x="640" y="185" font-size="14" text-anchor="middle" fill="#252525">assigned to</text>
<path data-from="draftwork" data-to="draft" data-relation="produces" d="M 120 296 L 210 395" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-10-route-arrow-navy)"/><rect x="125.5" y="329" width="69" height="21" fill="white"/><text x="160" y="344" font-size="14" text-anchor="middle" fill="#252525">produces</text>
<path data-from="checkwork" data-to="draft" data-relation="requires" d="M 380 296 L 290 395" fill="none" stroke="#287d80" stroke-width="1.5" marker-end="url(#article-10-route-arrow-teal)"/><rect x="305.5" y="329" width="69" height="21" fill="white"/><text x="340" y="344" font-size="14" text-anchor="middle" fill="#252525">requires</text>
<path data-from="checkwork" data-to="record" data-relation="produces" d="M 380 296 L 470 395" fill="none" stroke="#287d80" stroke-width="1.5" marker-end="url(#article-10-route-arrow-teal)"/><rect x="385.5" y="329" width="69" height="21" fill="white"/><text x="420" y="344" font-size="14" text-anchor="middle" fill="#252525">produces</text>
<path data-from="decision" data-to="record" data-relation="requires a pass" d="M 640 296 L 550 395" fill="none" stroke="#a9681d" stroke-width="1.5" marker-end="url(#article-10-route-arrow-amber)"/><rect x="541" y="329" width="118" height="21" fill="white"/><text x="600" y="344" font-size="14" text-anchor="middle" fill="#252525">requires a pass</text>
</g>
<line x1="24" y1="510" x2="736" y2="510" stroke="#e5e8ec"/>
<g data-view="schedule" data-time-unit="minutes" data-origin="10:00">
<text x="24" y="546" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Schedule if the check passes</text>
<line x1="170" y1="610" x2="170" y2="820" stroke="#e5e8ec" stroke-width="1"/><text x="170" y="597" font-size="14" text-anchor="middle" fill="#252525">10:00</text><line x1="386" y1="610" x2="386" y2="820" stroke="#e5e8ec" stroke-width="1"/><text x="386" y="597" font-size="14" text-anchor="middle" fill="#252525">10:06</text><line x1="530" y1="610" x2="530" y2="820" stroke="#e5e8ec" stroke-width="1"/><text x="530" y="597" font-size="14" text-anchor="middle" fill="#252525">10:10</text><line x1="710" y1="610" x2="710" y2="820" stroke="#e5e8ec" stroke-width="1"/><text x="710" y="597" font-size="14" text-anchor="middle" fill="#252525">10:15</text>
<text x="154" y="657" font-size="14" text-anchor="end" fill="#252525">Draft brief</text>
<text x="154" y="727" font-size="14" text-anchor="end" fill="#252525">Check claims</text>
<text x="154" y="797" font-size="14" text-anchor="end" fill="#252525">Decide release</text>
<rect data-task="draft" data-person="Trace agent" data-start="0" data-end="6" x="170" y="630" width="216" height="44" rx="4" fill="#edf1f6" stroke="#264e70" stroke-width="1.5"/><text x="278" y="657" font-size="16" text-anchor="middle" fill="#252525">Trace agent</text>
<rect data-task="check" data-person="Check agent" data-start="6" data-end="10" x="386" y="700" width="144" height="44" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5"/><text x="458" y="727" font-size="16" text-anchor="middle" fill="#252525">Check agent</text>
<rect data-task="decision" data-person="Maya" data-start="10" data-end="15" data-status="conditional" x="530" y="770" width="180" height="44" rx="4" fill="#fbefdf" stroke="#a9681d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="620" y="797" font-size="16" text-anchor="middle" fill="#252525">Maya</text>
</g>
</g>
</svg>
