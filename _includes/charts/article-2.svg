<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="article-2-gantt-title article-2-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
  <title id="article-2-gantt-title">An unfinished proposal still needs a reviewer</title>
  <desc id="article-2-gantt-desc">The relationship map assigns Noah to Prepare report, which produces the Report. Review report examines the Report but points to a dashed Reviewer unassigned placeholder with the relation needs a reviewer. The schedule places Noah from 9 to 11 am and outlines required review work from 11 am to noon with owner open. That outlined hour does not reserve a person.</desc>
  <defs>
  <marker id="article-2-relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#264e70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  <marker id="article-2-relation-open" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#aa3542" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="760" height="550" fill="#fff" />
  <g data-panel="unfinished">
  <g data-view="relationships">
  <text x="24" y="30" font-size="17" font-weight="600">Relationships</text>
  <g data-node="writer" data-kind="person">
<ellipse cx="140" cy="95" rx="65" ry="26" fill="#fff" stroke="#264e70" stroke-width="1.5" />
<text x="140" y="100" font-size="16" text-anchor="middle">Noah</text>
</g>
  <g data-node="prepare" data-kind="task">
<rect x="55" y="192" width="170" height="56" rx="4" fill="#e8eef4" stroke="#264e70" stroke-width="1.5" />
<text x="140" y="225" font-size="15" text-anchor="middle">Prepare report</text>
</g>
  <g data-node="report" data-kind="artifact">
<rect x="310" y="192" width="140" height="56" fill="#f7f9fb" stroke="#cfd5dc" stroke-width="1.5" />
<text x="380" y="225" font-size="15" text-anchor="middle">Report</text>
</g>
  <g data-node="review" data-kind="task">
<rect x="535" y="192" width="170" height="56" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" />
<text x="620" y="225" font-size="15" text-anchor="middle">Review report</text>
</g>
  <g data-node="reviewer" data-kind="open-choice">
<rect x="530" y="69" width="180" height="52" rx="4" fill="#fff" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 4" />
<text x="620" y="100" font-size="14" text-anchor="middle">Reviewer unassigned</text>
</g>
  <path data-from="writer" data-to="prepare" data-relation="assigned to" d="M140 121 V188" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-2-relation-arrow)" />
<text x="154" y="161" font-size="14" fill="#555" text-anchor="start">assigned to</text>
  <path data-from="prepare" data-to="report" data-relation="produces" d="M225 220 H304" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-2-relation-arrow)" />
<text x="268" y="207" font-size="14" fill="#555" text-anchor="middle">produces</text>
  <path data-from="review" data-to="report" data-relation="examines" d="M535 220 H456" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-2-relation-arrow)" />
<text x="493" y="207" font-size="14" fill="#555" text-anchor="middle">examines</text>
  <path data-from="review" data-to="reviewer" data-relation="needs a reviewer" d="M620 192 V125" fill="none" stroke="#aa3542" stroke-width="1.5" marker-end="url(#article-2-relation-open)" stroke-dasharray="6 4" />
<text x="634" y="161" font-size="14" fill="#aa3542" text-anchor="start">needs a reviewer</text>
  </g>
  <line x1="24" y1="278" x2="732" y2="278" stroke="#e5e8ec" />
  <g data-view="schedule">
<text x="24" y="314" font-size="17" font-weight="600">Schedule</text>
<line x1="150" y1="374" x2="150" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="150" y="358" font-size="14" text-anchor="middle" fill="#555">9 am</text>
<line x1="330" y1="374" x2="330" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="330" y="358" font-size="14" text-anchor="middle" fill="#555">10 am</text>
<line x1="510" y1="374" x2="510" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="510" y="358" font-size="14" text-anchor="middle" fill="#555">11 am</text>
<line x1="690" y1="374" x2="690" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="690" y="358" font-size="14" text-anchor="middle" fill="#555">Noon</text>
<text x="690" y="334" font-size="14" text-anchor="middle" font-weight="600" fill="#aa3542">Deadline</text>
<text x="132" y="416" font-size="16" text-anchor="end">Noah</text>
<rect data-task="prepare" data-person="Noah" data-start="9" data-end="11" x="150" y="388" width="360" height="44" rx="3" fill="#e8eef4" stroke="#264e70" stroke-width="1.5" />
<text x="330.0" y="416" font-size="14" text-anchor="middle">Prepare report</text>
<text x="132" y="490" font-size="16" text-anchor="end">Required review</text>
<rect data-task="required-review" data-person="Unassigned" data-start="11" data-end="12" x="510" y="462" width="180" height="44" rx="3" fill="#fff" stroke="#287d80" stroke-width="1.5" data-status="unassigned" stroke-dasharray="6 4" />
<text x="600.0" y="490" font-size="14" text-anchor="middle">Owner open</text>
<line data-deadline="12" x1="690" y1="374" x2="690" y2="522" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 5" />
</g>
  </g>
</svg>
