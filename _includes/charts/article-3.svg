<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="article-3-gantt-title article-3-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
  <title id="article-3-gantt-title">An open reviewer link leaves C without a scheduled hour</title>
  <desc id="article-3-gantt-desc">Maya is assigned to Review A and Eli is assigned to Review B. Review C points to an unassigned reviewer placeholder. In the schedule Maya reviews A and Eli reviews B from 11 am to noon. C has no available reviewer row for its required hour. The open placeholder is not a person or an extra hour of capacity.</desc>
  <defs>
  <marker id="article-3-relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#264e70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  <marker id="article-3-relation-open" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#aa3542" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="760" height="590" fill="#fff" />
  <g data-panel="capacity">
  <g data-view="relationships">
  <text x="24" y="30" font-size="17" font-weight="600">Relationships</text>
  <g data-node="pa" data-kind="person">
<ellipse cx="140" cy="95" rx="65" ry="26" fill="#fff" stroke="#264e70" stroke-width="1.5" />
<text x="140" y="100" font-size="16" text-anchor="middle">Maya</text>
</g>
  <g data-node="ta" data-kind="task">
<rect x="55" y="192" width="170" height="56" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" />
<text x="140" y="225" font-size="15" text-anchor="middle">Review A</text>
</g>
  <g data-node="pb" data-kind="person">
<ellipse cx="380" cy="95" rx="65" ry="26" fill="#fff" stroke="#264e70" stroke-width="1.5" />
<text x="380" y="100" font-size="16" text-anchor="middle">Eli</text>
</g>
  <g data-node="tb" data-kind="task">
<rect x="295" y="192" width="170" height="56" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" />
<text x="380" y="225" font-size="15" text-anchor="middle">Review B</text>
</g>
  <g data-node="pc" data-kind="open-choice">
<rect x="530" y="69" width="180" height="52" rx="4" fill="#fff" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 4" />
<text x="620" y="100" font-size="14" text-anchor="middle">Reviewer unassigned</text>
</g>
  <g data-node="tc" data-kind="task">
<rect x="535" y="192" width="170" height="56" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" />
<text x="620" y="225" font-size="15" text-anchor="middle">Review C</text>
</g>
  <path data-from="pa" data-to="ta" data-relation="assigned to" d="M140 121 V188" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-3-relation-arrow)" />
<text x="154" y="161" font-size="14" fill="#555" text-anchor="start">assigned to</text>
  <path data-from="pb" data-to="tb" data-relation="assigned to" d="M380 121 V188" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-3-relation-arrow)" />
<text x="394" y="161" font-size="14" fill="#555" text-anchor="start">assigned to</text>
  <path data-from="tc" data-to="pc" data-relation="needs a reviewer" d="M620 192 V125" fill="none" stroke="#aa3542" stroke-width="1.5" marker-end="url(#article-3-relation-open)" stroke-dasharray="6 4" />
<text x="634" y="161" font-size="14" fill="#aa3542" text-anchor="start">needs a reviewer</text>
  </g>
  <line x1="24" y1="278" x2="732" y2="278" stroke="#e5e8ec" />
  <g data-view="schedule">
<text x="24" y="314" font-size="17" font-weight="600">Schedule</text>
<line x1="150" y1="374" x2="150" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="150" y="358" font-size="14" text-anchor="middle" fill="#555">11 am</text>
<line x1="690" y1="374" x2="690" y2="522" stroke="#e5e8ec" stroke-width="1" />
<text x="690" y="358" font-size="14" text-anchor="middle" fill="#555">Noon</text>
<text x="690" y="334" font-size="14" text-anchor="middle" font-weight="600" fill="#aa3542">Deadline</text>
<text x="132" y="416" font-size="16" text-anchor="end">Maya</text>
<rect data-task="review" data-person="Maya" data-start="11" data-end="12" x="150" y="388" width="540" height="44" rx="3" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" data-report="A" />
<text x="420.0" y="416" font-size="14" text-anchor="middle">Review A</text>
<text x="132" y="490" font-size="16" text-anchor="end">Eli</text>
<rect data-task="review" data-person="Eli" data-start="11" data-end="12" x="150" y="462" width="540" height="44" rx="3" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" data-report="B" />
<text x="420.0" y="490" font-size="14" text-anchor="middle">Review B</text>
<line data-deadline="12" x1="690" y1="374" x2="690" y2="522" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="24" y="562" font-size="14" data-unassigned-report="C" fill="#aa3542">Review C has no reviewer available for its required hour.</text>
</g>
  </g>
</svg>
