  <marker id="article-4-relation-open" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#aa3542" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="760" height="620" fill="#fff" />
  <g data-panel="confirmed">
