<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="article-4-gantt-title article-4-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
  <title id="article-4-gantt-title">A confirmed reviewer fills the open assignment</title>
  <desc id="article-4-gantt-desc">The relationship map assigns Maya to Review A, Eli to Review B, and Priya to Review C. Their schedule places all three one-hour reviews from 11 am to the noon deadline. The added Priya assignment assumes her availability, independence, qualification, and staffing reassignment are confirmed.</desc>
  <defs>
