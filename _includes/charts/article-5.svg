<text x="24" y="61" font-size="14" text-anchor="start" fill="#252525">Additional reviewer fee: $0</text>
<g data-view="relationships">
<text x="24" y="99" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Relationships</text>
