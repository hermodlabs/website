<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="article-5-gantt-title article-5-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
<title id="article-5-gantt-title">Review C and the customer meeting in two workable arrangements</title>
<desc id="article-5-gantt-desc">Each arrangement has a relationship map and schedule for the same two tasks. Priya owns Review C and the customer meeting in the first arrangement: review runs from 11 am to noon and the meeting from 2 to 3 pm, with no additional reviewer fee. In the second, Tomas owns Review C from 11 am to noon while Priya attends the meeting at the same time; the additional reviewer fee is $150. People are ovals, review tasks are teal rounded rectangles, and meetings are amber rounded rectangles. The dashed line marks the noon review deadline.</desc>
<defs><marker id="article-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#264e70"/></marker><marker id="article-5-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ba3ad"/></marker></defs>
