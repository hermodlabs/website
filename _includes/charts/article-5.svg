<g data-node="meeting" data-kind="task"><rect x="216" y="244" width="144" height="66" rx="5" fill="#fbefdf" stroke="#a9681d" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="288" y="272.44">Customer </tspan><tspan x="288" y="292.44">meeting</tspan></text></g>
<g data-node="priya" data-kind="person"><ellipse cx="192" cy="136" rx="62" ry="24" fill="white" stroke="#264e70" stroke-width="1.5"/><text x="192" y="141" font-size="16" text-anchor="middle" fill="#252525">Priya</text></g>
<path data-from="priya" data-to="review" data-relation="assigned to" d="M 192 160 V 200 H 96 V 244" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-5-arrow)"/><rect x="101" y="173" width="86" height="21" fill="white"/><text x="144" y="188" font-size="14" text-anchor="middle" fill="#252525">assigned to</text>
