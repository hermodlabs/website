<text x="24" y="411" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Schedule</text>
<line x1="180" y1="470" x2="180" y2="550" stroke="#e5e8ec" stroke-width="1"/><text x="180" y="457" font-size="14" text-anchor="middle" fill="#252525">11 am</text><line x1="680" y1="470" x2="680" y2="550" stroke="#e5e8ec" stroke-width="1"/><text x="680" y="457" font-size="14" text-anchor="middle" fill="#252525">Noon</text>
