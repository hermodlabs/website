<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="article-6-gantt-title article-6-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
<title id="article-6-gantt-title">Accepted review work connects a draft to an expected record</title>
<desc id="article-6-gantt-desc">The relationship map assigns Tomas to Review C, which examines Draft C and must produce an expected review record. The coordinator must check that record. The review is accepted and pending; the dashed square-cornered record is expected, not completed. The schedule contains only Tomas’s planned review from 11 am to noon. Hollow diamonds mark Draft C available at 11 and the review record expected at noon. Evidence is still needed to establish completion.</desc>
<defs><marker id="article-6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#264e70"/></marker><marker id="article-6-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ba3ad"/></marker></defs>
<g data-panel="planned" data-status="planned">
<g data-view="relationships">
<text x="24" y="34" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Relationships</text>
<g data-node="tomas" data-kind="person"><ellipse cx="375" cy="93" rx="76" ry="26" fill="white" stroke="#264e70" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="375" y="98.44">Tomas</tspan></text></g>
<g data-node="coordinator" data-kind="person"><ellipse cx="658" cy="93" rx="78" ry="26" fill="white" stroke="#264e70" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="658" y="98.44">Coordinator</tspan></text></g>
<g data-node="draft" data-kind="artifact"><rect x="24" y="250" width="156" height="64" fill="white" stroke="#9ba3ad" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="102.0" y="287.44">Draft C</tspan></text></g>
<g data-node="review" data-kind="task"><rect x="285" y="240" width="180" height="84" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" rx="5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="375.0" y="277.94">Review C</tspan><tspan x="375.0" y="296.94">Accepted; pending</tspan></text></g>
<g data-node="record" data-kind="artifact" data-status="expected"><rect x="580" y="240" width="156" height="84" fill="white" stroke="#9ba3ad" stroke-width="1.5" stroke-dasharray="6 4"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="658.0" y="277.94">Expected</tspan><tspan x="658.0" y="296.94">review record</tspan></text></g>
<path data-from="tomas" data-to="review" data-relation="assigned to" d="M 375 119 V 240" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-6-arrow)"/><rect x="328.07" y="169" width="93.85" height="21" fill="white"/><text x="375" y="184" font-size="14.5" text-anchor="middle" fill="#252525">assigned to</text>
<path data-from="review" data-to="draft" data-relation="examines" d="M 285 282 H 180" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-6-arrow)"/><rect x="196.6" y="252" width="71.8" height="21" fill="white"/><text x="232.5" y="267" font-size="14.5" text-anchor="middle" fill="#252525">examines</text>
<path data-from="review" data-to="record" data-relation="must produce" d="M 465 282 H 580" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-6-arrow)"/><rect x="471.9" y="252" width="101.2" height="21" fill="white"/><text x="522.5" y="267" font-size="14.5" text-anchor="middle" fill="#252525">must produce</text>
<path data-from="coordinator" data-to="record" data-relation="must check" d="M 658 119 V 240" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-6-arrow)"/><rect x="614.75" y="169" width="86.5" height="21" fill="white"/><text x="658" y="184" font-size="14.5" text-anchor="middle" fill="#252525">must check</text>
</g>
<line x1="24" y1="375" x2="736" y2="375" stroke="#e5e8ec" stroke-width="1"/>
