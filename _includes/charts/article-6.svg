<text font-size="14.5" text-anchor="middle" fill="#252525"><tspan x="180" y="585.43">Draft C</tspan><tspan x="180" y="604.43">available</tspan></text>
<text font-size="14.5" text-anchor="middle" fill="#252525"><tspan x="680" y="585.43">Review record</tspan><tspan x="680" y="604.43">expected</tspan></text>
