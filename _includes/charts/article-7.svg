</g>
<g data-panel="updated">
<text x="180" y="607" font-size="14.5" text-anchor="end" fill="#252525">After update: Tomas</text>
<rect data-task="review" data-person="Tomas" data-start="11.5" data-end="12.5" data-report="C" data-status="not-approved" data-lateness-minutes="30" x="370" y="580" width="340" height="44" rx="4" fill="#e5f1f0" stroke="#aa3542" stroke-width="1.5"/><text x="540.0" y="607.0" font-size="16" text-anchor="middle" fill="#252525"></text>
<text x="455" y="607" font-size="15" text-anchor="middle" fill="#252525">Review C</text>
<text x="625" y="607" font-size="14" text-anchor="middle" fill="#aa3542">30 minutes late</text>
</g>
<g data-panel="revised">
<text x="180" y="683" font-size="14.5" text-anchor="end" fill="#252525">Revised: Priya</text>
<rect data-task="review" data-person="Priya" data-start="11" data-end="12" data-report="C" data-status="confirmed" x="200" y="656" width="340" height="44" rx="4" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5"/><text x="370.0" y="683.0" font-size="16" text-anchor="middle" fill="#252525">Review C</text>
</g>
<line data-deadline="12" x1="540" y1="488" x2="540" y2="710" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 5"/>
</g>
</g>
