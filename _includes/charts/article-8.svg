<text x="455" y="585" font-size="15" text-anchor="middle" fill="#252525">Review C</text>
<text x="625" y="585" font-size="14" text-anchor="middle" fill="#aa3542">30 minutes late</text>
<line data-deadline="12" x1="540" y1="536" x2="540" y2="622" stroke="#aa3542" stroke-width="1.5" stroke-dasharray="6 5"/>
</g>
</g>
