<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="article-8-gantt-title article-8-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
<title id="article-8-gantt-title">Relationships and schedule for the same rejected candidate</title>
<desc id="article-8-gantt-desc">The relationship map assigns Tomas to Review C, which examines Report C and lasts 60 minutes. Tomas is available during the 11:30 am to 12:30 pm time window, and the review is scheduled during that window. Review C must finish by the separate noon deadline. The schedule shows the same proposed review from 11:30 am to 12:30 pm: it fits Tomas’s availability but crosses noon and finishes 30 minutes late. This is a rejected candidate, not evidence that work happened. People are ovals, tasks are rounded rectangles, and reports, time windows, and deadlines are square-cornered artifacts.</desc>
<defs><marker id="article-8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#264e70"/></marker><marker id="article-8-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ba3ad"/></marker></defs>
<g data-panel="candidate">
<g data-view="relationships">
<text x="24" y="34" font-size="17" text-anchor="start" fill="#252525" font-weight="600">Relationships in the candidate being checked</text>
<g data-node="tomas" data-kind="person"><ellipse cx="105" cy="105" rx="75" ry="26" fill="white" stroke="#264e70" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="105" y="110.44">Tomas</tspan></text></g>
<g data-node="review" data-kind="task"><rect x="280" y="245" width="200" height="84" fill="#e5f1f0" stroke="#287d80" stroke-width="1.5" rx="5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="380.0" y="282.94">Review C</tspan><tspan x="380.0" y="301.94">Duration: 60 minutes</tspan></text></g>
<g data-node="report" data-kind="artifact"><rect x="24" y="255" width="160" height="64" fill="white" stroke="#9ba3ad" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="104.0" y="292.44">Report C</tspan></text></g>
<g data-node="window" data-kind="artifact"><rect x="535" y="75" width="200" height="64" fill="white" stroke="#9ba3ad" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="635.0" y="102.94">Time window</tspan><tspan x="635.0" y="121.94">11:30–12:30</tspan></text></g>
<g data-node="deadline" data-kind="artifact"><rect x="550" y="350" width="185" height="64" fill="white" stroke="#aa3542" stroke-width="1.5"/><text font-size="16" text-anchor="middle" fill="#252525"><tspan x="642.5" y="377.94">Deadline</tspan><tspan x="642.5" y="396.94">Noon</tspan></text></g>
<path data-from="tomas" data-to="review" data-relation="assigned to" d="M 145 127 L 325 245" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-8-arrow)"/><rect x="178.07" y="165" width="93.85" height="21" fill="white"/><text x="225" y="180" font-size="14.5" text-anchor="middle" fill="#252525">assigned to</text>
<path data-from="review" data-to="report" data-relation="examines" d="M 280 287 H 184" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-8-arrow)"/><rect x="196.1" y="256" width="71.8" height="21" fill="white"/><text x="232" y="271" font-size="14.5" text-anchor="middle" fill="#252525">examines</text>
<path data-from="tomas" data-to="window" data-relation="available during" d="M 180 105 H 535" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-8-arrow)"/><rect x="292.2" y="76" width="130.6" height="21" fill="white"/><text x="357.5" y="91" font-size="14.5" text-anchor="middle" fill="#252525">available during</text>
<path data-from="review" data-to="window" data-relation="scheduled during" d="M 440 245 L 580 139" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-8-arrow)"/><rect x="484.7" y="188" width="130.6" height="21" fill="white"/><text x="550" y="203" font-size="14.5" text-anchor="middle" fill="#252525">scheduled during</text>
<path data-from="review" data-to="deadline" data-relation="must finish by" d="M 480 287 H 642.5 V 350" fill="none" stroke="#264e70" stroke-width="1.5" marker-end="url(#article-8-arrow)"/><rect x="536.05" y="258" width="115.9" height="21" fill="white"/><text x="594" y="273" font-size="14.5" text-anchor="middle" fill="#252525">must finish by</text>
