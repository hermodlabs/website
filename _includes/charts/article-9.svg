<svg class="gantt-chart" data-figure="paired" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="article-9-gantt-title article-9-gantt-desc" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
  <title id="article-9-gantt-title">Proposed cart associations and their recorded sighting times</title>
  <desc id="article-9-gantt-desc">The surviving candidate associates the North camera sighting at 10:00 and the West camera sighting at 10:02 with Cart 1 hypothesis. It associates the South camera sighting at 10:00 and the East camera sighting at 10:02 with Cart 2 hypothesis. Observation cards are square-cornered; cart hypotheses are labelled ellipses, not observed identifiers or people. In the timeline, four dots mark recorded sightings and dashed links show the same proposed associations. No intermediate position, route, or observed journey is asserted.</desc>
  <defs>
    <marker id="article-9-association-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#264e70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <marker id="article-9-association-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#287d80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="760" height="660" fill="#fff" />
  <g data-panel="association">
    <g data-view="relationships">
      <text x="24" y="30" font-size="17" font-weight="600">Relationships in the surviving candidate</text>
      <g data-node="n" data-kind="observation">
        <rect x="16" y="83" width="168" height="70" fill="#f7f9fb" stroke="#9ba3ad" stroke-width="1.5" />
        <text x="100" y="112" text-anchor="middle" font-size="14">N: North camera</text>
        <text x="100" y="136" text-anchor="middle" font-size="14">10:00 sighting</text>
      </g>
      <g data-node="c1" data-kind="hypothesis">
        <ellipse cx="380" cy="118" rx="74" ry="36" fill="#eef3f7" stroke="#264e70" stroke-width="1.5" />
        <text x="380" y="113" text-anchor="middle">Cart 1</text>
        <text x="380" y="135" text-anchor="middle" font-size="14">hypothesis</text>
      </g>
      <g data-node="w" data-kind="observation">
        <rect x="576" y="83" width="168" height="70" fill="#f7f9fb" stroke="#9ba3ad" stroke-width="1.5" />
        <text x="660" y="112" text-anchor="middle" font-size="14">W: West camera</text>
        <text x="660" y="136" text-anchor="middle" font-size="14">10:02 sighting</text>
      </g>
      <g data-node="s" data-kind="observation">
        <rect x="16" y="219" width="168" height="70" fill="#f7f9fb" stroke="#9ba3ad" stroke-width="1.5" />
        <text x="100" y="248" text-anchor="middle" font-size="14">S: South camera</text>
        <text x="100" y="272" text-anchor="middle" font-size="14">10:00 sighting</text>
      </g>
      <g data-node="c2" data-kind="hypothesis">
        <ellipse cx="380" cy="254" rx="74" ry="36" fill="#edf7f6" stroke="#287d80" stroke-width="1.5" />
        <text x="380" y="249" text-anchor="middle">Cart 2</text>
        <text x="380" y="271" text-anchor="middle" font-size="14">hypothesis</text>
      </g>
      <g data-node="e" data-kind="observation">
        <rect x="576" y="219" width="168" height="70" fill="#f7f9fb" stroke="#9ba3ad" stroke-width="1.5" />
        <text x="660" y="248" text-anchor="middle" font-size="14">E: East camera</text>
        <text x="660" y="272" text-anchor="middle" font-size="14">10:02 sighting</text>
      </g>
      <path data-from="n" data-to="c1" data-relation="associated with" d="M184 118 H300" fill="none" stroke="#264e70" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#article-9-association-navy)" />
      <text x="242" y="103" text-anchor="middle" font-size="14">associated with</text>
      <path data-from="w" data-to="c1" data-relation="associated with" d="M576 118 H460" fill="none" stroke="#264e70" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#article-9-association-navy)" />
      <text x="518" y="103" text-anchor="middle" font-size="14">associated with</text>
      <path data-from="s" data-to="c2" data-relation="associated with" d="M184 254 H300" fill="none" stroke="#287d80" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#article-9-association-teal)" />
      <text x="242" y="239" text-anchor="middle" font-size="14">associated with</text>
      <path data-from="e" data-to="c2" data-relation="associated with" d="M576 254 H460" fill="none" stroke="#287d80" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#article-9-association-teal)" />
      <text x="518" y="239" text-anchor="middle" font-size="14">associated with</text>
    </g>
    <line x1="24" y1="332" x2="736" y2="332" stroke="#e5e8ec" />
    <g data-view="schedule">
      <text x="24" y="370" font-size="17" font-weight="600">Sightings on a timeline</text>
      <g stroke="#e5e8ec" stroke-width="1">
        <line x1="240" y1="432" x2="240" y2="600" />
        <line x1="470" y1="432" x2="470" y2="600" />
        <line x1="700" y1="432" x2="700" y2="600" />
      </g>
      <g text-anchor="middle" font-size="14" fill="#555">
        <text x="240" y="413">10:00</text>
        <text x="470" y="413">10:01</text>
        <text x="700" y="413">10:02</text>
      </g>
      <text x="218" y="476" text-anchor="end" font-size="15">Cart 1 hypothesis</text>
      <text x="218" y="566" text-anchor="end" font-size="15">Cart 2 hypothesis</text>
      <line data-association="c1" data-from="N" data-to="W" x1="240" y1="470" x2="700" y2="470" stroke="#264e70" stroke-width="1.5" stroke-dasharray="6 5" />
      <line data-association="c2" data-from="S" data-to="E" x1="240" y1="560" x2="700" y2="560" stroke="#287d80" stroke-width="1.5" stroke-dasharray="6 5" />
      <circle data-observation="N" data-time="10:00" cx="240" cy="470" r="5" fill="#264e70" />
      <circle data-observation="W" data-time="10:02" cx="700" cy="470" r="5" fill="#264e70" />
      <circle data-observation="S" data-time="10:00" cx="240" cy="560" r="5" fill="#287d80" />
      <circle data-observation="E" data-time="10:02" cx="700" cy="560" r="5" fill="#287d80" />
      <text x="250" y="453" font-size="14">N: North</text>
      <text x="690" y="453" text-anchor="end" font-size="14">W: West</text>
      <text x="250" y="543" font-size="14">S: South</text>
      <text x="690" y="543" text-anchor="end" font-size="14">E: East</text>
    </g>
  </g>
  <text x="24" y="634" font-size="14" fill="#555">Dots are sightings; dashed links are proposed associations, not observed journeys.</text>
</svg>
