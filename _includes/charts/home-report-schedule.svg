{% set homeChartStartX = 24 %}
{% set homeChartPlotWidth = 392 %}
{% set homeChartDayCount = homeExample.endDay - homeExample.startDay + 1 %}
{% set homeChartDayWidth = homeChartPlotWidth / homeChartDayCount %}
{% set homeChartDeadlineX = homeChartStartX + (homeExample.deadlineDay - homeExample.startDay + 1) * homeChartDayWidth %}
<svg class="home-report-schedule" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-labelledby="home-report-title home-report-description" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#252525">
  <title id="home-report-title">A three-day report preparation and independent review plan</title>
  <desc id="home-report-description">{{ homeExample.tasks[0].owner | escape }} prepares the report on days {{ homeExample.tasks[0].startDay }}–{{ homeExample.tasks[0].finishDay }}. {{ homeExample.tasks[1].owner | escape }} performs the independent review on day {{ homeExample.tasks[1].startDay }}. The planned review finishes by the deadline at the end of day {{ homeExample.deadlineDay }}. The bars cover inclusive day intervals and show planned work, not evidence of actual completion.</desc>
  <rect width="440" height="280" fill="#fff" />
  <text x="24" y="28" font-size="17" font-weight="600">Planned schedule</text>
  <text x="416" y="28" text-anchor="end" font-size="14" font-weight="600" fill="#AA3542">Due end of day {{ homeExample.deadlineDay }}</text>
{% for boundary in range(0, homeChartDayCount + 1) %}
  <line x1="{{ (homeChartStartX + boundary * homeChartDayWidth) | round(2) }}" y1="80" x2="{{ (homeChartStartX + boundary * homeChartDayWidth) | round(2) }}" y2="254" stroke="#e5e8ec" stroke-width="1" />
{% endfor %}
{% for day in range(homeExample.startDay, homeExample.endDay + 1) %}
  <text data-day="{{ day }}" x="{{ (homeChartStartX + (day - homeExample.startDay + 0.5) * homeChartDayWidth) | round(2) }}" y="64" text-anchor="middle" font-size="14" fill="#555">Day {{ day }}</text>
{% endfor %}
{% for task in homeExample.tasks %}
{% set homeTaskX = homeChartStartX + (task.startDay - homeExample.startDay) * homeChartDayWidth %}
{% set homeTaskWidth = (task.finishDay - task.startDay + 1) * homeChartDayWidth %}
{% set homeTaskY = 108 + loop.index0 * 96 %}
  <text x="{% if loop.first %}24{% else %}416{% endif %}" y="{{ homeTaskY - 12 }}" text-anchor="{% if loop.first %}start{% else %}end{% endif %}" font-size="15">{{ task.label | escape }}</text>
  <rect data-task="{{ task.id | escape }}" data-person="{{ task.owner | escape }}" data-start-day="{{ task.startDay }}" data-finish-day="{{ task.finishDay }}" x="{{ homeTaskX | round(2) }}" y="{{ homeTaskY }}" width="{{ homeTaskWidth | round(2) }}" height="38" rx="3" fill="{% if task.id == 'prepare' %}#e8eef4{% else %}#e5f1f0{% endif %}" stroke="{% if task.id == 'prepare' %}#264e70{% else %}#287d80{% endif %}" stroke-width="1.5" />
  <text x="{{ (homeTaskX + homeTaskWidth / 2) | round(2) }}" y="{{ homeTaskY + 25 }}" text-anchor="middle" font-size="14">{{ task.owner | escape }} · {{ task.finishDay - task.startDay + 1 }} {% if task.finishDay == task.startDay %}day{% else %}days{% endif %}</text>
{% endfor %}
  <line data-deadline-day="{{ homeExample.deadlineDay }}" x1="{{ homeChartDeadlineX | round(2) }}" y1="80" x2="{{ homeChartDeadlineX | round(2) }}" y2="254" stroke="#AA3542" stroke-width="1.5" stroke-dasharray="6 5" />
</svg>
