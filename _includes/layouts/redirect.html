<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Hermod Labs</title>
  <meta name="description" content="This page has moved. {{ title }} at Hermod Labs.">
  <meta name="robots" content="noindex, follow">
  {% if preserveHash %}<noscript>{% endif %}<meta http-equiv="refresh" content="0; url={{ redirectTo | relativeUrl(page.url) }}">{% if preserveHash %}</noscript>{% endif %}
  <link rel="canonical" href="{{ site.url }}{{ canonicalTo or redirectTo }}">
  {% include "head/style.html" %}
</head>
<body>
  <main class="page-hero wrap" id="main">
    <p class="eyebrow">Hermod Labs</p>
    <h1>{{ title }}.</h1>
    <p>This page has moved. <a class="text-link"{% if preserveHash %} data-redirect-target{% endif %} href="{{ redirectTo | relativeUrl(page.url) }}">Continue to the new page <span aria-hidden="true">→</span></a></p>
  </main>
  {% if preserveHash %}<script>
    (() => {
      const target = new URL(document.querySelector('[data-redirect-target]').href);
      if (window.location.hash) target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>{% endif %}
</body>
</html>
