<title id="can-we-complete-the-commitment-title">Can We Complete the Commitment?</title><desc id="can-we-complete-the-commitment-desc">Four complete candidate plans are checked against timing, resources and recorded-permission conditions. A and B pass every mandatory check. C and D fail a condition. The feasible options feed a separate explicit preference policy or human choice; passing the checks does not authorize operating work.</desc>
