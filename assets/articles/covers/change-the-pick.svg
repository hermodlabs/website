<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="cover-change-the-pick-title cover-change-the-pick-desc">
<title id="cover-change-the-pick-title">Change the Pick. Understand the Consequences.</title><desc id="cover-change-the-pick-desc">Four stable abstract team tokens surround one selected scouting token. A separate burst token can replace that selection, while a dotted contribution line suggests downstream consequences. The invented symbols contain no champion artwork, imply no universal ranking and predict no match outcome.</desc>
