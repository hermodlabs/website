<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="article-23-cover-title article-23-cover-desc">
  <title id="article-23-cover-title">Check a Report Plan in Decision Lab</title>
  <desc id="article-23-cover-desc">A report sits beside a calendar labeled days one, two, and three. A teal preparation bar spans the first two days and a purple review bar occupies the third. Two separate people appear below, and an outlined question badge marks the unresolved reviewer-independence check.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="348" r="286" fill="#fff"/>
  <path d="M154 619h652" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="485" cy="619" rx="247" ry="13" fill="#e8e8ee"/>

  <!-- Three explicit days: preparation first, then the review. -->
  <g stroke="#193743" stroke-linejoin="round" stroke-linecap="round">
    <rect x="411" y="185" width="367" height="296" rx="20" fill="#fff" stroke-width="5"/>
    <path d="M411 261h367" fill="none" stroke-width="5"/>
    <path d="M455 166v38m279-38v38" fill="none" stroke-width="7"/>
    <path d="M533 261v220m122-220v220" fill="none" stroke="#d3dfe5" stroke-width="4"/>
    <rect x="430" y="298" width="205" height="48" rx="10" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
    <rect x="674" y="381" width="85" height="48" rx="10" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
    <path d="M636 359h57m-14-12 14 12-14 12" fill="none" stroke="#193743" stroke-width="5"/>
  </g>
  <g fill="#193743" font-family="system-ui, sans-serif" font-size="33" font-weight="600" text-anchor="middle">
    <text x="472" y="237">1</text><text x="594" y="237">2</text><text x="716" y="237">3</text>
  </g>

  <!-- The planned report is an artifact, not a completed finding. -->
  <g transform="rotate(-8 295 358)" stroke="#193743" stroke-linejoin="round" stroke-linecap="round">
    <path d="M198 192h142l52 52v272H198z" fill="#f6f3fa" stroke-width="5"/>
    <path d="M340 192v52h52" fill="#e5dfed" stroke-width="5"/>
    <path d="M228 280h126" fill="none" stroke="#193743" stroke-width="8"/>
    <path d="M228 316h108m-108 28h126m-126 28h85m-85 60h116m-116 27h91" fill="none" stroke="#bba9dc" stroke-width="7"/>
  </g>

  <!-- Separate assignments leave the applicable independence criteria open. -->
  <path d="M420 544h155" stroke="#bba9dc" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
  <g stroke="#193743" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="383" cy="534" r="25" fill="#c6e3e1"/>
    <path d="M342 616v-30q0-23 41-23t41 23v30" fill="#e6f2f0"/>
    <circle cx="614" cy="534" r="25" fill="#ddd0ee"/>
    <path d="M573 616v-30q0-23 41-23t41 23v30" fill="#eee8f7"/>
  </g>
  <circle cx="752" cy="552" r="43" fill="#fff" stroke="#7850c2" stroke-width="5"/>
  <path d="M739 539c0-18 29-20 29-2 0 11-16 12-16 23" fill="none" stroke="#7850c2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="752" cy="574" r="3.8" fill="#7850c2"/>
  <path d="M657 555h35" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 9"/>
</svg>
