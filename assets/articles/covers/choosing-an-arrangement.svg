<title id="cover-choosing-an-arrangement-title">What Does Choosing an Arrangement Commit Us To?</title><desc id="cover-choosing-an-arrangement-desc">An assignment sheet, a poised pen and an outlined future milestone represent a commitment that still requires action and evidence. The empty marker does not assert that the review has been completed.</desc>
