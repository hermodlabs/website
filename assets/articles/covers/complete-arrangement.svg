<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="cover-complete-arrangement-title cover-complete-arrangement-desc">
<title id="cover-complete-arrangement-title">What Counts as a Complete Arrangement?</title><desc id="cover-complete-arrangement-desc">Three interlocking pieces form part of an arrangement. An outlined position remains open, while another piece waits to be placed. This is a metaphor for unresolved choices, not proof that any filled arrangement satisfies its rules.</desc>
