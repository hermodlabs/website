<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="article-18-cover-title article-18-cover-desc">
  <title id="article-18-cover-title">Computational Hermeneutics for Human Decisions</title>
  <desc id="article-18-cover-desc">A source document branches through a conditional junction toward two possible readings: line availability, represented by a calendar, and permission, represented by a key. A large magnifying glass examines the junction. Both branches remain provisional.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="349" r="287" fill="#fff"/>
  <path d="M169 619h620" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="450" cy="619" rx="215" ry="13" fill="#e8e8ee"/>

  <!-- A source, with its condition kept attached. -->
  <g transform="rotate(-8 322 363)" stroke="#193743" stroke-linejoin="round">
    <path d="M212 186h170l53 53v290H212z" fill="#f6f3fa" stroke-width="5"/>
    <path d="M382 186v53h53" fill="#e5dfed" stroke-width="5"/>
    <path d="M250 272h128M250 300h107M250 329h123" fill="none" stroke="#bba9dc" stroke-width="7" stroke-linecap="round"/>
    <path d="M250 404h57m-57 29h93m-93 29h66" fill="none" stroke="#193743" stroke-width="6" stroke-linecap="round"/>
    <path d="m360 379 23 23-23 23-23-23z" fill="#ddd0ee" stroke="#7850c2" stroke-width="5"/>
  </g>

  <!-- Readings diverge without being asserted as established facts. -->
  <path d="M423 371h101q26 0 26-26v-90q0-34 42-34h35M423 371h101q26 0 26 26v90q0 34 42 34h35" fill="none" stroke="#bba9dc" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 12"/>
  <g stroke="#193743" stroke-linecap="round" stroke-linejoin="round">
    <rect x="636" y="157" width="151" height="135" rx="17" fill="#e6f2f0" stroke-width="5"/>
    <path d="M636 197h151M670 142v29m81-29v29" fill="none" stroke-width="6"/>
    <path d="M666 224h24m26 0h24m-74 33h24" stroke="#177681" stroke-width="8"/>
  </g>
  <circle cx="711" cy="510" r="76" fill="#eee8f7"/>
  <g transform="rotate(-34 711 510)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="684" cy="510" r="27" stroke="#193743" stroke-width="7"/>
    <path d="M711 510h68m-14 0v21m-22-21v14" stroke="#193743" stroke-width="8"/>
  </g>

  <!-- The lens focuses on the join between wording, condition, and context. -->
  <path d="m499 458 86 95" stroke="#193743" stroke-width="24" stroke-linecap="round"/>
  <path d="m522 483 48 53" stroke="#7850c2" stroke-width="13" stroke-linecap="round"/>
  <circle cx="446" cy="397" r="83" fill="#fff" stroke="#177681" stroke-width="9"/>
  <path d="M382 397h40m48 0h40" stroke="#193743" stroke-width="6" stroke-linecap="round"/>
  <path d="m446 372 25 25-25 25-25-25z" fill="#ddd0ee" stroke="#7850c2" stroke-width="5"/>
  <path d="M397 360a62 62 0 0 1 40-24" fill="none" stroke="#c6e3e1" stroke-width="6" stroke-linecap="round"/>
</svg>
