<title id="cover-describing-the-problem-title">How Do We Describe the Problem So a Tool Can Check It?</title><desc id="cover-describing-the-problem-desc">A speech bubble containing phrase-like lines points toward connected objects: a circle, a task-shaped rectangle and a diamond. The scene illustrates translating descriptions into explicit model relationships, without presenting software output.</desc>
