<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="arrangements-assessments-cover-title arrangements-assessments-cover-desc">
  <title id="arrangements-assessments-cover-title">From Arrangements to Assessments</title>
  <desc id="arrangements-assessments-cover-desc">A shared frame of complete combinations branches into three assessment cards. Evidence examines possible interpretations, commitment checks an operating plan, and learning compares an investigation with responses to its results. Their different symbols and conclusion fields indicate that a common arrangement framework supports different kinds of judgment; it does not make those judgments interchangeable.</desc>
  <defs>
    <marker id="assessment-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="m2 2 8 4-8 4" fill="none" stroke="#8396a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <path d="M118 628h724" fill="none" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="480" cy="628" rx="278" ry="13" fill="#e8e8ee"/>

  <!-- The same combinatorial foundation supports assessments with distinct meanings. -->
  <g fill="none" stroke="#8396a2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#assessment-arrow)">
    <path d="M390 514v-43H220v-43"/>
    <path d="M480 514v-86"/>
    <path d="M570 514v-43h170v-43"/>
  </g>
  <rect x="242" y="514" width="476" height="103" rx="15" fill="#eee8f7" stroke="#193743" stroke-width="5"/>
  <g stroke="#193743" stroke-width="3" stroke-linejoin="round">
    <rect x="271" y="538" width="112" height="54" rx="7" fill="#fff"/>
    <rect x="424" y="538" width="112" height="54" rx="7" fill="#fff"/>
    <rect x="577" y="538" width="112" height="54" rx="7" fill="#fff"/>
  </g>
  <g fill="none" stroke="#bba9dc" stroke-width="4" stroke-linecap="round">
    <path d="M386 565h35m118 0h35"/>
  </g>
  <g>
    <circle cx="294" cy="565" r="10" fill="#177681"/>
    <rect x="317" y="555" width="20" height="20" rx="3" fill="#bba9dc"/>
    <path d="m355 553 12 23h-24z" fill="#177681"/>
    <circle cx="447" cy="565" r="10" fill="#177681"/>
    <rect x="470" y="555" width="20" height="20" rx="3" fill="#bba9dc"/>
    <path d="m508 553 12 23h-24z" fill="#177681"/>
    <circle cx="600" cy="565" r="10" fill="#177681"/>
    <rect x="623" y="555" width="20" height="20" rx="3" fill="#bba9dc"/>
    <path d="m661 553 12 23h-24z" fill="#177681"/>
  </g>

  <!-- Evidence: alternatives interpret fixed observations. -->
  <rect x="104" y="133" width="232" height="285" rx="18" fill="#fff" stroke="#193743" stroke-width="4"/>
  <path d="M104 191h232" stroke="#d3dfe5" stroke-width="3"/>
  <text x="220" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#193743">Evidence</text>
  <path d="m152 240 68 40 68-40m-136 90 68-50 68 50" fill="none" stroke="#bba9dc" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 8"/>
  <path d="M152 240v90m136-90v90" fill="none" stroke="#177681" stroke-width="4" stroke-linecap="round"/>
  <g fill="#c6e3e1" stroke="#193743" stroke-width="3">
    <circle cx="152" cy="240" r="12"/>
    <circle cx="288" cy="240" r="12"/>
    <circle cx="152" cy="330" r="12"/>
    <circle cx="288" cy="330" r="12"/>
  </g>
  <circle cx="220" cy="280" r="26" fill="#eee8f7" stroke="#7850c2" stroke-width="4"/>
  <path d="m237 300 17 20" fill="none" stroke="#7850c2" stroke-width="6" stroke-linecap="round"/>
  <rect x="126" y="361" width="188" height="35" rx="8" fill="#e6f2f0"/>
  <path d="M151 378h74m15 0h47" fill="none" stroke="#177681" stroke-width="5" stroke-linecap="round"/>

  <!-- Commitment: a complete plan is checked against its obligations. -->
  <rect x="364" y="133" width="232" height="285" rx="18" fill="#fff" stroke="#193743" stroke-width="4"/>
  <path d="M364 191h232" stroke="#d3dfe5" stroke-width="3"/>
  <text x="480" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#193743">Commitment</text>
  <rect x="403" y="224" width="154" height="113" rx="9" fill="#f6f3fa" stroke="#7850c2" stroke-width="3"/>
  <path d="M403 254h154m-103 0v83m51-83v83" fill="none" stroke="#bba9dc" stroke-width="3"/>
  <path d="M422 239h15m20 0h15m20 0h15m20 0h12" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round"/>
  <rect x="413" y="266" width="80" height="20" rx="4" fill="#c6e3e1"/>
  <rect x="465" y="301" width="81" height="20" rx="4" fill="#ddd0ee"/>
  <rect x="386" y="361" width="188" height="35" rx="8" fill="#eee8f7"/>
  <path d="m411 378 7 7 13-15m17 8h99" fill="none" stroke="#7850c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Learning: the investigation includes distinct responses to its possible results. -->
  <rect x="624" y="133" width="232" height="285" rx="18" fill="#fff" stroke="#193743" stroke-width="4"/>
  <path d="M624 191h232" stroke="#d3dfe5" stroke-width="3"/>
  <text x="740" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#193743">Learning</text>
  <path d="M740 265v16h-58v27m58-27h58v27" fill="none" stroke="#177681" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="740" cy="239" r="26" fill="#e6f2f0" stroke="#177681" stroke-width="3"/>
  <path d="M732 232c0-10 18-11 18 0 0 7-10 7-10 15m0 8v1" fill="none" stroke="#177681" stroke-width="4" stroke-linecap="round"/>
  <rect x="655" y="308" width="54" height="28" rx="6" fill="#c6e3e1" stroke="#193743" stroke-width="3"/>
  <rect x="771" y="308" width="54" height="28" rx="6" fill="#ddd0ee" stroke="#193743" stroke-width="3"/>
  <path d="M667 322h30m86 0h30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="646" y="361" width="188" height="35" rx="8" fill="#e6f2f0"/>
  <path d="M674 378h30m14-7v14m16-7h72" fill="none" stroke="#177681" stroke-width="5" stroke-linecap="round"/>
</svg>
