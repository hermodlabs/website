<title id="cover-more-than-one-arrangement-title">What If More Than One Arrangement Works?</title><desc id="cover-more-than-one-arrangement-desc">A report reaches a fork. One branch leads to a calendar with a moved appointment; the other leads to a fee represented by coins. The cover depicts alternative tradeoffs without ranking them.</desc>
