<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="cover-no-arrangement-works-title cover-no-arrangement-works-desc">
<title id="cover-no-arrangement-works-title">What Does It Mean When No Arrangement Works?</title><desc id="cover-no-arrangement-works-desc">A cabinet offers two review slots while a third folder remains outside. The capacity metaphor illustrates a shortfall in the stated options and invites reconsidering the conditions; it does not claim that all real-world options have been exhausted.</desc>
