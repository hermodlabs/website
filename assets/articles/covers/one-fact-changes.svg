<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="cover-one-fact-changes-title cover-one-fact-changes-desc">
<title id="cover-one-fact-changes-title">What Changes When One Fact Changes?</title><desc id="cover-one-fact-changes-desc">A large clock retains its fixed noon boundary while teal and purple arcs suggest an earlier and a shifted availability window. A report connects the change to dependent work. This is an editorial timing metaphor rather than a measured schedule.</desc>
