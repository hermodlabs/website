<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="article-19-cover-title article-19-cover-desc">
  <title id="article-19-cover-title">Requirements Engineering for Human Decisions</title>
  <desc id="article-19-cover-desc">A target for the desired outcome is connected backward to three different supporting conditions: a material test, a delivery, and the total-cost record. Small open junctions distinguish the connected requirements from an automatic claim of success.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="348" r="286" fill="#fff"/>
  <path d="M163 619h636" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="478" cy="619" rx="267" ry="13" fill="#e8e8ee"/>

  <!-- Work from the desired outcome toward its supporting conditions. -->
  <path d="M481 299v63m0 0H261q-28 0-28 28v38m248-66v72m0-72h221q28 0 28 28v38" fill="none" stroke="#193743" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m219 411 14 17 14-17m220 6 14 17 14-17m221-6 14 17 14-17" fill="none" stroke="#177681" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="481" cy="362" r="11" fill="#fff" stroke="#7850c2" stroke-width="5"/>

  <!-- A purpose sits above the requirement branches. -->
  <circle cx="481" cy="216" r="86" fill="#eee8f7" stroke="#193743" stroke-width="5"/>
  <circle cx="481" cy="216" r="56" fill="#fff" stroke="#7850c2" stroke-width="5"/>
  <circle cx="481" cy="216" r="23" fill="#c6e3e1" stroke="#177681" stroke-width="5"/>
  <path d="m485 212 80-76m-26 1 27-2-2 27" fill="none" stroke="#193743" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Test evidence: a flask, with its defined contents. -->
  <g stroke="#193743" stroke-linejoin="round" stroke-linecap="round">
    <path d="M210 435h46m-37 0v60l-49 80q-11 20 13 20h101q24 0 13-20l-49-80v-60" fill="#e6f2f0" stroke-width="5"/>
    <path d="m193 543-22 36q-5 9 8 9h109q13 0 8-9l-22-36z" fill="#c6e3e1" stroke="none"/>
    <path d="M197 543h76" fill="none" stroke="#177681" stroke-width="5"/>
    <circle cx="228" cy="568" r="5" fill="#177681" stroke="none"/>
    <circle cx="251" cy="553" r="4" fill="#177681" stroke="none"/>
  </g>

  <!-- A required delivery, including the scope of the material. -->
  <g stroke="#193743" stroke-width="5" stroke-linejoin="round">
    <path d="m403 469 78-30 78 30-78 32z" fill="#f6f3fa"/>
    <path d="m403 469 78 32v102l-78-34z" fill="#eee8f7"/>
    <path d="m481 501 78-32v100l-78 34z" fill="#ddd0ee"/>
    <path d="m445 453 78 32v43l-27 11v-44l-78-31" fill="#fff"/>
    <path d="m420 535 36 15m-36 1 23 10" fill="none" stroke="#7850c2" stroke-linecap="round"/>
  </g>

  <!-- A total-cost record retains more than purchase price. -->
  <g stroke="#193743" stroke-linejoin="round" stroke-linecap="round">
    <path d="M668 435h126v162l-16-10-16 10-16-10-16 10-16-10-16 10-16-10-14 10z" fill="#fff" stroke-width="5"/>
    <path d="M690 466h79m-79 28h54m-54 27h79" fill="none" stroke="#bba9dc" stroke-width="6"/>
    <path d="M690 552h79" fill="none" stroke="#193743" stroke-width="5"/>
    <circle cx="680" cy="577" r="24" fill="#c6e3e1" stroke-width="4"/>
    <path d="M671 577h18m-9-9v18" fill="none" stroke="#177681" stroke-width="4"/>
  </g>
</svg>
