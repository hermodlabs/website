<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="article-20-cover-title article-20-cover-desc">
  <title id="article-20-cover-title">Systems Engineering for Human Decisions</title>
  <desc id="article-20-cover-desc">An incoming material parcel passes through an inspection station toward production on a common platform. Two people attend the handoffs. A pale dashed system boundary frames the connected work, emphasizing the interfaces and resources of the complete operation.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="349" r="286" fill="#fff"/>
  <rect x="258" y="169" width="552" height="404" rx="39" fill="#f6f8f8" stroke="#b6ced2" stroke-width="4" stroke-dasharray="12 13"/>
  <path d="M141 619h679" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="486" cy="619" rx="279" ry="13" fill="#e8e8ee"/>

  <!-- A broad operating platform joins the specialties. -->
  <rect x="155" y="451" width="653" height="75" rx="27" fill="#e5dfed" stroke="#193743" stroke-width="5"/>
  <path d="M181 475h599" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M193 526v53m574-53v53" stroke="#193743" stroke-width="9" stroke-linecap="round"/>
  <g fill="#fff" stroke="#193743" stroke-width="5">
    <circle cx="208" cy="496" r="11"/><circle cx="286" cy="496" r="11"/><circle cx="364" cy="496" r="11"/>
    <circle cx="442" cy="496" r="11"/><circle cx="520" cy="496" r="11"/><circle cx="598" cy="496" r="11"/>
    <circle cx="676" cy="496" r="11"/><circle cx="754" cy="496" r="11"/>
  </g>

  <!-- Material identity crosses the receiving interface. -->
  <g stroke="#193743" stroke-width="5" stroke-linejoin="round">
    <path d="m163 336 69-27 69 27-69 29z" fill="#f6f3fa"/>
    <path d="m163 336 69 29v86l-69-29z" fill="#eee8f7"/>
    <path d="m232 365 69-29v86l-69 29z" fill="#ddd0ee"/>
    <path d="m199 322 69 28v33l-23 10v-34l-69-28" fill="#fff"/>
  </g>
  <path d="M326 401h40m-13-12 13 12-13 12" fill="none" stroke="#177681" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inspection has a defined handoff into production. -->
  <rect x="393" y="382" width="78" height="69" rx="8" fill="#c6e3e1" stroke="#193743" stroke-width="5"/>
  <path d="m477 345 35 37" stroke="#193743" stroke-width="13" stroke-linecap="round"/>
  <circle cx="447" cy="312" r="47" fill="#fff" stroke="#7850c2" stroke-width="7"/>
  <path d="M428 309h38m-31 16h24" stroke="#bba9dc" stroke-width="6" stroke-linecap="round"/>
  <path d="M498 418h34m-13-12 13 12-13 12" fill="none" stroke="#177681" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Production needs the material, the information, and a usable time slot. -->
  <g stroke="#193743" stroke-linejoin="round" stroke-linecap="round">
    <path d="M555 451V324l66 40v-40l66 40v-40l66 40v87z" fill="#e6f2f0" stroke-width="5"/>
    <rect x="574" y="278" width="31" height="58" rx="4" fill="#c6e3e1" stroke-width="5"/>
    <path d="M581 400h23v28h-23zm58 0h23v28h-23zm58 0h23v28h-23z" fill="#fff" stroke-width="4"/>
  </g>

  <!-- People remain part of the system, attending its interfaces. -->
  <g stroke="#193743" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="340" cy="225" r="26" fill="#ddd0ee"/>
    <path d="M299 309v-30q0-24 41-24t41 24v30" fill="#eee8f7"/>
    <path d="M312 291v18m56-18v18" fill="none"/>
    <circle cx="701" cy="214" r="26" fill="#c6e3e1"/>
    <path d="M660 298v-30q0-24 41-24t41 24v30" fill="#e6f2f0"/>
    <path d="M673 280v18m56-18v18" fill="none"/>
  </g>
</svg>
