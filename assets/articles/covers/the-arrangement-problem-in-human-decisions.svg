<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="article-22-cover-title article-22-cover-desc">
  <title id="article-22-cover-title">The Arrangement Problem in Human Decisions</title>
  <desc id="article-22-cover-desc">Three activity groups each contain three units. Two groups fit inside an eight-space shared-capacity tray; the third remains above it, with its last unit extending beyond the tray boundary. The illustration reflects the article’s example in which every pair fits but all three exceed shared capacity.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="349" r="286" fill="#fff"/>
  <path d="M139 619h690" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="472" cy="619" rx="278" ry="13" fill="#e8e8ee"/>

  <!-- One shared resource has eight spaces, not nine. -->
  <path d="M170 403h608v148q0 29-29 29H199q-29 0-29-29z" fill="#e5dfed" stroke="#193743" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 403h608v93H170z" fill="#f6f3fa" stroke="#193743" stroke-width="6"/>
  <path d="M246 403v93m76-93v93m76-93v93m76-93v93m76-93v93m76-93v93m76-93v93" fill="none" stroke="#bba9dc" stroke-width="4"/>
  <path d="M200 542h546" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Two three-unit activities can fit together. -->
  <g stroke="#193743" stroke-width="5" stroke-linejoin="round">
    <path d="M177 360h214v122H177z" fill="#c6e3e1"/>
    <path d="M248 360v122m72-122v122" fill="none" stroke="#177681" stroke-width="4"/>
    <path d="M405 360h214v122H405z" fill="#ddd0ee"/>
    <path d="M476 360v122m72-122v122" fill="none" stroke="#7850c2" stroke-width="4"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M197 386h28m43 0h28m44 0h28" stroke="#fff"/>
    <path d="M425 386h28m43 0h28m44 0h28" stroke="#f6f3fa"/>
  </g>

  <!-- The third group introduces one more unit than the resource can hold. -->
  <path d="M633 249h214v122H633z" fill="#e6f2f0" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="M704 249v122m72-122v122" fill="none" stroke="#177681" stroke-width="4"/>
  <path d="M653 275h28m43 0h28m44 0h28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M668 317v68m-13-14 13 14 13-14m62-54v68m-13-14 13 14 13-14" fill="none" stroke="#177681" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M778 223v331" fill="none" stroke="#7850c2" stroke-width="4" stroke-dasharray="9 11"/>
  <path d="M794 404h53" stroke="#7850c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 9"/>

  <!-- A separate arrangement changes the combination, not the available capacity. -->
  <path d="M239 273q57-59 133-45m-22-16 23 17-24 12" fill="none" stroke="#bba9dc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
