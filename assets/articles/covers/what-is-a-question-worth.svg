<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="what-is-a-question-worth-title what-is-a-question-worth-desc">
<title id="what-is-a-question-worth-title">What Is a Question Worth?</title><desc id="what-is-a-question-worth-desc">An acting-now Backup option at 6,000 dollars is compared with checking registration and responding to its observable report. A valid confirmation can support Direct at 4,000 dollars; another report retains Backup at 6,000. Fee, timing and action availability enter the complete expected-outcome comparison. Neither the favorable report nor a realized payoff is guaranteed.</desc>
