<title id="what-must-the-evidence-establish-title">What Must the Evidence Establish?</title><desc id="what-must-the-evidence-establish-desc">Three fixed observation records lead to three admissible interpretations. Their secondary details differ, but each gives Yes to the required question. A completed counterexample check and nonempty consistent basis establish that answer while allowing other details to remain open.</desc>
