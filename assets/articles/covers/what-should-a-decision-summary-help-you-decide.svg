<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="decision-summary-cover-title decision-summary-cover-desc">
  <title id="decision-summary-cover-title">What should a decision summary help you decide?</title>
  <desc id="decision-summary-cover-desc">A question leads to a focused finding above a comparison of complete alternatives. The finding keeps its declared priority, qualifying conditions and supporting basis attached. A separate next-action symbol represents the human or operating process that decides what to do with the finding.</desc>
  <defs>
    <marker id="decision-summary-cover-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 2 8 4-8 4" fill="none" stroke="#637d88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="290" fill="#fff"/>
  <ellipse cx="480" cy="641" rx="286" ry="13" fill="#e8e8ee"/>

  <rect x="300" y="75" width="360" height="86" rx="16" fill="#fff" stroke="#193743" stroke-width="4"/>
  <circle cx="345" cy="118" r="23" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/>
  <path d="M338 111c0-10 17-10 17 0 0 6-9 7-9 13m0 8v1" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round"/>
  <text x="386" y="127" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#193743">The question</text>
  <path d="M480 164v27" fill="none" stroke="#637d88" stroke-width="3" marker-end="url(#decision-summary-cover-arrow)"/>

  <rect x="188" y="207" width="584" height="322" rx="18" fill="#fff" stroke="#193743" stroke-width="4"/>
  <path d="M188 300h584" stroke="#d3dfe5" stroke-width="3"/>
  <rect x="213" y="230" width="534" height="48" rx="9" fill="#e6f2f0"/>
  <circle cx="243" cy="254" r="13" fill="#fff" stroke="#177681" stroke-width="2"/>
  <path d="m237 254 4 5 9-10" fill="none" stroke="#177681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="277" y="263" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#177681">Focused finding</text>

  <text x="480" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#637d88">COMPLETE ALTERNATIVES</text>
  <g stroke="#d3dfe5" stroke-width="2">
    <rect x="215" y="355" width="160" height="91" rx="9" fill="#e6f2f0" stroke="#177681"/>
    <rect x="400" y="355" width="160" height="91" rx="9" fill="#fff"/>
    <rect x="585" y="355" width="160" height="91" rx="9" fill="#fff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#193743" text-anchor="middle">
    <text x="295" y="394">A</text><text x="480" y="394">B</text><text x="665" y="394">C</text>
  </g>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M246 420h97" stroke="#177681"/><path d="M431 420h97m88 0h97" stroke="#bba9dc"/>
  </g>
  <path d="M215 469h530" stroke="#d3dfe5" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="295" y="502" fill="#7850c2">Priority</text><text x="480" y="502" fill="#193743">Conditions</text><text x="665" y="502" fill="#177681">Basis</text>
  </g>

  <path d="M480 532v30" fill="none" stroke="#637d88" stroke-width="3" stroke-dasharray="5 6"/>
  <rect x="299" y="575" width="362" height="65" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/>
  <circle cx="337" cy="599" r="8" fill="none" stroke="#7850c2" stroke-width="3"/>
  <path d="M324 625v-7c0-12 26-12 26 0v7" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round"/>
  <text x="380" y="617" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7850c2">Next action</text>
</svg>
