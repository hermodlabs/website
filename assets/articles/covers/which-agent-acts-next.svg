<title id="cover-which-agent-acts-next-title">Which Agent Should Act Next—and What Must Happen Afterward?</title><desc id="cover-which-agent-acts-next-desc">A central coordinator robot links queued draft cards, a specialist worker and a deadline clock. The editorial scene emphasizes that routing, sequencing and dependencies must fit together; it asserts no completed check or release.</desc>
