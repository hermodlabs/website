<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1460" viewBox="0 0 600 1460" role="img" aria-labelledby="reading-decision-mobile-title reading-decision-mobile-desc">
  <title id="reading-decision-mobile-title">Six questions to ask of a decision report</title>
  <desc id="reading-decision-mobile-desc">Read the focused finding together with its complete alternatives, declared priority, qualifying conditions and supporting basis. Then identify the remaining action for people or the operating process. This is a guide to interpreting calculated findings, not a sequence that computes, chooses or authorizes an action.</desc>
  <rect width="600" height="1460" rx="18" fill="#f6f5f8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="32" y="56" font-size="34" font-weight="700">Six questions to ask</text>
    <text x="32" y="98" font-size="34" font-weight="700">of a decision report</text>
    <text x="32" y="141" font-size="25" fill="#526b77">Keep the basis and limits attached.</text>
  </g>

  <rect x="32" y="180" width="536" height="170" rx="13" fill="#e6f2f0" stroke="#177681" stroke-width="2"/>
  <circle cx="75" cy="224" r="23" fill="#177681"/>
  <text x="75" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">1</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="233" font-size="28" font-weight="700">What has been established?</text>
    <text x="58" y="281" font-size="27">A focused finding with its scope</text>
    <text x="58" y="317" font-size="27">and calculation status.</text>
  </g>

  <rect x="32" y="378" width="536" height="170" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="75" cy="422" r="23" fill="#193743"/>
  <text x="75" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">2</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="431" font-size="28" font-weight="700">Which alternatives fit?</text>
    <text x="58" y="479" font-size="27">Compare complete alternatives</text>
    <text x="58" y="515" font-size="27">on the same declared basis.</text>
  </g>

  <rect x="32" y="576" width="536" height="170" rx="13" fill="#eee8f7" stroke="#bba9dc" stroke-width="2"/>
  <circle cx="75" cy="620" r="23" fill="#7850c2"/>
  <text x="75" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">3</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="629" font-size="28" font-weight="700">What is preferred, and why?</text>
    <text x="58" y="677" font-size="27">Read the declared policy. Preserve</text>
    <text x="58" y="713" font-size="27">genuine ties or no preference.</text>
  </g>

  <rect x="32" y="774" width="536" height="170" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="75" cy="818" r="23" fill="#193743"/>
  <text x="75" y="826" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">4</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="827" font-size="28" font-weight="700">What qualifies the finding?</text>
    <text x="58" y="875" font-size="27">Keep blockers, missing information</text>
    <text x="58" y="911" font-size="27">and outstanding conditions visible.</text>
  </g>

  <rect x="32" y="972" width="536" height="170" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="75" cy="1016" r="23" fill="#193743"/>
  <text x="75" y="1024" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">5</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="1025" font-size="28" font-weight="700">What is its basis?</text>
    <text x="58" y="1073" font-size="27">Inspect records, requirements and</text>
    <text x="58" y="1109" font-size="27">assumptions in supporting reports.</text>
  </g>

  <path d="M32 1180h536" fill="none" stroke="#9cabb3" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="32" y="1218" width="536" height="204" rx="13" fill="#fff" stroke="#7850c2" stroke-width="2"/>
  <circle cx="75" cy="1262" r="23" fill="#7850c2"/>
  <text x="75" y="1270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">6</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="116" y="1271" font-size="28" font-weight="700">What action remains?</text>
    <text x="58" y="1319" font-size="27">People and operating processes</text>
    <text x="58" y="1355" font-size="27">investigate, choose, obtain</text>
    <text x="58" y="1391" font-size="27">authorization, or carry out work.</text>
  </g>
</svg>
