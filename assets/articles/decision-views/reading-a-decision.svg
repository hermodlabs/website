<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="reading-decision-title reading-decision-desc">
  <title id="reading-decision-title">Six questions to ask of a decision view</title>
  <desc id="reading-decision-desc">Read the focused finding together with its complete alternatives, declared priority, qualifying conditions and supporting basis. Then identify the remaining action for people or the operating process. This is a guide to interpreting calculated findings, not a sequence that computes, chooses or authorizes an action.</desc>
  <rect width="1200" height="850" rx="18" fill="#f6f5f8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="50" y="58" font-size="35" font-weight="700">Six questions to ask of a decision view</text>
    <text x="50" y="96" font-size="24" fill="#526b77">Read the finding together with its basis and limits.</text>
  </g>

  <rect x="50" y="132" width="1100" height="128" rx="13" fill="#e6f2f0" stroke="#177681" stroke-width="2"/>
  <circle cx="92" cy="176" r="23" fill="#177681"/>
  <text x="92" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">1</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="133" y="185" font-size="28" font-weight="700">What has been established?</text>
    <text x="133" y="226" font-size="24">A focused finding with its scope and calculation status.</text>
  </g>

  <rect x="50" y="292" width="535" height="142" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="92" cy="334" r="23" fill="#193743"/>
  <text x="92" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">2</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="133" y="343" font-size="27" font-weight="700">Which alternatives fit?</text>
    <text x="76" y="387" font-size="24">Compare complete alternatives on</text>
    <text x="76" y="418" font-size="24">the same declared basis.</text>
  </g>

  <rect x="615" y="292" width="535" height="142" rx="13" fill="#eee8f7" stroke="#bba9dc" stroke-width="2"/>
  <circle cx="657" cy="334" r="23" fill="#7850c2"/>
  <text x="657" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="698" y="343" font-size="27" font-weight="700">What is preferred, and why?</text>
    <text x="641" y="387" font-size="24">Read the declared policy.</text>
    <text x="641" y="418" font-size="24">Preserve genuine ties or no preference.</text>
  </g>

  <rect x="50" y="466" width="535" height="142" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="92" cy="508" r="23" fill="#193743"/>
  <text x="92" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">4</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="133" y="517" font-size="27" font-weight="700">What qualifies the finding?</text>
    <text x="76" y="561" font-size="24">Keep blockers, missing information</text>
    <text x="76" y="592" font-size="24">and outstanding conditions visible.</text>
  </g>

  <rect x="615" y="466" width="535" height="142" rx="13" fill="#fff" stroke="#d3dfe5" stroke-width="2"/>
  <circle cx="657" cy="508" r="23" fill="#193743"/>
  <text x="657" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">5</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="698" y="517" font-size="27" font-weight="700">What is its basis?</text>
    <text x="641" y="561" font-size="24">Inspect relevant records, requirements</text>
    <text x="641" y="592" font-size="24">and assumptions in supporting reports.</text>
  </g>

  <path d="M50 652h1100" fill="none" stroke="#9cabb3" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="50" y="694" width="1100" height="116" rx="13" fill="#fff" stroke="#7850c2" stroke-width="2"/>
  <circle cx="92" cy="738" r="23" fill="#7850c2"/>
  <text x="92" y="746" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">6</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193743">
    <text x="133" y="747" font-size="28" font-weight="700">What action remains for people or the operating process?</text>
    <text x="133" y="788" font-size="24">Investigate, choose, obtain authorization, or carry out the work.</text>
  </g>
</svg>
