<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="pattern-catalog-title pattern-catalog-desc">
  <title id="pattern-catalog-title">Recognizable decision structures</title>
  <desc id="pattern-catalog-desc">A recurring decision question connects complete responses to three kinds of assessment: evidence, commitment and information value. Smaller checks support the assessments. This is a conceptual map, not a workflow or app screenshot.</desc>
  <defs><marker id="pattern-catalog-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="226" y="88" width="508" height="96" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="480" y="128" text-anchor="middle" font-size="30" fill="#443052" font-weight="700">What can we support?</text><text x="480" y="160" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">A recurring decision question</text><path d="M480 184v49" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-catalog-arrow)"/><rect x="276" y="240" width="408" height="87" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="480" y="276" text-anchor="middle" font-size="26" fill="#443052" font-weight="700">Compare complete responses</text><text x="480" y="307" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Preserve the obligations and limits</text><path d="M480 327v42H218v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-catalog-arrow)"/><path d="M480 327v77" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-catalog-arrow)"/><path d="M480 369h262v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-catalog-arrow)"/><rect x="108" y="412" width="220" height="147" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="218" y="452" text-anchor="middle" font-size="23" fill="#443052" font-weight="700">Evidence</text><text x="218" y="491" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">What do records</text><text x="218" y="520" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">establish?</text><rect x="370" y="412" width="220" height="147" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="480" y="452" text-anchor="middle" font-size="23" fill="#443052" font-weight="700">Commitment</text><text x="480" y="491" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Which arrangements</text><text x="480" y="520" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">meet the obligations?</text><rect x="632" y="412" width="220" height="147" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="742" y="452" text-anchor="middle" font-size="23" fill="#443052" font-weight="700">Information value</text><text x="742" y="491" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Is investigating</text><text x="742" y="520" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">worthwhile?</text><text x="480" y="603" text-anchor="middle" font-size="22" fill="#6e617a" font-weight="400">Supporting checks · capacity · timing · scope</text>  </g>
</svg>

