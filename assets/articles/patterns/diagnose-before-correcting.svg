<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="diagnose-correct-title diagnose-correct-desc">
  <title id="diagnose-correct-title">Diagnose Before Correcting</title>
  <desc id="diagnose-correct-desc">Fixed observations are assessed through admissible interpretations. A supported conclusion informs a separate correction choice. The assessment does not let a preferred remedy select its own explanation.</desc>
  <defs><marker id="diagnose-correct-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="115" y="105" width="245" height="160" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="237" y="151" text-anchor="middle" font-size="27" fill="#443052" font-weight="700">Fixed</text><text x="237" y="186" text-anchor="middle" font-size="27" fill="#443052" font-weight="700">observations</text><path d="M153 218h167m-167 23h111" stroke="#ab94c8" stroke-width="7" stroke-linecap="round"/><path d="M360 184h62" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#diagnose-correct-arrow)"/><rect x="440" y="94" width="404" height="260" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="642" y="140" text-anchor="middle" font-size="25" fill="#443052" font-weight="700">Admissible interpretations</text><rect x="475" y="173" width="141" height="65" rx="8" fill="#faf8fd" stroke="#ab94c8" stroke-width="3"/><path d="M496 196h97m-97 20h70" stroke="#ab94c8" stroke-width="5" stroke-linecap="round"/><rect x="660" y="173" width="141" height="65" rx="8" fill="#faf8fd" stroke="#ab94c8" stroke-width="3"/><path d="M681 196h97m-97 20h70" stroke="#ab94c8" stroke-width="5" stroke-linecap="round"/><rect x="568" y="253" width="141" height="65" rx="8" fill="#faf8fd" stroke="#ab94c8" stroke-width="3"/><path d="M589 276h97m-97 20h70" stroke="#ab94c8" stroke-width="5" stroke-linecap="round"/><path d="M642 354v57H480v30" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#diagnose-correct-arrow)"/><rect x="248" y="450" width="464" height="68" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="480" y="492" text-anchor="middle" font-size="26" fill="#443052" font-weight="700">Supported answer and its limits</text><path d="M480 518v37" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#diagnose-correct-arrow)"/><text x="480" y="600" text-anchor="middle" font-size="27" fill="#292331" font-weight="400">Then assess a complete correction</text>  </g>
</svg>

