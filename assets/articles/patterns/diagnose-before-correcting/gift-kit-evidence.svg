<svg xmlns="http://www.w3.org/2000/svg" width="400" height="720" viewBox="0 0 400 720" role="img" aria-labelledby="gift-kit-evidence-title gift-kit-evidence-desc">
  <title id="gift-kit-evidence-title">Gift-kit evidence: establish the faults before comparing corrections</title>
  <desc id="gift-kit-evidence-desc">A relationship map, not a timeline or causal diagram. Supplied records say the printed code is unreadable, the artwork points to the wrong destination, and checkout is usable. Evidence Assessment examines admissible interpretations of those fixed observations under the declared model, which allows faults to occur together. The evidence establishes both a printed-code fault and a destination fault. That finding supports comparing complete corrections that address both faults. Correction timing and cost require a separate assessment; this map does not select a correction or establish its operating feasibility.</desc>
  <defs>
    <marker id="gift-kit-evidence-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="720" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#292331">
    <rect x="16" y="12" width="368" height="202" rx="12" fill="#f8f7fa" stroke="#d4cedd" stroke-width="1.5"/>
    <text x="200" y="41" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">SELECTED RECORDS</text>
    <text x="200" y="81" font-size="22"><tspan x="200">Print unreadable</tspan><tspan x="200" dy="42">Artwork: wrong destination</tspan><tspan x="200" dy="42">Checkout usable</tspan></text>

    <path d="M200 215V249" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#gift-kit-evidence-arrow)"/>
    <text x="216" y="231" text-anchor="start" font-size="18" fill="#655c70"><tspan x="216">assessed under</tspan><tspan x="216" dy="18">the model</tspan></text>

    <rect x="16" y="258" width="368" height="124" rx="12" fill="#eee8f8" stroke="#7850c2" stroke-width="1.5"/>
    <text x="200" y="283" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">ASSESSMENT</text>
    <text x="200" y="315" font-size="22" font-weight="700" fill="#443052">Evidence Assessment</text>
    <text x="200" y="344" font-size="20"><tspan x="200">Which faults do</tspan><tspan x="200" dy="25">the observations establish?</tspan></text>

    <path d="M200 383V417" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#gift-kit-evidence-arrow)"/>
    <text x="216" y="409" text-anchor="start" font-size="18" fill="#655c70">establishes</text>

    <rect x="16" y="426" width="368" height="108" rx="12" fill="#ffffff" stroke="#7850c2" stroke-width="1.5"/>
    <text x="200" y="450" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">FINDING</text>
    <text x="200" y="477" font-size="22" font-weight="700"><tspan x="200">Printed-code AND</tspan><tspan x="200" dy="24">destination faults</tspan><tspan x="200" dy="24">established</tspan></text>

    <path d="M200 535V569" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#gift-kit-evidence-arrow)"/>
    <text x="216" y="561" text-anchor="start" font-size="18" fill="#655c70">supports</text>

    <rect x="16" y="578" width="368" height="130" rx="12" fill="#f8f7fa" stroke="#d4cedd" stroke-width="1.5"/>
    <text x="200" y="603" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">NEXT DECISION</text>
    <text x="200" y="634" font-size="21" font-weight="700">Compare complete corrections</text>
    <text x="200" y="661" font-size="20"><tspan x="200">Address both faults.</tspan><tspan x="200" dy="25">Check time and cost separately.</tspan></text>
  </g>
</svg>
