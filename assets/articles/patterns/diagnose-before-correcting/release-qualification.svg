<svg xmlns="http://www.w3.org/2000/svg" width="400" height="720" viewBox="0 0 400 720" role="img" aria-labelledby="release-qualification-title release-qualification-desc">
  <title id="release-qualification-title">Release recovery: check whether additional help can satisfy the requirements</title>
  <desc id="release-qualification-desc">A relationship map, not a timeline or causal diagram. Supplied records show twenty QA hours remaining, sixteen existing QA hours, an offer of four more hours for four hundred dollars, and a qualification record naming another build. Commitment Assessment checks complete arrangements against the declared requirements. Current-build qualification is not established, so the additional-help arrangement is blocked. That finding supports establishing actual qualification and availability or assessing another response. A record naming another build does not establish that the tester is incapable, and the arithmetic does not establish that the offered help is feasible or preferred.</desc>
  <defs>
    <marker id="release-qualification-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="720" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#292331">
    <rect x="16" y="12" width="368" height="202" rx="12" fill="#f8f7fa" stroke="#d4cedd" stroke-width="1.5"/>
    <text x="200" y="41" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">SELECTED RECORDS</text>
    <text x="200" y="76" font-size="22"><tspan x="200">Jira: 20 QA hours remain</tspan><tspan x="200" dy="34">16 existing QA hours</tspan><tspan x="200" dy="34">4-hour offer: $400</tspan><tspan x="200" dy="34">Qualification: another build</tspan></text>

    <path d="M200 215V249" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#release-qualification-arrow)"/>
    <text x="216" y="231" text-anchor="start" font-size="18" fill="#655c70"><tspan x="216">assessed under</tspan><tspan x="216" dy="18">the model</tspan></text>

    <rect x="16" y="258" width="368" height="124" rx="12" fill="#eee8f8" stroke="#7850c2" stroke-width="1.5"/>
    <text x="200" y="283" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">ASSESSMENT</text>
    <text x="200" y="315" font-size="22" font-weight="700" fill="#443052">Commitment Assessment</text>
    <text x="200" y="344" font-size="20"><tspan x="200">Does the complete</tspan><tspan x="200" dy="25">arrangement meet the rules?</tspan></text>

    <path d="M200 383V417" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#release-qualification-arrow)"/>
    <text x="216" y="409" text-anchor="start" font-size="18" fill="#655c70">establishes</text>

    <rect x="16" y="426" width="368" height="108" rx="12" fill="#ffffff" stroke="#7850c2" stroke-width="1.5"/>
    <text x="200" y="450" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">FINDING</text>
    <text x="200" y="477" font-size="20" font-weight="700"><tspan x="200">Current-build qualification</tspan><tspan x="200" dy="24">not established;</tspan><tspan x="200" dy="24">additional-help plan blocked</tspan></text>

    <path d="M200 535V569" fill="none" stroke="#7850c2" stroke-width="1.8" marker-end="url(#release-qualification-arrow)"/>
    <text x="216" y="561" text-anchor="start" font-size="18" fill="#655c70">supports</text>

    <rect x="16" y="578" width="368" height="130" rx="12" fill="#f8f7fa" stroke="#d4cedd" stroke-width="1.5"/>
    <text x="200" y="603" font-size="17" font-weight="700" letter-spacing="1" fill="#655c70">NEXT DECISION</text>
    <text x="200" y="634" font-size="21" font-weight="700">Establish actual qualification</text>
    <text x="200" y="661" font-size="20"><tspan x="200">and availability, or assess</tspan><tspan x="200" dy="25">another response.</tspan></text>
  </g>
</svg>
