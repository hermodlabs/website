<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="explore-commitment-title explore-commitment-desc">
  <title id="explore-commitment-title">Explore a Disrupted Commitment</title>
  <desc id="explore-commitment-desc">The same original scope and deadline are retained while an external tester's qualification changes. A qualification matching this build supports an arrangement; a qualification for another build blocks it. The drawing illustrates a controlled variation, not app output.</desc>
  <defs><marker id="explore-commitment-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="116" y="92" width="728" height="98" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="480" y="135" text-anchor="middle" font-size="30" fill="#443052" font-weight="700">Same original scope and deadline</text><text x="480" y="169" text-anchor="middle" font-size="22" fill="#292331" font-weight="400">Change one supporting record</text><path d="M480 190v53H275v41" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#explore-commitment-arrow)"/><path d="M480 243h205v41" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#explore-commitment-arrow)"/><rect x="111" y="294" width="318" height="276" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="270" y="339" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Matching build</text><text x="270" y="389" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Qualification covers</text><text x="270" y="424" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">this release</text><circle cx="270" cy="477" r="20" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><path d="m261 477 6 7 13-15" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="537" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Arrangement passes</text><rect x="531" y="294" width="318" height="276" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="690" y="339" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Another build</text><text x="690" y="389" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Qualification covers</text><text x="690" y="424" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">a different release</text><circle cx="690" cy="477" r="20" fill="#f5f3f7" stroke="#7a7085" stroke-width="3"/><path d="m683 470 14 14m0-14-14 14" fill="none" stroke="#7a7085" stroke-width="4" stroke-linecap="round"/><text x="690" y="537" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Arrangement blocked</text><text x="480" y="618" text-anchor="middle" font-size="24" fill="#6e617a" font-weight="400">Same headcount and fee. Different operating support.</text>  </g>
</svg>

