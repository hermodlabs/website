<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="investigate-act-title investigate-act-desc">
  <title id="investigate-act-title">Investigate Before Acting</title>
  <desc id="investigate-act-desc">Acting now is compared with an investigation and responses to its possible reports. The investigation's fee and delay belong in the comparison, and each response must be available in time.</desc>
  <defs><marker id="investigate-act-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="113" y="102" width="734" height="90" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="480" y="141" text-anchor="middle" font-size="26" fill="#443052" font-weight="700">Which complete response has better modeled value?</text><text x="480" y="173" text-anchor="middle" font-size="22" fill="#292331" font-weight="400">Include the fee, delay and available actions</text><path d="M480 192v49H267v41" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#investigate-act-arrow)"/><path d="M480 241h213v41" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#investigate-act-arrow)"/><rect x="115" y="291" width="306" height="204" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="268" y="340" text-anchor="middle" font-size="29" fill="#443052" font-weight="700">Act now</text><text x="268" y="385" text-anchor="middle" font-size="24" fill="#292331" font-weight="400">Best supported</text><text x="268" y="418" text-anchor="middle" font-size="24" fill="#292331" font-weight="400">outside option</text><rect x="540" y="291" width="306" height="90" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="693" y="330" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Investigate</text><text x="693" y="362" text-anchor="middle" font-size="22" fill="#292331" font-weight="400">Fee + time</text><path d="M693 381v40H609v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#investigate-act-arrow)"/><path d="M693 421h83v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#investigate-act-arrow)"/><rect x="544" y="465" width="131" height="87" rx="10" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="609" y="499" text-anchor="middle" font-size="21" fill="#292331" font-weight="400">Report A</text><text x="609" y="529" text-anchor="middle" font-size="18" fill="#292331" font-weight="400">Response A</text><rect x="711" y="465" width="131" height="87" rx="10" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="776" y="499" text-anchor="middle" font-size="21" fill="#292331" font-weight="400">Report B</text><text x="776" y="529" text-anchor="middle" font-size="18" fill="#292331" font-weight="400">Response B</text><text x="480" y="609" text-anchor="middle" font-size="25" fill="#6e617a" font-weight="400">Learning matters through what we can do with it</text>  </g>
</svg>

