ap="round" stroke-linejoin="round"/><text x="714" y="268" font-size="24" fill="#292331" font-weight="400">Pass</text><circle cx="680" cy="409" r="20" fill="#f5f3f7" stroke="#7a7085" stroke-width="3"/><path d="m673 402 14 14m0-14-14 14" fill="none" stroke="#7a7085" stroke-width="4" stroke-linecap="round"/><text x="714" y="418" font-size="24" fill="#292331" font-weight="400">Blocked</text><circle cx="680" cy="539" r="20" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><path d="m671 539 6 7 13-15" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="714" y="548" font-size="24" fill="#292331" font-weight="400">Pass</text><text x="480" y="617" text-anchor="middle" font-size="23" fill="#6e617a" font-weight="400">Supported options → declared priority → decision</text>  </g>
