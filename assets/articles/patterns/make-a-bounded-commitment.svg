<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="bounded-commitment-title bounded-commitment-desc">
  <title id="bounded-commitment-title">Make a Bounded Commitment</title>
  <desc id="bounded-commitment-desc">Three complete operating arrangements are compared against the same obligations. Two pass; one is blocked. A separate priority and human decision are needed to select a commitment.</desc>
