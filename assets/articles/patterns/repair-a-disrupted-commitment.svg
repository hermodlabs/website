<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="repair-commitment-title repair-commitment-desc">
  <title id="repair-commitment-title">Repair a Disrupted Commitment</title>
  <desc id="repair-commitment-desc">An original promise and disrupted operating plan lead to two types of recovery response: one preserves the original promise, while another needs an accepted revision. Neither response is assumed to pass without assessment.</desc>
  <defs><marker id="repair-commitment-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="120" y="100" width="720" height="112" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="151" y="147" font-size="29" fill="#443052" font-weight="700">Original promise</text><text x="151" y="184" font-size="24" fill="#292331" font-weight="400">Scope · deadline · obligations</text><path d="M480 212v42" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#repair-commitment-arrow)"/><rect x="280" y="265" width="400" height="90" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="480" y="303" text-anchor="middle" font-size="27" fill="#443052" font-weight="700">The operating plan changes</text><text x="480" y="334" text-anchor="middle" font-size="21" fill="#292331" font-weight="400">A resource is no longer available</text><path d="M480 355v53H269v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#repair-commitment-arrow)"/><path d="M480 408h211v35" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#repair-commitment-arrow)"/><rect x="108" y="451" width="322" height="146" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="269" y="494" text-anchor="middle" font-size="27" fill="#443052" font-weight="700">Repair the plan</text><text x="269" y="533" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Preserve the original</text><text x="269" y="566" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">promise</text><rect x="530" y="451" width="322" height="146" rx="14" fill="#fff" stroke="#4a3d59" stroke-width="3"/><text x="691" y="494" text-anchor="middle" font-size="27" fill="#443052" font-weight="700">Revise the promise</text><text x="691" y="533" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">Requires actual agreement</text><text x="691" y="566" text-anchor="middle" font-size="23" fill="#292331" font-weight="400">to the changed obligation</text>  </g>
</svg>

