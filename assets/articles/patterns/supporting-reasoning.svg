<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="supporting-reasoning-title supporting-reasoning-desc">
  <title id="supporting-reasoning-title">Supporting Reasoning</title>
  <desc id="supporting-reasoning-desc">Qualified capacity, dependent timing and scoped support are supporting questions connected to one complete arrangement. A finding is conditional on their combined requirements, rather than a collection of independent favorable facts.</desc>
  <defs><marker id="supporting-reasoning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#927bac" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="295" fill="#fff"/>
  <ellipse cx="480" cy="637" rx="308" ry="13" fill="#e9e4ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292331"><rect x="107" y="123" width="218" height="185" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="216" y="170" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Capacity</text><text x="216" y="220" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Qualified people</text><text x="216" y="252" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Available resources</text><path d="M216 308v55H480v49" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#supporting-reasoning-arrow)"/><rect x="371" y="123" width="218" height="185" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="480" y="170" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Timing</text><text x="480" y="220" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Prerequisites</text><text x="480" y="252" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Useful cutoff</text><path d="M480 308v55H480v49" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#supporting-reasoning-arrow)"/><rect x="635" y="123" width="218" height="185" rx="14" fill="#faf8fd" stroke="#7850c2" stroke-width="3"/><text x="744" y="170" text-anchor="middle" font-size="28" fill="#443052" font-weight="700">Scope</text><text x="744" y="220" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Current revision</text><text x="744" y="252" text-anchor="middle" font-size="20" fill="#292331" font-weight="400">Relevant interval</text><path d="M744 308v55H480v49" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#supporting-reasoning-arrow)"/><rect x="238" y="420" width="484" height="100" rx="14" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/><text x="480" y="462" text-anchor="middle" font-size="29" fill="#443052" font-weight="700">Complete arrangement</text><text x="480" y="495" text-anchor="middle" font-size="22" fill="#292331" font-weight="400">Joint compatibility and requirements</text><path d="M480 520v41" fill="none" stroke="#927bac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#supporting-reasoning-arrow)"/><text x="480" y="603" text-anchor="middle" font-size="26" fill="#292331" font-weight="400">A scoped finding, with assumptions and limits</text>  </g>
