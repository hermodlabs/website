<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="complete-plan-title complete-plan-desc">
  <title id="complete-plan-title">A plan. Four separate questions.</title>
  <desc id="complete-plan-desc">Four question cards connect independently to a shared case: are the arrangement's choices resolved, do its requirements fit, what establishes a preference, and who accepts the next action? A changed record points back to the case for reconsideration. The connections express a shared basis, not a sequence of approvals or evidence that any question has been settled.</desc>

  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="351" r="296" fill="#fff"/>
  <ellipse cx="480" cy="670" rx="315" ry="12" fill="#e8e8ee"/>

  <text x="480" y="70" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#193743">A plan. Four separate questions.</text>

  <!-- Each question refers to the shared case; none follows another question. -->
  <g fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round">
    <path d="M354 217c38 0 36 84 55 84"/>
    <path d="M606 217c-38 0-36 84-55 84"/>
    <path d="M354 507c38 0 36-88 55-88"/>
    <path d="M606 507c-38 0-36-88-55-88"/>
  </g>

  <g stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="68" y="124" width="286" height="186" rx="14" fill="#fff"/>
    <rect x="606" y="124" width="286" height="186" rx="14" fill="#fff"/>
    <rect x="68" y="414" width="286" height="186" rx="14" fill="#fff"/>
    <rect x="606" y="414" width="286" height="186" rx="14" fill="#fff"/>
  </g>

  <!-- Resolved positions make an arrangement definite, without asserting feasibility. -->
  <g fill="#eee8f7" stroke="#7850c2" stroke-width="2.5" stroke-linejoin="round">
    <rect x="97" y="151" width="20" height="20" rx="3"/>
    <rect x="126" y="151" width="20" height="20" rx="3"/>
    <rect x="97" y="180" width="20" height="20" rx="3"/>
    <rect x="126" y="180" width="20" height="20" rx="3"/>
  </g>
  <path d="M117 161h9m-19 10v9m29-9v9m-19 10h9" fill="none" stroke="#7850c2" stroke-width="2.5"/>

  <!-- Requirements need to fit together. There is no passing-status symbol. -->
  <g fill="#e6f2f0" stroke="#177681" stroke-width="2.5">
    <circle cx="653" cy="166" r="16"/>
    <circle cx="672" cy="181" r="16"/>
    <circle cx="649" cy="190" r="16"/>
  </g>

  <!-- Alternatives remain available for comparison, including a possible tie. -->
  <g fill="#eee8f7" stroke="#7850c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="97" y="444" width="23" height="45" rx="4"/>
    <rect x="129" y="444" width="23" height="45" rx="4"/>
    <path d="M104 455h9m-9 10h9m23-10h9m-9 10h9" fill="none"/>
    <path d="M103 480h11m21 0h11" fill="none"/>
  </g>

  <!-- The person and their next action remain distinct from the calculation. -->
  <g fill="none" stroke="#177681" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="651" cy="456" r="11" fill="#c6e3e1"/>
    <path d="M633 487v-6a18 18 0 0 1 36 0v6"/>
    <path d="M674 447h12a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5h-6l-6 6v-6" fill="#e6f2f0"/>
    <path d="M680 456h5m-5 7h5"/>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="166" y="180" font-size="27" font-weight="600">Complete?</text>
    <text x="97" y="247" font-size="19">Are the choices resolved?</text>
    <text x="97" y="279" font-size="16" fill="#53717b">A definite arrangement</text>

    <text x="701" y="180" font-size="27" font-weight="600">Feasible?</text>
    <text x="635" y="247" font-size="19">Do the requirements fit?</text>
    <text x="635" y="279" font-size="16" fill="#53717b">Under the stated conditions</text>

    <text x="166" y="473" font-size="27" font-weight="600">Preferred?</text>
    <text x="97" y="537" font-size="19">What supports</text>
    <text x="97" y="564" font-size="19">the comparison?</text>

    <text x="701" y="473" font-size="27" font-weight="600">Accepted?</text>
    <text x="635" y="537" font-size="19">Who accepts</text>
    <text x="635" y="564" font-size="19">which next action?</text>
  </g>

  <!-- One case basis, retained and revisable. -->
  <rect x="388" y="277" width="184" height="182" rx="12" fill="#e6f2f0" stroke="#177681" stroke-width="3"/>
  <path d="M378 263h148l42 42v133a11 11 0 0 1-11 11H389a11 11 0 0 1-11-11z" fill="#fff" stroke="#193743" stroke-width="3" stroke-linejoin="round"/>
  <path d="M526 263v42h42" fill="#eee8f7" stroke="#193743" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="401" y="330" font-size="22" font-weight="600">Shared case</text>
    <text x="401" y="357" font-size="16" fill="#53717b">Choices and records</text>
  </g>
  <g stroke-width="5" stroke-linecap="round">
    <path d="M403 386h103" stroke="#bba9dc"/>
    <path d="M403 410h76" stroke="#8fbcbf"/>
  </g>
  <g fill="#fff" stroke="#177681" stroke-width="2.5">
    <circle cx="391" cy="301" r="5"/>
    <circle cx="561" cy="301" r="5"/>
    <circle cx="391" cy="419" r="5"/>
    <circle cx="561" cy="419" r="5"/>
  </g>

  <!-- A changed record reopens the shared basis, rather than advancing a pipeline. -->
  <path d="M480 532v-47m-7 8 7-8 7 8" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
  <rect x="431" y="541" width="100" height="78" rx="8" fill="#eee8f7" stroke="#7850c2" stroke-width="2.5"/>
  <rect x="418" y="530" width="100" height="78" rx="8" fill="#fff" stroke="#193743" stroke-width="2.5"/>
  <path d="M436 552h60m-60 17h38m-38 17h49" fill="none" stroke="#bba9dc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="518" cy="596" r="19" fill="#eee8f7" stroke="#7850c2" stroke-width="2.5"/>
  <path d="M508 598a10 10 0 1 0 5-11m-1-5 1 5 5-1" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="656" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#193743">Reconsider when the basis changes.</text>
</svg>
