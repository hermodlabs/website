<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="gift-kit-cover-title gift-kit-cover-desc">
  <title id="gift-kit-cover-title">Choose Checks Before Releasing Gift Kits</title>
  <desc id="gift-kit-cover-desc">An open sample kit holds an insulated travel mug and a printed insert. A magnifying glass examines a decorative code pattern, suggesting a check before the package is released. The pattern is not a scannable QR code, and the illustration does not claim a test result.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <path d="M180 617h600" fill="none" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="464" cy="617" rx="207" ry="13" fill="#e8e8ee"/>

  <!-- The kit's opening sits behind the sample and insert. -->
  <path d="m264 385 196-67 196 67-196 68z" fill="#f1edf7" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>

  <!-- Insulated travel mug: broad, simple shapes for thumbnail use. -->
  <path d="M326 225h120l-10 184c-1 14-13 22-50 22s-49-8-50-22z" fill="#c6e3e1" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <rect x="319" y="201" width="134" height="31" rx="9" fill="#193743"/>
  <path d="M335 198h102" fill="none" stroke="#193743" stroke-width="7" stroke-linecap="round"/>
  <path d="M332 271h108" fill="none" stroke="#177681" stroke-width="4"/>
  <path d="M355 298v67" fill="none" stroke="#eef7f5" stroke-width="9" stroke-linecap="round"/>

  <!-- Decorative code blocks suggest a printed QR insert; no data is encoded. -->
  <g transform="rotate(10 565 327)">
    <rect x="479" y="207" width="172" height="240" rx="9" fill="#fff" stroke="#193743" stroke-width="5"/>
    <g fill="none" stroke="#193743" stroke-width="5">
      <path d="M508 236h39v39h-39zM581 236h39v39h-39zM508 309h39v39h-39z"/>
    </g>
    <g fill="#193743">
      <path d="M520 248h15v15h-15zM593 248h15v15h-15zM520 321h15v15h-15z"/>
      <path d="M561 236h8v22h-8zM558 286h24v8h-24zM592 287h28v8h-28zM560 308h9v29h-9zM582 309h10v10h-10zM606 308h14v14h-14zM584 337h36v10h-36z"/>
    </g>
    <path d="M511 376h103M511 393h72" fill="none" stroke="#bba9dc" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Two faces close the package in front of the sample and card. -->
  <path d="m264 385 196 68v155l-196-68z" fill="#eee8f7" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="m460 453 196-68v155l-196 68z" fill="#ddd0ee" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="m264 385-43 43 194 70 45-45m196-68 43 43-194 70-45-45" fill="#f6f3fa" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>

  <!-- Inspection is an action here; no pass/fail result is depicted. -->
  <path d="m738 391 65 65" fill="none" stroke="#193743" stroke-width="17" stroke-linecap="round"/>
  <circle cx="688" cy="341" r="72" fill="#fff" stroke="#7850c2" stroke-width="8"/>
  <path d="M656 309h39v39h-39z" fill="#eee8f7" stroke="#193743" stroke-width="5"/>
  <path d="M668 321h15v15h-15zM708 310h12v23h-12zM708 348h12v20h-12zM656 359h38v11h-38z" fill="#193743"/>
  <path d="M644 290a57 57 0 0 1 33-12" fill="none" stroke="#e2d7f1" stroke-width="5" stroke-linecap="round"/>
</svg>
