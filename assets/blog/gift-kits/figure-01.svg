<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 678" width="1040" height="678" role="img" aria-labelledby="gift-journey-title gift-journey-desc">
<title id="gift-journey-title">What is in the gift-kit journey?</title>
<desc id="gift-journey-desc">A gift kit is one recipient's package in a 120-kit campaign. It contains a printed insert with a QR code that may be unreadable. The insert encodes a link, the address stored in the QR, which may point to a wrong page. The encoded link should open the approved page: the intended preorder page and campaign reference. The approved page leads to checkout, the intended customer's access, which may allow or block an order. Matching artwork is the source used for this print, is available for inspection, and is used to print the insert. Print, link and checkout faults can exist together.</desc>
<defs><marker id="gift-journey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1040" height="678" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="24" y="43" font-size="29" fill="#193743" font-weight="700" text-anchor="start">What is in the gift-kit journey?</text><rect x="24" y="115" width="282" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="41" y="153" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Gift kit</text><text x="41" y="199" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">One recipient&#x27;s package</text><text x="41" y="232" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">Part of a 120-kit campaign</text><rect x="379" y="115" width="282" height="145" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="396" y="153" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Printed insert</text><text x="396" y="199" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">QR code on the card</text><text x="396" y="232" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">Print may be unreadable</text><rect x="734" y="115" width="282" height="145" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="751" y="153" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Encoded link</text><text x="751" y="199" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">Address stored in the QR</text><text x="751" y="232" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">May point to a wrong page</text><rect x="24" y="435" width="282" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="41" y="473" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Matching artwork</text><text x="41" y="519" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">Source used for this print</text><text x="41" y="552" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">Available for inspection</text><rect x="379" y="435" width="282" height="145" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="396" y="473" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Checkout</text><text x="396" y="519" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">The intended customer&#x27;s access</text><text x="396" y="552" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">May allow or block an order</text><rect x="734" y="435" width="282" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="751" y="473" font-size="23" fill="#193743" font-weight="700" text-anchor="start">Approved page</text><text x="751" y="519" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">The intended preorder page</text><text x="751" y="552" font-size="17.5" fill="#177681" font-weight="400" text-anchor="start">Reference for this campaign</text><path d="M 314 188 H 368" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-journey-arrow)"/><text x="342" y="157" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">contains</text><path d="M 669 188 H 723" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-journey-arrow)"/><text x="696" y="157" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">encodes</text><path d="M 875 268 V 424" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-journey-arrow)"/><text x="896" y="338" font-size="18" fill="#536873" font-weight="400" text-anchor="start">should</text><text x="896" y="362" font-size="18" fill="#536873" font-weight="400" text-anchor="start">open</text><path d="M 725 508 H 672" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-journey-arrow)"/><text x="699" y="477" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">leads to</text><path d="M 165 427 V 349 H 520 V 270" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-journey-arrow)"/><text x="342" y="324" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">is used to print</text><text x="24" y="643" font-size="21" fill="#177681" font-weight="400" text-anchor="start">Print, link and checkout faults can exist together.</text></g>
</svg>
