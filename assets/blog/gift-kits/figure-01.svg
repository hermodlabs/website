<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 600" width="1090" height="600" role="img" aria-labelledby="gift-figure-1-title gift-figure-1-desc">
<title id="gift-figure-1-title">What is known, possible and proposed?</title>
<desc id="gift-figure-1-desc">The recorded failed journey is consistent with candidate explanations, which require corrective actions if true. A diagnostic check yields possible outcomes; observed outcomes narrow explanations and inform a candidate response plan. That plan selects corrective work and may include diagnostic work. Possibilities and proposals are distinct from recorded evidence, and observed outcomes require scope and adequacy review.</desc>
<defs><marker id="gift-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1090" height="600" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="24" y="43" font-size="29" fill="#193743" font-weight="700" text-anchor="start">What is known, possible and proposed?</text><rect x="24" y="96" width="300" height="145" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="174" y="130" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Recorded observation</text><text x="174" y="167" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">R0-01: the journey failed</text><text x="174" y="193" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Cause and correction unresolved</text><rect x="394" y="96" width="300" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="544" y="130" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Candidate explanation</text><text x="544" y="167" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Print, link, device or account</text><text x="544" y="193" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Several faults may coexist</text><text x="544" y="219" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Scope still needs agreement</text><rect x="764" y="96" width="300" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="914" y="130" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Corrective action set</text><text x="914" y="167" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Reprint or change link/access</text><text x="914" y="193" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Work depends on accepted faults</text><text x="914" y="219" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Actions are still proposals</text><rect x="24" y="340" width="300" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="174" y="374" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Diagnostic check</text><text x="174" y="411" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Proposed phone/account tests</text><text x="174" y="437" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Method and access to be chosen</text><text x="174" y="463" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Cost and duration still open</text><rect x="394" y="340" width="300" height="145" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="544" y="374" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Possible check outcome</text><text x="544" y="411" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Readability, link or access result</text><text x="544" y="437" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">If observed, record and interpret</text><text x="544" y="463" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Assess scope and adequacy</text><rect x="764" y="340" width="300" height="145" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="914" y="374" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Candidate response plan</text><text x="914" y="411" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Act now; or check, then correct</text><text x="914" y="437" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Bind scope, work and resources</text><text x="914" y="463" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">Keep an explicit fallback</text><path d="M 330 168 H 384" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="357" y="121" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">consistent</text><text x="357" y="141" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">with</text><path d="M 700 168 H 754" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="727" y="121" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">requires</text><text x="727" y="141" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">if true</text><path d="M 544 331 V 251" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="561" y="285" font-size="16" fill="#536873" font-weight="400" text-anchor="start">narrows</text><text x="561" y="305" font-size="16" fill="#536873" font-weight="400" text-anchor="start">if observed</text><path d="M 330 412 H 384" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="357" y="386" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">yields</text><path d="M 700 412 H 754" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="727" y="367" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">informs</text><text x="727" y="387" font-size="16" fill="#536873" font-weight="400" text-anchor="middle">choice</text><path d="M 914 331 V 251" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="931" y="285" font-size="16" fill="#536873" font-weight="400" text-anchor="start">selects</text><text x="931" y="305" font-size="16" fill="#536873" font-weight="400" text-anchor="start">work</text><path d="M 914 494 V 535 H 174 V 495" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="544" y="569" font-size="21" fill="#177681" font-weight="400" text-anchor="middle">A response plan may include diagnostic work</text></g>
</svg>
