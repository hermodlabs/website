<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 758" width="1130" height="758" role="img" aria-labelledby="gift-figure-2-title gift-figure-2-desc">
<title id="gift-figure-2-title">One instruction gates the whole dispatch job</title>
<desc id="gift-figure-2-desc">A schematic Gantt-style dependency view runs from optional checks and interpretation through Leah’s instruction by 3:00 p.m., revised files and approval, replacement printing, rehearsal and Leah’s release, packing and sealing, and dispatch of 120 kits tomorrow morning. Hatched tasks have unestimated duration. Widths show order only, and the axis is not a minute scale. Conditional reopening exposure, outside the normal route, is 120 times USD 8, or USD 960 estimated handling.</desc>
<defs><marker id="gift-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><defs><pattern id="gift-hatch" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3f5f6"/><path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#536873" stroke-width="2"/></pattern><pattern id="gift-hatch-teal" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#edf5f5"/><path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" stroke="#177681" stroke-width="2"/></pattern></defs><rect width="1130" height="758" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="24" y="40" font-size="29" fill="#193743" font-weight="700" text-anchor="start">One instruction gates the whole dispatch job</text><text x="24" y="75" font-size="21" fill="#536873" font-weight="400" text-anchor="start">Schematic Gantt for a replacement-insert route</text><rect x="300" y="116" width="148" height="432" fill="#edf5f5"/><path d="M 320 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 448 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 575 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 702 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 829 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 956 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 1082 116 V 548" stroke="#d3dfe5" stroke-width="1"/><path d="M 448 116 V 548" stroke="#b74f3e" stroke-width="2" stroke-dasharray="6 5"/><text x="278" y="151" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Checks + interpretation</text><text x="278" y="174" font-size="20" fill="#193743" font-weight="400" text-anchor="end">(if chosen)</text><text x="278" y="217" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Leah’s instruction</text><text x="278" y="277" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Revised files + approval</text><text x="278" y="337" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Replacement printing</text><text x="278" y="397" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Rehearsal + Leah release</text><text x="278" y="457" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Packing / sealing</text><text x="278" y="517" font-size="20" fill="#193743" font-weight="400" text-anchor="end">Dispatch: 120 kits</text><rect x="310" y="140" width="105" height="26" fill="#d7eaec" stroke="#177681" stroke-width="2"/><text x="362.5" y="159" font-size="17" fill="#193743" font-weight="400" text-anchor="middle">to fit</text><path d="M 415 153 H 433 V 211 H 440" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><path d="M 448 201 L 458 211 L 448 221 L 438 211 Z" fill="#b74f3e"/><path d="M 448 222 V 271 H 465" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><rect x="469" y="258" width="106" height="26" fill="url(#gift-hatch)" stroke="#536873" stroke-width="2"/><path d="M 575 287 V 316" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><rect x="575" y="318" width="127" height="26" fill="url(#gift-hatch)" stroke="#536873" stroke-width="2"/><path d="M 702 347 V 376" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><rect x="702" y="378" width="127" height="26" fill="url(#gift-hatch-teal)" stroke="#177681" stroke-width="2"/><path d="M 829 407 V 436" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><rect x="829" y="438" width="127" height="26" fill="url(#gift-hatch-teal)" stroke="#177681" stroke-width="2"/><path d="M 956 467 V 511 H 1074" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><path d="M 1082 501 L 1092 511 L 1082 521 L 1072 511 Z" fill="#193743"/><text x="320" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Review</text><text x="320" y="601" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">opens</text><text x="448" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">3:00 p.m.</text><text x="448" y="601" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">cutoff</text><text x="575" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Files</text><text x="575" y="601" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">approved</text><text x="702" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Printed</text><text x="829" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Release</text><text x="829" y="601" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">approved</text><text x="956" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Packed</text><text x="1082" y="579" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">Tomorrow</text><text x="1082" y="601" font-size="18" fill="#193743" font-weight="400" text-anchor="middle">morning</text><text x="300" y="644" font-size="20" fill="#536873" font-weight="400" text-anchor="start">Hatching: task durations still to be estimated.</text><text x="300" y="674" font-size="20" fill="#536873" font-weight="400" text-anchor="start">Widths show order only; the axis is not a minute scale.</text><rect x="24" y="699" width="1080" height="39" fill="#f6f1e7"/><text x="36" y="726" font-size="20" fill="#193743" font-weight="400" text-anchor="start">If sealed kits must be reopened: 120 × USD 8 = USD 960 estimated handling.</text></g>
</svg>
