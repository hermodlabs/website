stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="829" y="503" font-size="17" fill="#536873" font-weight="400" text-anchor="start">limits tests</text><path d="M 587 609 H 454" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="584" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">limits choice</text><text x="24" y="719" font-size="20" fill="#177681" font-weight="400" text-anchor="start">Familiar relationships guide the investigation;</text><text x="24" y="745" font-size="20" fill="#177681" font-weight="400" text-anchor="start">this case supplies its own facts and rules.</text></g></g>
</svg>
