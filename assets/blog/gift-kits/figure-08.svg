<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 781" width="1040" height="781" role="img" aria-labelledby="gift-figure-8-title gift-figure-8-desc">
<title id="gift-figure-8-title">One general decision ontology</title>
<desc id="gift-figure-8-desc">Six general concept families. Physical situation covers objects, relationships and governing rules and defines uncertainty cases. Uncertainty covers possible explanations and likelihoods when stated and predicts results of experiments and observations. The question and evidence target sets sufficiency. Observations support actions and consequences. Execution conditions, including access, resources, cost, timing and authority, limit tests and choices. The arrows describe relationships rather than a work sequence.</desc>
<defs><marker id="gift-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1040" height="781" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="24" y="43" font-size="29" fill="#193743" font-weight="700" text-anchor="start">One general decision ontology</text><rect x="24" y="94" width="420" height="130" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="234" y="133" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Physical situation</text><text x="234" y="171" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Objects, relationships and</text><text x="234" y="197" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">governing rules</text><rect x="596" y="94" width="420" height="130" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="806" y="133" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Uncertainty</text><text x="806" y="171" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Possible explanations;</text><text x="806" y="197" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">likelihoods when stated</text><rect x="24" y="319" width="420" height="130" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="234" y="358" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Question and evidence target</text><text x="234" y="396" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Required answer and</text><text x="234" y="422" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">evidence standard</text><rect x="596" y="319" width="420" height="130" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="806" y="358" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Experiments and observations</text><text x="806" y="396" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Checks, possible results and</text><text x="806" y="422" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">error assumptions</text><rect x="24" y="544" width="420" height="130" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="234" y="583" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Actions and consequences</text><text x="234" y="621" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Available responses and</text><text x="234" y="647" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">their effects</text><rect x="596" y="544" width="420" height="130" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="806" y="583" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Execution conditions</text><text x="806" y="621" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Access, resources, cost,</text><text x="806" y="647" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">timing and authority</text><path d="M 450 159 H 586" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="520" y="135" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">defines cases</text><path d="M 806 231 V 307" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="829" y="274" font-size="17" fill="#536873" font-weight="400" text-anchor="start">predicts results</text><path d="M 450 384 H 586" fill="none" stroke="#177681" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="520" y="358" font-size="17" fill="#177681" font-weight="400" text-anchor="middle">sets sufficiency</text><path d="M 626 456 V 491 H 234 V 532" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="405" y="479" font-size="17" fill="#536873" font-weight="400" text-anchor="start">supports action</text><path d="M 806 535 V 459" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="829" y="503" font-size="17" fill="#536873" font-weight="400" text-anchor="start">limits tests</text><path d="M 587 609 H 454" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#gift-arrow)"/><text x="520" y="584" font-size="17" fill="#536873" font-weight="400" text-anchor="middle">limits choice</text><text x="24" y="719" font-size="20" fill="#177681" font-weight="400" text-anchor="start">The relationships remain general;</text><text x="24" y="745" font-size="20" fill="#177681" font-weight="400" text-anchor="start">each case supplies its own facts and rules.</text></g>
</svg>
