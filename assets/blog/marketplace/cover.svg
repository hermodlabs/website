<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="marketplace-cover-title marketplace-cover-desc">
  <title id="marketplace-cover-title">Announcing DecisionLab Marketplace</title>
  <desc id="marketplace-cover-desc">A reusable template with open slots leads to a configured application in a collection, then to a person's working case. Shared shapes connect the three stages, while adjustment controls distinguish the configured app from its template. This is a conceptual illustration, not a screenshot.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <path d="M126 606h708" fill="none" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="480" cy="606" rx="310" ry="13" fill="#e8e8ee"/>

  <!-- Reusable structure: a template exposes places to define a problem. -->
  <path d="M100 219a14 14 0 0 1 14-14h131l48 48v245a14 14 0 0 1-14 14H114a14 14 0 0 1-14-14z" fill="#fff" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="M245 205v48h48" fill="#eee8f7" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="M129 245h69M129 266h41" fill="none" stroke="#7850c2" stroke-width="6" stroke-linecap="round"/>
  <rect x="128" y="301" width="137" height="58" rx="8" fill="#f6f3fa" stroke="#bba9dc" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="m148 319 16-9 16 9v19l-16 9-16-9z" fill="#eee8f7" stroke="#7850c2" stroke-width="4" stroke-linejoin="round"/>
  <path d="M198 330h45" fill="none" stroke="#bba9dc" stroke-width="5" stroke-linecap="round"/>
  <rect x="128" y="377" width="137" height="87" rx="8" fill="#f0f7f6" stroke="#8fbcbf" stroke-width="3" stroke-dasharray="7 7"/>
  <circle cx="161" cy="404" r="11" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <path d="M190 404h53M150 441h93" fill="none" stroke="#8fbcbf" stroke-width="5" stroke-linecap="round"/>

  <!-- A collection holds related configured apps; one is brought forward. -->
  <path d="M355 228v-36a12 12 0 0 1 12-12h70l22 25h135a12 12 0 0 1 12 12v288a12 12 0 0 1-12 12H367a12 12 0 0 1-12-12z" fill="#e6f2f0" stroke="#177681" stroke-width="5" stroke-linejoin="round"/>
  <rect x="370" y="229" width="221" height="310" rx="12" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
  <rect x="388" y="246" width="186" height="310" rx="12" fill="#fff" stroke="#193743" stroke-width="5"/>
  <path d="M400 246h162a12 12 0 0 1 12 12v35H388v-35a12 12 0 0 1 12-12z" fill="#eee8f7"/>
  <path d="M388 293h186" fill="none" stroke="#193743" stroke-width="5"/>
  <circle cx="411" cy="270" r="4" fill="#7850c2"/>
  <circle cx="427" cy="270" r="4" fill="#7850c2"/>
  <path d="M453 270h93" fill="none" stroke="#bba9dc" stroke-width="5" stroke-linecap="round"/>
  <path d="m417 326 16-9 16 9v19l-16 9-16-9z" fill="#ddd0ee" stroke="#7850c2" stroke-width="4" stroke-linejoin="round"/>
  <path d="M470 335h75" fill="none" stroke="#c7b8dd" stroke-width="6" stroke-linecap="round"/>
  <circle cx="433" cy="386" r="11" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <path d="M470 386h75" fill="none" stroke="#8fbcbf" stroke-width="6" stroke-linecap="round"/>
  <rect x="414" y="424" width="134" height="103" rx="9" fill="#f0f7f6"/>
  <path d="M430 454h102M430 494h102" fill="none" stroke="#177681" stroke-width="5" stroke-linecap="round"/>
  <circle cx="467" cy="454" r="9" fill="#fff" stroke="#177681" stroke-width="4"/>
  <circle cx="505" cy="494" r="9" fill="#fff" stroke="#177681" stroke-width="4"/>

  <!-- The configured structure is used for a concrete case, with work still open. -->
  <rect x="667" y="205" width="193" height="307" rx="14" fill="#fff" stroke="#193743" stroke-width="5"/>
  <rect x="716" y="192" width="95" height="28" rx="8" fill="#193743"/>
  <path d="M695 253h113M695 275h70" fill="none" stroke="#7850c2" stroke-width="6" stroke-linecap="round"/>
  <rect x="693" y="306" width="141" height="72" rx="8" fill="#eee8f7"/>
  <path d="m709 326 13-8 13 8v16l-13 8-13-8z" fill="#ddd0ee" stroke="#7850c2" stroke-width="4" stroke-linejoin="round"/>
  <path d="M755 333h60M710 361h76" fill="none" stroke="#bba9dc" stroke-width="5" stroke-linecap="round"/>
  <rect x="693" y="394" width="141" height="72" rx="8" fill="#e6f2f0"/>
  <circle cx="722" cy="419" r="10" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <path d="M755 419h60M710 449h76" fill="none" stroke="#8fbcbf" stroke-width="5" stroke-linecap="round"/>

  <!-- Hand-offs connect roles; arrows express reuse, not an automated release. -->
  <path d="M310 350h27m-10-10 10 10-10 10M622 350h27m-10-10 10 10-10 10" fill="none" stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The person remains visibly distinct from the case record. -->
  <circle cx="785" cy="526" r="28" fill="#c6e3e1" stroke="#193743" stroke-width="5"/>
  <path d="M732 598v-15a53 53 0 0 1 106 0v15z" fill="#e6f2f0" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <path d="M770 569h30" fill="none" stroke="#177681" stroke-width="5" stroke-linecap="round"/>
</svg>
