<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="better-plan-title better-plan-desc">
  <title id="better-plan-title">A better plan can leave us just as uncertain</title>
  <desc id="better-plan-desc">Two paper panels compare specialized arrangement A with robust arrangement R in the essay's stipulated soft-target teaching model. Their expected operating values are twenty and sixty value units, not dollars. Both retain the same eight equally likely world states and three bits of state uncertainty. The better action does not reveal which state will occur. This is a conceptual comparison, not an application output or a record of human acceptance.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="366" r="294" fill="#fff"/>
  <ellipse cx="480" cy="665" rx="330" ry="12" fill="#e8e8ee"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="70" y="47" font-size="14" letter-spacing="1.6">PLANNING, UNCERTAINTY, AND COMMITMENT</text>
    <text x="480" y="110" text-anchor="middle" font-size="33" font-weight="600">A better plan. The same unknowns.</text>
  </g>
  <rect x="794" y="25" width="96" height="32" rx="16" fill="#eee8f7"/>
  <text x="842" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#7850c2">3 OF 3</text>

  <!-- A change of action changes value under the same stated world model. -->
  <rect x="93" y="215" width="324" height="350" rx="13" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/>
  <rect x="80" y="202" width="324" height="350" rx="13" fill="#fff" stroke="#193743" stroke-width="3"/>
  <rect x="563" y="215" width="324" height="350" rx="13" fill="#e6f2f0" stroke="#177681" stroke-width="3"/>
  <rect x="550" y="202" width="324" height="350" rx="13" fill="#fff" stroke="#193743" stroke-width="3"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="108" y="246" font-size="27" font-weight="600">A: specialized</text>
    <text x="578" y="246" font-size="27" font-weight="600">R: robust</text>
    <text x="108" y="289" font-size="18" fill="#53717b">Expected operating value</text>
    <text x="578" y="289" font-size="18" fill="#53717b">Expected operating value</text>
  </g>
  <rect x="108" y="322" width="80" height="30" rx="5" fill="#ddd0ee" stroke="#7850c2" stroke-width="2"/>
  <rect x="578" y="322" width="240" height="30" rx="5" fill="#c6e3e1" stroke="#177681" stroke-width="2"/>
  <path d="M108 359h268M578 359h268" fill="none" stroke="#193743" stroke-width="2" stroke-linecap="round"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="108" y="408" font-size="43" font-weight="600" fill="#7850c2">20</text>
    <text x="169" y="407" font-size="19" fill="#53717b">value units</text>
    <text x="578" y="408" font-size="43" font-weight="600" fill="#177681">60</text>
    <text x="639" y="407" font-size="19" fill="#53717b">value units</text>
  </g>
  <path d="M108 433h268M578 433h268" fill="none" stroke="#d3dfe5" stroke-width="2"/>

  <!-- Equal-sized dots retain the identical fair distribution in both panels. -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#53717b">
    <text x="242" y="468">The same eight possible states</text>
    <text x="712" y="468">The same eight possible states</text>
  </g>
  <g fill="#eee8f7" stroke="#7850c2" stroke-width="2">
    <circle cx="119" cy="498" r="9"/><circle cx="154" cy="498" r="9"/>
    <circle cx="189" cy="498" r="9"/><circle cx="224" cy="498" r="9"/>
    <circle cx="259" cy="498" r="9"/><circle cx="294" cy="498" r="9"/>
    <circle cx="329" cy="498" r="9"/><circle cx="364" cy="498" r="9"/>
  </g>
  <g fill="#e6f2f0" stroke="#177681" stroke-width="2">
    <circle cx="589" cy="498" r="9"/><circle cx="624" cy="498" r="9"/>
    <circle cx="659" cy="498" r="9"/><circle cx="694" cy="498" r="9"/>
    <circle cx="729" cy="498" r="9"/><circle cx="764" cy="498" r="9"/>
    <circle cx="799" cy="498" r="9"/><circle cx="834" cy="498" r="9"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#193743">
    <text x="242" y="536">3 bits remain</text>
    <text x="712" y="536">3 bits remain</text>
  </g>
  <path d="M433 339h91m-12-11 12 11-12 11" fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#53717b">Change the plan</text>

  <text x="480" y="604" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#53717b">Soft-target teaching model · Values are not dollars</text>
  <text x="480" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743">More value does not require less uncertainty.</text>
</svg>
