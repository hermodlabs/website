<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Two examined futures among eight modeled shipment futures</title>
  <desc id="desc">The shipment proposal branches by order revision, loading window availability, and transit duration. S1 and S2, the unchanged order with a usable loading window, are examined. The other six futures are unexamined. Blue solid paths mean examined and gray dashed paths mean unexamined; neither encodes success or probability.</desc>
  <rect width="960" height="640" fill="#fff"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#26364d">
    <text x="30" y="38" font-size="13" letter-spacing="1.4" font-weight="700">HYPOTHETICAL REVIEW COVERAGE</text>
    <g fill="none" stroke="#b9c4d1" stroke-width="2" stroke-dasharray="5 5">
      <path d="M190 312 C220 312 212 466 250 466"/>
      <path d="M400 164 C425 164 422 240 460 240"/>
      <path d="M400 466 C430 466 425 390 460 390 M400 466 C430 466 425 542 460 542"/>
      <path d="M590 240 C620 240 615 206 660 206 M590 240 C620 240 615 274 660 274"/>
      <path d="M590 390 C620 390 615 356 660 356 M590 390 C620 390 615 424 660 424"/>
      <path d="M590 542 C620 542 615 508 660 508 M590 542 C620 542 615 576 660 576"/>
    </g>
    <g fill="none" stroke="#3156bc" stroke-width="3">
      <path d="M190 312 C230 312 208 164 250 164"/>
      <path d="M400 164 C430 164 424 92 460 92"/>
      <path d="M590 92 C620 92 620 58 660 58 M590 92 C620 92 620 126 660 126"/>
    </g>
    <rect x="30" y="278" width="160" height="68" rx="6" fill="#182b43"/>
    <text x="110" y="306" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="110">Shipment</tspan><tspan x="110" dy="23">proposal</tspan></text>
    <g fill="#f2f5ff" stroke="#3156bc" stroke-width="1.5">
      <rect x="250" y="134" width="150" height="60" rx="6"/>
      <rect x="460" y="65" width="130" height="54" rx="6"/>
      <rect x="660" y="36" width="270" height="44" rx="6"/>
      <rect x="660" y="104" width="270" height="44" rx="6"/>
    </g>
    <g fill="#3156bc" text-anchor="middle">
      <text x="325" y="158"><tspan x="325">Order</tspan><tspan x="325" dy="22">unchanged</tspan></text>
      <text x="525" y="86"><tspan x="525">Slot</tspan><tspan x="525" dy="22">usable</tspan></text>
      <text x="795" y="64">S1: Quoted transit</text>
      <text x="795" y="132">S2: One day longer</text>
    </g>
    <g fill="#f7f8fa" stroke="#c7d0dc">
      <rect x="250" y="439" width="150" height="54" rx="6"/>
      <rect x="460" y="213" width="130" height="54" rx="6"/>
      <rect x="460" y="363" width="130" height="54" rx="6"/>
      <rect x="460" y="515" width="130" height="54" rx="6"/>
      <rect x="660" y="184" width="270" height="44" rx="6"/>
      <rect x="660" y="252" width="270" height="44" rx="6"/>
      <rect x="660" y="334" width="270" height="44" rx="6"/>
      <rect x="660" y="402" width="270" height="44" rx="6"/>
      <rect x="660" y="486" width="270" height="44" rx="6"/>
      <rect x="660" y="554" width="270" height="44" rx="6"/>
    </g>
    <g fill="#52647e" text-anchor="middle">
      <text x="325" y="473">Order changes</text>
      <text x="525" y="247">Slot lost</text>
      <text x="525" y="384"><tspan x="525">Slot</tspan><tspan x="525" dy="22">usable</tspan></text>
      <text x="525" y="549">Slot lost</text>
      <text x="795" y="212">S3: Quoted transit</text>
      <text x="795" y="280">S4: One day longer</text>
      <text x="795" y="362">S5: Quoted transit</text>
      <text x="795" y="430">S6: One day longer</text>
      <text x="795" y="514">S7: Quoted transit</text>
      <text x="795" y="582">S8: One day longer</text>
    </g>
    <path d="M30 608h30" stroke="#3156bc" stroke-width="3"/>
    <text x="70" y="614" font-size="14">Examined</text>
    <path d="M210 608h30" stroke="#b9c4d1" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="250" y="614" font-size="14">Unexamined</text>
  </g>
</svg>
