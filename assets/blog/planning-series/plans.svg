<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="plans-title plans-desc">
  <title id="plans-title">Why plans are not enough</title>
  <desc id="plans-desc">A paper plan names people, service and timing. Beside it, a hypothetical tree contains eight modeled futures: two paths are examined and six remain unexamined. This reports coverage, not success or probability. Four separate questions remain below: complete, feasible, preferred and accepted. This is an editorial illustration of the essay, not an application screenshot.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="366" r="294" fill="#fff"/>
  <ellipse cx="480" cy="665" rx="330" ry="12" fill="#e8e8ee"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="70" y="47" font-size="14" letter-spacing="1.6">PLANNING, UNCERTAINTY, AND COMMITMENT</text>
    <text x="480" y="110" text-anchor="middle" font-size="34" font-weight="600">Why plans are not enough</text>
  </g>
  <rect x="794" y="25" width="96" height="32" rx="16" fill="#eee8f7"/>
  <text x="842" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#7850c2">1 OF 3</text>

  <!-- A specified arrangement, without a passing or acceptance symbol. -->
  <rect x="83" y="222" width="250" height="330" rx="12" fill="#e6f2f0" stroke="#177681" stroke-width="3"/>
  <path d="M70 208h205l45 45v274a12 12 0 0 1-12 12H82a12 12 0 0 1-12-12z" fill="#fff" stroke="#193743" stroke-width="3" stroke-linejoin="round"/>
  <path d="M275 208v45h45" fill="#eee8f7" stroke="#193743" stroke-width="3" stroke-linejoin="round"/>
  <text x="96" y="268" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743">A specified plan</text>
  <g fill="#f6f3fa" stroke="#c7b8df" stroke-width="2">
    <rect x="94" y="294" width="201" height="62" rx="7"/>
    <rect x="94" y="371" width="201" height="62" rx="7"/>
    <rect x="94" y="448" width="201" height="62" rx="7"/>
  </g>
  <g fill="none" stroke="#7850c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="119" cy="315" r="7"/>
    <path d="M108 340v-4a11 11 0 0 1 22 0v4"/>
    <path d="m109 390 10-6 10 6v14l-10 6-10-6zm0 0 10 6 10-6m-10 6v14"/>
    <circle cx="119" cy="479" r="12"/>
    <path d="M119 471v9l6 4"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#193743">
    <text x="146" y="333">People</text>
    <text x="146" y="410">Service</text>
    <text x="146" y="487">Timing</text>
  </g>

  <!-- Futures concern conditions, rather than service choices or probabilities. -->
  <text x="650" y="183" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#193743">Illustrative futures</text>
  <g fill="none" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M335 365h95m0 0 90-95m-90 95 90 95M520 270l130-45m-130 45 130 45M520 460l130-45m-130 45 130 45"/>
    <path d="M650 225l180-20m-180 20 180 20M650 315l180-20m-180 20 180 20M650 415l180-20m-180 20 180 20M650 505l180-20m-180 20 180 20"/>
  </g>
  <path d="M430 365l90-95 130-45 180-20M650 225l180 20" fill="none" stroke="#177681" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="430" cy="365" r="10" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/>
  <g fill="#fff" stroke="#b7cbd1" stroke-width="2.5">
    <circle cx="520" cy="270" r="7"/><circle cx="520" cy="460" r="7"/>
    <circle cx="650" cy="225" r="7"/><circle cx="650" cy="315" r="7"/>
    <circle cx="650" cy="415" r="7"/><circle cx="650" cy="505" r="7"/>
    <circle cx="830" cy="295" r="10"/><circle cx="830" cy="335" r="10"/>
    <circle cx="830" cy="395" r="10"/><circle cx="830" cy="435" r="10"/>
    <circle cx="830" cy="485" r="10"/><circle cx="830" cy="525" r="10"/>
  </g>
  <g fill="#c6e3e1" stroke="#177681" stroke-width="3">
    <circle cx="830" cy="205" r="10"/><circle cx="830" cy="245" r="10"/>
  </g>
  <circle cx="487" cy="558" r="6" fill="#177681"/>
  <circle cx="671" cy="558" r="6" fill="#fff" stroke="#b7cbd1" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#53717b">
    <text x="501" y="564">Examined</text><text x="685" y="564">Unexamined</text>
  </g>

  <!-- Parallel claims share a basis; they are not an approval pipeline. -->
  <g fill="#fff" stroke="#b7cbd1" stroke-width="2">
    <rect x="74" y="598" width="194" height="45" rx="10"/>
    <rect x="280" y="598" width="194" height="45" rx="10"/>
    <rect x="486" y="598" width="194" height="45" rx="10"/>
    <rect x="692" y="598" width="194" height="45" rx="10"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#193743">
    <text x="171" y="628">Complete?</text><text x="377" y="628">Feasible?</text>
    <text x="583" y="628">Preferred?</text><text x="789" y="628">Accepted?</text>
  </g>
  <text x="480" y="689" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#193743">A proposal is not the whole reasoning.</text>
</svg>
