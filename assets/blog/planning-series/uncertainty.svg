<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="uncertainty-title uncertainty-desc">
  <title id="uncertainty-title">How much uncertainty is left?</title>
  <desc id="uncertainty-desc">Two paper charts illustrate the essay's stipulated eight-state probability model. Before observing anything, eight equally likely states have entropy three bits. A symmetric report of one condition that is ninety percent accurate changes the probabilities but leaves all eight states possible, with residual entropy 2.4690 bits. The illustration concerns a teaching model, not measured shipment data or an application output.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="366" r="294" fill="#fff"/>
  <ellipse cx="480" cy="665" rx="330" ry="12" fill="#e8e8ee"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="70" y="47" font-size="14" letter-spacing="1.6">PLANNING, UNCERTAINTY, AND COMMITMENT</text>
    <text x="480" y="110" text-anchor="middle" font-size="34" font-weight="600">How much uncertainty is left?</text>
  </g>
  <rect x="794" y="25" width="96" height="32" rx="16" fill="#eee8f7"/>
  <text x="842" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#7850c2">2 OF 3</text>

  <!-- The two distributions share the same states and probability scale. -->
  <rect x="93" y="215" width="324" height="350" rx="13" fill="#eee8f7" stroke="#7850c2" stroke-width="3"/>
  <rect x="80" y="202" width="324" height="350" rx="13" fill="#fff" stroke="#193743" stroke-width="3"/>
  <rect x="563" y="215" width="324" height="350" rx="13" fill="#e6f2f0" stroke="#177681" stroke-width="3"/>
  <rect x="550" y="202" width="324" height="350" rx="13" fill="#fff" stroke="#193743" stroke-width="3"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="108" y="246" font-size="27" font-weight="600">Before</text>
    <text x="108" y="276" font-size="18" fill="#53717b">Eight equally likely states</text>
    <text x="578" y="246" font-size="27" font-weight="600">After a noisy check</text>
    <text x="578" y="276" font-size="18" fill="#53717b">90% accurate in either state</text>
  </g>
  <g fill="#ddd0ee" stroke="#7850c2" stroke-width="2">
    <rect x="108" y="394" width="23" height="80" rx="3"/><rect x="143" y="394" width="23" height="80" rx="3"/>
    <rect x="178" y="394" width="23" height="80" rx="3"/><rect x="213" y="394" width="23" height="80" rx="3"/>
    <rect x="248" y="394" width="23" height="80" rx="3"/><rect x="283" y="394" width="23" height="80" rx="3"/>
    <rect x="318" y="394" width="23" height="80" rx="3"/><rect x="353" y="394" width="23" height="80" rx="3"/>
  </g>
  <g fill="#c6e3e1" stroke="#177681" stroke-width="2">
    <rect x="578" y="330" width="23" height="144" rx="3"/><rect x="613" y="330" width="23" height="144" rx="3"/>
    <rect x="648" y="330" width="23" height="144" rx="3"/><rect x="683" y="330" width="23" height="144" rx="3"/>
    <rect x="718" y="458" width="23" height="16" rx="3"/><rect x="753" y="458" width="23" height="16" rx="3"/>
    <rect x="788" y="458" width="23" height="16" rx="3"/><rect x="823" y="458" width="23" height="16" rx="3"/>
  </g>
  <path d="M108 478h268M578 478h268" fill="none" stroke="#193743" stroke-width="2" stroke-linecap="round"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="middle">
    <text x="242" y="525" fill="#7850c2">3.0000 bits</text>
    <text x="712" y="525" fill="#177681">2.4690 bits</text>
  </g>

  <!-- An observation changes the distribution; it does not select the state. -->
  <g fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="479" cy="363" r="26" fill="#f6f5f8"/>
    <path d="m497 382 18 18M430 428h94m-10-9 10 9-10 9"/>
  </g>
  <g fill="#7850c2">
    <circle cx="473" cy="357" r="3"/><circle cx="486" cy="357" r="3"/>
    <circle cx="473" cy="370" r="3"/><circle cx="486" cy="370" r="3"/>
  </g>
  <text x="480" y="604" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#53717b">Stipulated teaching model · Same eight states</text>
  <text x="480" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743">Less uncertainty. Several futures remain.</text>
</svg>
