<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="question-worth-cover-title question-worth-cover-desc">
  <title id="question-worth-cover-title">What Is a Question Worth?</title>
  <desc id="question-worth-cover-desc">An editorial illustration of a balance comparing two groups of marbles. One pan sits lower than the other, suggesting a comparison that narrows the search for a single heavy marble. A purple question mark floats beside the scale. The illustration is schematic and assigns no payouts.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>

  <!-- A question becomes a comparison. The scale and groups are schematic. -->
  <circle cx="779" cy="137" r="58" fill="#eee8f7"/>
  <path d="M761 123c0-24 38-27 38-3 0 15-21 16-21 32" fill="none" stroke="#7850c2" stroke-width="8" stroke-linecap="round"/>
  <circle cx="778" cy="173" r="4.5" fill="#7850c2"/>

  <path d="M180 617h600" fill="none" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="480" cy="617" rx="165" ry="13" fill="#e8e8ee"/>

  <!-- Stand, fulcrum, and a slightly tilted beam. -->
  <rect x="470" y="260" width="20" height="303" rx="6" fill="#193743"/>
  <path d="M480 220l-29 59h58z" fill="#193743"/>
  <path d="M246 257l468-36" fill="none" stroke="#193743" stroke-width="12" stroke-linecap="round"/>
  <circle cx="480" cy="239" r="21" fill="#fff" stroke="#193743" stroke-width="7"/>
  <circle cx="480" cy="239" r="8" fill="#7850c2"/>
  <circle cx="246" cy="257" r="9" fill="#fff" stroke="#193743" stroke-width="5"/>
  <circle cx="714" cy="221" r="9" fill="#fff" stroke="#193743" stroke-width="5"/>

  <!-- Equal-sized candidate groups; no individual marble is marked heavy. -->
  <path d="M246 268l-89 168m89-168 89 168" fill="none" stroke="#193743" stroke-width="5" stroke-linecap="round"/>
  <circle cx="246" cy="355" r="27" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
  <circle cx="215" cy="407" r="27" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
  <circle cx="277" cy="407" r="27" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
  <path d="M153 437h186c-7 34-42 48-93 48s-86-14-93-48z" fill="#eee8f7" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>

  <path d="M714 232l-89 168m89-168 89 168" fill="none" stroke="#193743" stroke-width="5" stroke-linecap="round"/>
  <circle cx="714" cy="319" r="27" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <circle cx="683" cy="371" r="27" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <circle cx="745" cy="371" r="27" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
  <path d="M621 401h186c-7 34-42 48-93 48s-86-14-93-48z" fill="#e6f2f0" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>

  <!-- Broad shapes retain their silhouette at thumbnail sizes. -->
  <path d="M433 553h94l44 45H389z" fill="#e5dfed" stroke="#193743" stroke-width="5" stroke-linejoin="round"/>
  <rect x="352" y="598" width="256" height="18" rx="8" fill="#193743"/>
</svg>
