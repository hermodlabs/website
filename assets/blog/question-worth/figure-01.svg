<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 731" width="1040" height="731" role="img" aria-labelledby="figure-01-title figure-01-desc">
<title id="figure-01-title">What changed about the decision?</title>
<desc id="figure-01-desc">Four cases state their physical situation, required answer, and success criterion. Exact search: 1,024 marbles, one heavy in total, exact identity, fewest worst-case weighings. Bag search: the same marbles split 512 red and 512 blue, containing bag, enough detail. Payout game: one heavy in each bag, choose a bag, expected payout less test cost. App: nine marbles, one heavy in total, reliable bag identification, choice by minute 12.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="731" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="24" y="43" font-size="29" fill="#193743" font-weight="700" text-anchor="start">What changed about the decision?</text><rect x="24" y="80" width="472" height="300" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="44" y="117" font-size="23" fill="#177681" font-weight="700" text-anchor="start">1. Find the marble</text><text x="44" y="166" font-size="14" fill="#536873" font-weight="700" text-anchor="start">PHYSICAL SITUATION</text><text x="44" y="199" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">1,024 marbles; one heavy in total</text><text x="44" y="241" font-size="14" fill="#536873" font-weight="700" text-anchor="start">REQUIRED ANSWER</text><rect x="35" y="250" width="450" height="36" rx="3" fill="#edf5f5" stroke="none" stroke-width="1.5"/><text x="44" y="274" font-size="18.5" fill="#193743" font-weight="700" text-anchor="start">Exact marble identity</text><text x="44" y="316" font-size="14" fill="#536873" font-weight="700" text-anchor="start">JUDGE THE PLAN BY</text><text x="44" y="349" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">Fewest worst-case weighings</text><rect x="544" y="80" width="472" height="300" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="564" y="117" font-size="23" fill="#7850c2" font-weight="700" text-anchor="start">2. Find the containing bag</text><text x="564" y="166" font-size="14" fill="#536873" font-weight="700" text-anchor="start">PHYSICAL SITUATION</text><text x="564" y="199" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">Same marbles: 512 red + 512 blue</text><text x="564" y="241" font-size="14" fill="#536873" font-weight="700" text-anchor="start">REQUIRED ANSWER</text><rect x="555" y="250" width="450" height="36" rx="3" fill="#f2edf8" stroke="none" stroke-width="1.5"/><text x="564" y="274" font-size="18.5" fill="#193743" font-weight="700" text-anchor="start">Containing bag</text><text x="564" y="316" font-size="14" fill="#536873" font-weight="700" text-anchor="start">JUDGE THE PLAN BY</text><text x="564" y="349" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">Enough detail for the question</text><rect x="24" y="407" width="472" height="300" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="44" y="444" font-size="23" fill="#177681" font-weight="700" text-anchor="start">3. Choose the valuable bag</text><text x="44" y="493" font-size="14" fill="#536873" font-weight="700" text-anchor="start">PHYSICAL SITUATION</text><text x="44" y="526" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">New game: one heavy in each bag</text><text x="44" y="568" font-size="14" fill="#536873" font-weight="700" text-anchor="start">REQUIRED ANSWER</text><text x="44" y="601" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">Which bag to redeem</text><text x="44" y="643" font-size="14" fill="#536873" font-weight="700" text-anchor="start">JUDGE THE PLAN BY</text><rect x="35" y="652" width="450" height="36" rx="3" fill="#edf5f5" stroke="none" stroke-width="1.5"/><text x="44" y="676" font-size="18.5" fill="#193743" font-weight="700" text-anchor="start">Expected payout less test cost</text><rect x="544" y="407" width="472" height="300" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="564" y="444" font-size="23" fill="#7850c2" font-weight="700" text-anchor="start">4. Choose before handoff</text><text x="564" y="493" font-size="14" fill="#536873" font-weight="700" text-anchor="start">PHYSICAL SITUATION</text><text x="564" y="526" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">App: nine marbles; one heavy in total</text><text x="564" y="568" font-size="14" fill="#536873" font-weight="700" text-anchor="start">REQUIRED ANSWER</text><text x="564" y="601" font-size="18.5" fill="#193743" font-weight="400" text-anchor="start">Containing bag, with reliable evidence</text><text x="564" y="643" font-size="14" fill="#536873" font-weight="700" text-anchor="start">JUDGE THE PLAN BY</text><rect x="555" y="652" width="450" height="36" rx="3" fill="#f2edf8" stroke="none" stroke-width="1.5"/><text x="564" y="676" font-size="18.5" fill="#193743" font-weight="700" text-anchor="start">Choice completed by minute 12</text></g>
</svg>
