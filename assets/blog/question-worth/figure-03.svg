<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 672" width="1040" height="672" role="img" aria-labelledby="figure-03-title figure-03-desc">
<title id="figure-03-title">How the search grows</title>
<desc id="figure-03-desc">Two plots show exact worst-case weighing counts for integer marble counts from 1 to 1,024 on linear horizontal axes. One at a time is N minus 1. Halving is ceiling log base 2 of N. Three-way splitting is ceiling log base 3 of N. The left plot shows all three with a full vertical scale; the right zooms to show the grouped staircases. At 1,024 marbles their counts are 1,023, 10, and 7, respectively. Assumes an ideal balance and one known-heavier marble.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="672" fill="white"/>
