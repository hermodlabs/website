<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img" aria-labelledby="figure-06-title figure-06-desc">
<title id="figure-06-title">One weighing divides the same 1,024 candidates in different ways</title>
<desc id="figure-06-desc">First-weighing result partitions under a uniform prior. Checking one candidate produces groups of 1 and 1,023, expected gain 0.011 bits and expected remaining entropy 9.989 bits. Halving produces 512 and 512, gain 1.000 bits and 9.000 bits remain. Three-way splitting produces 341, 341, and 342, gain 1.585 bits and 8.415 bits remain. Segment widths show exact probabilities; reported entropy values are rounded to three decimals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="650" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="24" y="42" font-size="27" fill="#193743" font-weight="700" text-anchor="start">One weighing divides the same 1,024 candidates</text><text x="24" y="76" font-size="27" fill="#193743" font-weight="700" text-anchor="start">in different ways</text><text x="253" y="124" font-size="18" fill="#536873" font-weight="400" text-anchor="start">Possible results partition the candidates</text><text x="889" y="112" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">Expected</text><text x="889" y="135" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">information gain</text><text x="24" y="200" font-size="21" fill="#193743" font-weight="700" text-anchor="start">Check one</text><text x="24" y="226" font-size="21" fill="#193743" font-weight="700" text-anchor="start">candidate</text><rect x="253.00000" y="188" width="0.48828" height="44" fill="#bedfdf"/><path d="M 253.24414 186 V 166 H 278" fill="none" stroke="#177681" stroke-width="1.5" stroke-linejoin="round"/><text x="283" y="172" font-size="18" fill="#177681" font-weight="700" text-anchor="start">1</text><rect x="253.48828" y="188" width="499.51172" height="44" fill="#ddd0ee"/><text x="503.244" y="218" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">1,023</text><path d="M 253.48828 188 v 44" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/><text x="253" y="261" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">1 or 1,023 candidates remain</text><text x="889" y="214" font-size="26" fill="#177681" font-weight="700" text-anchor="middle">0.011 bits</text><text x="889" y="252" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">9.989 bits remain</text><text x="24" y="334" font-size="21" fill="#193743" font-weight="700" text-anchor="start">Ask which</text><text x="24" y="360" font-size="21" fill="#193743" font-weight="700" text-anchor="start">half</text><rect x="253.00000" y="322" width="250.00000" height="44" fill="#bedfdf"/><text x="378.0" y="352" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">512</text><rect x="503.00000" y="322" width="250.00000" height="44" fill="#ddd0ee"/><text x="628.0" y="352" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">512</text><path d="M 503.00000 322 v 44" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/><text x="253" y="395" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">512 candidates remain in either outcome</text><text x="889" y="348" font-size="26" fill="#177681" font-weight="700" text-anchor="middle">1.000 bits</text><text x="889" y="386" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">9.000 bits remain</text><text x="24" y="468" font-size="21" fill="#193743" font-weight="700" text-anchor="start">Use three</text><text x="24" y="494" font-size="21" fill="#193743" font-weight="700" text-anchor="start">outcomes</text><rect x="253.00000" y="456" width="166.50391" height="44" fill="#bedfdf"/><text x="336.252" y="486" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">341</text><rect x="419.50391" y="456" width="166.50391" height="44" fill="#ddd0ee"/><text x="502.756" y="486" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">341</text><path d="M 419.50391 456 v 44" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/><rect x="586.00781" y="456" width="166.99219" height="44" fill="#e0e7ec"/><text x="669.504" y="486" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">342</text><path d="M 586.00781 456 v 44" fill="none" stroke="white" stroke-width="1" stroke-linejoin="round"/><text x="253" y="529" font-size="17.5" fill="#536873" font-weight="400" text-anchor="start">341, 341, or 342 candidates remain</text><text x="889" y="482" font-size="26" fill="#177681" font-weight="700" text-anchor="middle">1.585 bits</text><text x="889" 