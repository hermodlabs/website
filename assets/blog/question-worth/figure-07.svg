<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 579" width="1040" height="579" role="img" aria-labelledby="figure-07-title figure-07-desc">
<title id="figure-07-title">Price the weighings, then plan the work around them</title>
<desc id="figure-07-desc">At two credits per physical weighing, worst-case costs are 1,023 times 2 equals 2,046 credits for individual checking; 10 times 2 equals 20 credits for halving; 7 times 2 equals 14 credits for three-way splitting. A separate sequence is prepare and sort, weigh, record, interpret, choose. Only the weighing step is priced in these totals. Other stages consume resources; no stage durations are assumed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="579" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="24" y="42" font-size="27" fill="#193743" font-weight="700" text-anchor="start">Price the weighings, then plan the work around them</text><text x="24" y="82" font-size="21" fill="#177681" font-weight="700" text-anchor="start">2 credits per weighing</text><rect x="24" y="112" width="292" height="181" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="170" y="153" font-size="21" fill="#7850c2" font-weight="700" text-anchor="middle">One at a time</text><text x="170" y="213" font-size="35" fill="#193743" font-weight="700" text-anchor="middle">1,023 × 2</text><text x="170" y="263" font-size="26" fill="#7850c2" font-weight="700" text-anchor="middle">2,046 credits</text><rect x="374" y="112" width="292" height="181" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="520" y="153" font-size="21" fill="#177681" font-weight="700" text-anchor="middle">Divide into halves</text><text x="520" y="213" font-size="35" fill="#193743" font-weight="700" text-anchor="middle">10 × 2</text><text x="520" y="263" font-size="26" fill="#177681" font-weight="700" text-anchor="middle">20 credits</text><rect x="724" y="112" width="292" height="181" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><text x="870" y="153" font-size="21" fill="#946211" font-weight="700" text-anchor="middle">Divide into thirds</text><text x="870" y="213" font-size="35" fill="#193743" font-weight="700" text-anchor="middle">7 × 2</text><text x="870" y="263" font-size="26" fill="#946211" font-weight="700" text-anchor="middle">14 credits</text><text x="24" y="341" font-size="22" fill="#193743" font-weight="700" text-anchor="start">The complete learning plan also needs time and resources for</text><rect x="24" y="378" width="176" height="89" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="112" y="413" font-size="21" fill="#193743" font-weight="400" text-anchor="middle">Prepare</text><text x="112" y="438" font-size="21" fill="#193743" font-weight="400" text-anchor="middle">&amp; sort</text><path d="M 205 423 h 16" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="228" y="378" width="176" height="89" rx="8" fill="#f2edf8" stroke="#7850c2" stroke-width="1.5"/><text x="316" y="431" font-size="21" fill="#193743" font-weight="700" text-anchor="middle">Weigh</text><path d="M 409 423 h 16" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="432" y="378" width="176" height="89" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="520" y="431" font-size="21" fill="#193743" font-weight="400" text-anchor="middle">Record</text><path d="M 613 423 h 16" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="636" y="378" width="176" height="89" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="724" y="431" font-size="21" fill="#193743" font-weight="400" text-anchor="middle">Interpret</text><path d="M 817 423 h 16" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="840" y="378" width="176" height="89" rx="8" fill="#edf5f5" stroke="#d3dfe5" stroke-width="1.5"/><text x="928" y="431" font-size="21" fill="#193743" font-weight="400" text-anchor="middle">Choose</text><text x="24" y="514" font-size="19" fill="#536873" font-weight="400" text-anchor="start">Only the highlighted weighing step is priced in the credit totals above;</text><text x="24" y="542" font-size="19" fill="#536873" font-weight="400" text-anchor="start">no durations are assumed here.</text></g>
</svg>
