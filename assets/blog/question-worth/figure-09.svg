<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 741" width="1040" height="741" role="img" aria-labelledby="figure-09-title figure-09-desc">
<title id="figure-09-title">A useful test changes which bag you choose</title>
<desc id="figure-09-desc">A new payout game has one heavy marble in each bag, two heavy marbles in total. Red has nine marbles all labeled $60 and pays $60 certainly. Blue has 512 $100 labels and 512 $0 labels, so expected payout is $50. Without a test choose red. Pay $5 once to test blue&#x27;s two payout groups. With probability one half the $100 group is heavier: choose blue and receive $100. With probability one half the $0 group is heavier: choose red and receive $60. Expected payout before the fee is $80, after it $75; gross information value $20 and net gain $15. Bag icons are schematic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="741" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="24" y="42" font-size="28" fill="#193743" font-weight="700" text-anchor="start">A useful test changes which bag you choose</text><text x="24" y="80" font-size="19" fill="#536873" font-weight="400" text-anchor="start">New game: one heavy marble in each bag; two heavy marbles in total.</text><rect x="24" y="106" width="472" height="180" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><path d="M 69 143 H 125 L 119 164 Q 160 200 144 251 Q 96 258 50 246 Q 37 204 75 164 Z" fill="#fbefec" stroke="#b44539" stroke-width="2.5"/><path d="M 70 164 H 125" fill="none" stroke="#b44539" stroke-width="3" stroke-linejoin="round"/><text x="98" y="207" font-size="19" fill="#b44539" font-weight="700" text-anchor="middle">$60</text><text x="181" y="145" font-size="22" fill="#b44539" font-weight="700" text-anchor="start">RED BAG</text><text x="181" y="185" font-size="19" fill="#193743" font-weight="400" text-anchor="start">9 marbles, all labeled $60</text><text x="181" y="259" font-size="24" fill="#b44539" font-weight="700" text-anchor="start">Certain payout: $60</text><rect x="544" y="106" width="472" height="180" rx="8" fill="white" stroke="#d3dfe5" stroke-width="1.5"/><path d="M 589 143 H 645 L 639 164 Q 680 200 664 251 Q 616 258 570 246 Q 557 204 595 164 Z" fill="#edf4fa" stroke="#326e9c" stroke-width="2.5"/><path d="M 590 164 H 645" fill="none" stroke="#326e9c" stroke-width="3" stroke-linejoin="round"/><text x="618" y="207" font-size="19" fill="#326e9c" font-weight="700" text-anchor="middle">$100</text><text x="618" y="233" font-size="19" fill="#326e9c" font-weight="700" text-anchor="middle">or $0</text><text x="701" y="145" font-size="22" fill="#326e9c" font-weight="700" text-anchor="start">BLUE BAG</text><text x="701" y="185" font-size="19" fill="#193743" font-weight="400" text-anchor="start">512 × $100; 512 × $0</text><text x="701" y="218" font-size="17" fill="#536873" font-weight="400" text-anchor="start">1,024 equally likely locations</text><text x="701" y="259" font-size="24" fill="#326e9c" font-weight="700" text-anchor="start">Expected payout: $50</text><rect x="24" y="307" width="992" height="56" rx="8" fill="#edf5f5" stroke="none" stroke-width="1.5"/><text x="520" y="343" font-size="23" fill="#193743" font-weight="700" text-anchor="middle">Without testing: choose red and receive $60.</text><rect x="24" y="416" width="221" height="126" rx="8" fill="#f2edf8" stroke="#c8b7e4" stroke-width="1.5"/><text x="134.5" y="465" font-size="24" fill="#193743" font-weight="700" text-anchor="middle">Test blue</text><text x="134.5" y="496" font-size="24" fill="#193743" font-weight="700" text-anchor="middle">Pay $5 once</text><path d="M 255 455 L 428 410" fill="none" stroke="#326e9c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="323" y="418" font-size="21" fill="#326e9c" font-weight="700" text-anchor="start">50%</text><path d="M 255 502 L 428 548" fill="none" stroke="#b44539" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="323" y="550" font-size="21" fill="#b44539" font-weight="700" text-anchor="start">50%</text><rect x="442" y="380" width="574" height="92" rx="8" fill="#edf4fa" stroke="#c4d8ea" stroke-width="1.5"/><text x="465" y="416" font-size="21" fill="#193743" font-weight="400" text-anchor="start">The $100 group is heavier</text><text x="465" y="450" font-size="24" fill="#326e9c" font-weight="700" text-anchor="start">Choose BLUE → receive $100</text><rect x="442" y="504" width="574" height="92" rx="8" fill="#fbf0ee" stroke="#e6ccc7" stroke-width="1.5"/><text x="465" y="540" font-size="21" fill="#193743" font-weight="400" text-anchor="start">The $0 group is heavier</text><text x="465" y="574" font-size="24" fill="#b44539" font-weight="700" text-anchor="start">Choose RED → receive $60</text><text x="24" y="646" font-size="22" fill="#177681" font-weight="700" text-anchor="start">Expected payout with the result: $80. After the $5 test fee: $75.</text><text x="24" y="678" font-size="22" fill="#177681" font-weight="700" text-anchor="start">Gross information value: $80 − $60 = $20.</text><text x="24" y="710" font-size="22" fill="#177681" font-weight="700" text-anchor="start">Net gain: $20 − $5 = $15.</text></g>
</svg>
