<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 777" width="1040" height="777" role="img" aria-labelledby="figure-09-title figure-09-desc">
<title id="figure-09-title">A result has value through the choice it can change</title>
<desc id="figure-09-desc">Decision network. Rounded uncertainty nodes: unknown heavy positions and scale result. Rectangular choices: choose a test and choose a bag. Diamond value: payout less test cost. Unknown positions predict the scale result and are payout inputs. Test choice determines the scale result, is known at bag choice, and contributes test cost. Scale result informs bag choice. Bag choice is a payout input. Hidden positions are not directly observed before choosing. Arrows express dependency, available information, or value inputs, not the full ontology.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="777" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="24" y="43" font-size="28" fill="#193743" font-weight="700" text-anchor="start">A result has value through the choice it can change</text><path d="M 777 128 V 87 H 28 V 600 H 53" fill="none" stroke="#7850c2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="76" font-size="18" fill="#7850c2" font-weight="400" text-anchor="middle">test cost</text><path d="M 390 188 L 605 348" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="468" y="231" font-size="18" fill="#536873" font-weight="400" text-anchor="start">predicts</text><path d="M 220 221 V 532" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="402" font-size="18" fill="#536873" font-weight="400" text-anchor="start">payout input</text><path d="M 777 221 V 313" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="801" y="272" font-size="18" fill="#536873" font-weight="400" text-anchor="start">depends on test</text><path d="M 953 173 H 1001 V 588 H 963" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text transform="translate(1024,392) rotate(-90)" text-anchor="middle" font-size="18" fill="#536873">test known</text><path d="M 777 407 V 532" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="802" y="477" font-size="18" fill="#536873" font-weight="400" text-anchor="start">informs</text><path d="M 590 588 L 391 599" fill="none" stroke="#536873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="489" y="565" font-size="18" fill="#536873" font-weight="400" text-anchor="middle">payout input</text><ellipse cx="220" cy="173" rx="175" ry="47" fill="#edf5f5" stroke="#177681" stroke-width="2"/><text x="220" y="181" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Unknown heavy positions</text><rect x="601" y="126" width="352" height="94" rx="2" fill="#f2edf8" stroke="#7850c2" stroke-width="1.5"/><text x="777" y="181" font-size="24" fill="#193743" font-weight="700" text-anchor="middle">Choose a test</text><ellipse cx="777" cy="360" rx="175" ry="47" fill="#edf5f5" stroke="#177681" stroke-width="2"/><text x="777" y="368" font-size="24" fill="#193743" font-weight="700" text-anchor="middle">Scale result</text><rect x="601" y="541" width="352" height="94" rx="2" fill="#f2edf8" stroke="#7850c2" stroke-width="1.5"/><text x="777" y="596" font-size="24" fill="#193743" font-weight="700" text-anchor="middle">Choose a bag</text><path d="M 220 534 L 388 600 L 220 666 L 52 600 Z" fill="#edf5f5" stroke="#177681" stroke-width="2"/><text x="220" y="593" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">Payout less</text><text x="220" y="620" font-size="22" fill="#193743" font-weight="700" text-anchor="middle">test cost</text><text x="24" y="714" font-size="19" fill="#536873" font-weight="400" text-anchor="start">Rounded: uncertain quantities     Rectangles: choices     Diamond: value</text><text x="24" y="743" font-size="19" fill="#536873" font-weight="400" text-anchor="start">Hidden positions are not directly observed before choosing.</text></g>
</svg>
