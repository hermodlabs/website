<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="products-page-cover-title products-page-cover-desc">
  <title id="products-page-cover-title">Two ways to work with a shared model</title>
  <desc id="products-page-cover-desc">A terminal window and a reusable code module connect to the same small decision model. This conceptual illustration represents the forthcoming Decision Lab CLI and SDK.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <g fill="none" stroke="#c8d4dc" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 11">
    <path d="M277 267c25-53 69-85 124-95M559 172c55 10 99 42 124 95"/>
  </g>
  <ellipse cx="480" cy="606" rx="256" ry="15" fill="#e8e8ee"/>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Both tools connect to one shared decision model. -->
    <path d="M480 211v34m0 0-66 29m66-29 66 29" fill="none" stroke="#177681"/>
    <path d="M414 274h-85v54m217-54h85v54" fill="none" stroke="#177681"/>
    <path d="m480 154 31 28-31 29-31-29z" fill="#ddd0ee"/>
    <circle cx="480" cy="245" r="14" fill="#fff"/>
    <rect x="395" y="255" width="38" height="38" rx="10" fill="#c6e3e1"/>
    <rect x="527" y="255" width="38" height="38" rx="10" fill="#ddd0ee"/>
    <!-- A terminal window, with abstract command marks. -->
    <rect x="194" y="328" width="270" height="234" rx="16" fill="#fff"/>
    <path d="M210 328h238c9 0 16 7 16 16v32H194v-32c0-9 7-16 16-16z" fill="#c6e3e1"/>
    <circle cx="218" cy="352" r="4" fill="#177681" stroke="none"/>
    <circle cx="236" cy="352" r="4" fill="#177681" stroke="none"/>
    <circle cx="254" cy="352" r="4" fill="#177681" stroke="none"/>
    <path d="m229 415 18 16-18 16m39 0h33" fill="none" stroke="#177681"/>
    <path d="M229 482h112m-112 26h77" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <!-- A reusable code module inside a second window. -->
    <rect x="496" y="328" width="270" height="234" rx="16" fill="#fff"/>
    <path d="M512 328h238c9 0 16 7 16 16v32H496v-32c0-9 7-16 16-16z" fill="#ddd0ee"/>
    <circle cx="520" cy="352" r="4" fill="#7850c2" stroke="none"/>
    <circle cx="538" cy="352" r="4" fill="#7850c2" stroke="none"/>
    <circle cx="556" cy="352" r="4" fill="#7850c2" stroke="none"/>
    <rect x="561" y="405" width="144" height="118" rx="12" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
    <rect x="547" y="418" width="144" height="118" rx="12" fill="#fff"/>
    <path d="m586 452-16 16 16 16m66-32 16 16-16 16m-28-40-12 48" fill="none" stroke="#7850c2"/>
    <path d="M581 511h76" fill="none" stroke="#9caeb8" stroke-width="4"/>
  </g>
  <path d="M180 617h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
</svg>
