<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="page-services-title page-services-desc">
  <title id="page-services-title">Build a model together</title>
  <desc id="page-services-desc">Two people collaborate on a shared relationship model, connecting its custom logic to a written report.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="615" rx="246" ry="13" fill="#e8e8ee"/>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A shared, inspectable model and the logic used to build it. -->
    <rect x="325" y="166" width="300" height="278" rx="18" fill="#fff"/>
    <path d="M348 220h254" stroke="#d3dfe5"/>
    <path d="m368 186-12 11 12 11m30-22 12 11-12 11m-16-24-7 27" fill="none" stroke="#7850c2" stroke-width="4"/>
    <path d="m382 281 100-24 71 70-98 59-73-105m100-24-27 129m-73-105 171 46" fill="none" stroke="#177681"/>
    <circle cx="382" cy="281" r="21" fill="#c6e3e1"/>
    <circle cx="482" cy="257" r="18" fill="#fff"/>
    <circle cx="553" cy="327" r="23" fill="#ddd0ee"/>
    <circle cx="455" cy="386" r="20" fill="#fff"/>
    <!-- The model connects to a report, with no implied result. -->
    <path d="M625 306h50" fill="none" stroke="#177681"/>
    <path d="m661 294 14 12-14 12" fill="none" stroke="#177681"/>
    <path d="M687 230h80l33 33v145H687z" fill="#fff"/>
    <path d="M767 230v33h33" fill="#e5eef1"/>
    <path d="M710 291h66m-66 25h66m-66 25h44" fill="none" stroke="#177681" stroke-width="4"/>
    <path d="M710 376h37" fill="none" stroke="#7850c2" stroke-width="4"/>
    <!-- Two collaborators work on the same model. -->
    <path d="M272 478h26v35h-26z" fill="#fff"/>
    <path d="M224 602v-58c0-37 21-57 61-57s61 20 61 57v58z" fill="#c6e3e1"/>
    <path d="M327 516c28-9 43-34 59-72" fill="none" stroke-width="7"/>
    <circle cx="285" cy="442" r="39" fill="#fff"/>
    <path d="M248 432c2-24 20-39 40-39 25 0 38 17 36 41-16-1-29-11-36-22-11 13-25 19-40 20z" fill="#193743"/>
    <path d="M649 478h26v35h-26z" fill="#fff"/>
    <path d="M601 602v-58c0-37 21-57 61-57s61 20 61 57v58z" fill="#ddd0ee"/>
    <path d="M620 516c-25-9-40-34-52-72" fill="none" stroke-width="7"/>
    <circle cx="662" cy="442" r="39" fill="#fff"/>
    <path d="M625 432c2-24 17-39 39-39 25 0 39 18 36 42-16-3-29-12-38-24-10 12-21 18-37 21z" fill="#193743"/>
