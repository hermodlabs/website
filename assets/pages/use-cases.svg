<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="use-cases-cover-title use-cases-cover-desc">
  <title id="use-cases-cover-title">A business case becomes a review people can use</title>
  <desc id="use-cases-cover-desc">A reusable review connects a business brief, a person examining alternatives, and an operational handoff. The illustration represents using Decision Lab with a concrete business problem.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="614" rx="263" ry="14" fill="#e8e8ee"/>
  <g fill="none" stroke="#c8d4dc" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 11">
    <path d="M263 271c34-81 103-126 190-130m86 15c84 24 141 81 162 156"/>
  </g>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A concrete case arrives as a brief. -->
    <path d="M172 284h104l37 37v175H172z" fill="#fff"/>
    <path d="M276 284v37h37" fill="#e5eef1"/>
    <rect x="194" y="346" width="31" height="31" rx="5" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
    <path d="M244 350h43m-43 22h30M196 411h91m-91 27h91m-91 27h55" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <path d="M314 395h47m-13-12 13 12-13 12" fill="none" stroke="#177681"/>
    <!-- The reusable review holds requirements and complete alternatives. -->
    <rect x="361" y="227" width="264" height="316" rx="17" fill="#fff"/>
    <path d="M378 227h230c9 0 17 8 17 17v42H361v-42c0-9 8-17 17-17z" fill="#ddd0ee"/>
    <path d="M387 257h58m25 0h21" fill="none" stroke="#7850c2" stroke-width="4"/>
    <rect x="386" y="310" width="214" height="61" rx="9" fill="#f6f5f8" stroke="#d3dfe5" stroke-width="3"/>
    <path d="M406 331h91m-91 20h148" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <path d="M412 401h162m-162 39h162m-162 39h115" fill="none" stroke="#d3dfe5" stroke-width="4"/>
    <circle cx="412" cy="401" r="9" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
    <circle cx="493" cy="440" r="9" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
    <circle cx="451" cy="479" r="9" fill="#fff" stroke="#9caeb8" stroke-width="4"/>
    <path d="M625 395h45m-13-12 13 12-13 12" fill="none" stroke="#177681"/>
    <!-- The case worker inspects the review; an outcome is not implied. -->
    <path d="M701 459h25v36h-25z" fill="#fff"/>
    <path d="M656 604v-61c0-35 20-55 57-55s57 20 57 55v61z" fill="#c6e3e1"/>
    <circle cx="713" cy="424" r="37" fill="#fff"/>
    <path d="M677 416c2-24 18-38 38-38 24 0 37 17 35 40-16-2-28-11-35-22-10 12-24 19-38 20z" fill="#193743"/>
    <path d="M669 524c-24-6-43-26-54-53" fill="none" stroke-width="7"/>
    <!-- The reusable structure can support further cases. -->
    <path d="M493 227v-39m0 0-64-30m64 30 64-30" fill="none" stroke="#177681" stroke-width="4"/>
    <rect x="412" y="139" width="34" height="34" rx="8" fill="#c6e3e1" stroke-width="4"/>
    <rect x="540" y="139" width="34" height="34" rx="8" fill="#ddd0ee" stroke-width="4"/>
    <circle cx="493" cy="188" r="10" fill="#fff" stroke-width="4"/>
  </g>
  <path d="M180 617h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
</svg>
