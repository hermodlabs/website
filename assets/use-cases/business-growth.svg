<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="business-growth-title business-growth-desc">
  <title id="business-growth-title">Growth is a complete business commitment</title>
  <desc id="business-growth-desc">Funding, delivery capacity and timing connect to one complete growth plan. These are operating requirements to examine together before making a commitment; the illustration does not rank plans or predict demand.</desc>
