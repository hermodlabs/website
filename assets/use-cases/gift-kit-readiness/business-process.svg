<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1440" width="1200" height="1440" role="img" aria-labelledby="gift-process-title gift-process-desc">
  <title id="gift-process-title">From a failed gift journey to a correction proposal</title>
  <desc id="gift-process-desc">A proposed business process. The campaign team records the failed journey for an exact configuration, reviews the possible faults, compares complete corrections, and checks resources, confirmation and permission. A supported proposal includes planned time for correction, a fresh rehearsal and handoff. Business owners separately approve and perform the correction, conduct the real fresh rehearsal, and hand off the kits only when their operating requirements are met. Teal boxes show the demonstrated review; dashed boxes show real business work outside the calculation. A failed fresh rehearsal returns to investigation.</desc>
  <defs>
    <marker id="gift-process-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#177681"/></marker>
    <marker id="gift-process-handoff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#667b86"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#193743}
      .section{font-size:20px;font-weight:700;letter-spacing:2px}
      .label{font-size:28px;font-weight:700}
      .detail{font-size:23px;fill:#48616d}
      .small{font-size:21px;fill:#48616d}
      .review{fill:#f2f8f7;stroke:#177681;stroke-width:3}
      .outside{fill:#fff;stroke:#899ba4;stroke-width:2.5;stroke-dasharray:8 7}
      .flow{fill:none;stroke:#177681;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#gift-process-arrow)}
      .handoff{fill:none;stroke:#667b86;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:8 7;marker-end:url(#gift-process-handoff)}
    </style>
  </defs>
  <rect width="1200" height="1440" rx="18" fill="#f6f5f8"/>
  <text x="60" y="67" font-size="36" font-weight="700">Before the gift kits leave</text>
  <text x="60" y="104" class="detail">A proposed business process · Hermod Labs</text>
  <g transform="translate(60 136)">
    <rect width="27" height="20" rx="4" class="review"/>
    <text x="39" y="17" class="small">Demonstrated review steps</text>
    <rect x="489" width="27" height="20" rx="4" class="outside"/>
    <text x="528" y="17" class="small">Real work outside the calculation</text>
  </g>
  <rect x="38" y="194" width="1124" height="700" rx="15" fill="#fff"/>
  <text x="63" y="235" class="section">CAMPAIGN TEAM</text>
  <rect x="294" y="265" width="666" height="108" rx="13" class="review"/>
  <text x="627" y="308" class="label" text-anchor="middle">Record the failed journey</text>
  <text x="627" y="342" class="detail" text-anchor="middle">Exact batch · insert · destination · checkout · device · account</text>
  <path d="M627 373v37" class="flow"/>
  <rect x="294" y="413" width="666" height="108" rx="13" class="review"/>
  <text x="627" y="456" class="label" text-anchor="middle">Review the possible faults</text>
  <text x="627" y="490" class="detail" text-anchor="middle">Use the recorded checks; keep unresolved explanations</text>
  <path d="M627 521v37" class="flow"/>
  <rect x="294" y="561" width="666" height="108" rx="13" class="review"/>
  <text x="627" y="604" class="label" text-anchor="middle">Compare complete corrections</text>
  <text x="627" y="638" class="detail" text-anchor="middle">Cover the faults · correction + fresh rehearsal + handoff</text>
  <path d="M627 669v37" class="flow"/>
  <rect x="294" y="709" width="666" height="138" rx="13" class="review"/>
  <text x="627" y="752" class="label" text-anchor="middle">Check the whole arrangement</text>
  <text x="627" y="786" class="detail" text-anchor="middle">Time · expense · resources · permission · confirmation</text>
  <text x="627" y="820" class="detail" text-anchor="middle">Recommend a supported proposal, or resolve its blockers</text>
  <!-- A calculated proposal is handed to people; it does not execute the work. -->
  <rect x="38" y="917" width="1124" height="478" rx="15" fill="#edf1f3"/>
  <text x="63" y="958" class="section">BUSINESS OWNERS &amp; OPERATIONS</text>
  <path d="M627 847v142" class="handoff"/>
  <rect x="294" y="993" width="666" height="96" rx="13" class="outside"/>
  <text x="627" y="1034" class="label" text-anchor="middle">Approve and perform the correction</text>
  <text x="627" y="1067" class="detail" text-anchor="middle">Confirm authority and the actual operating conditions</text>
  <path d="M627 1089v36" class="handoff"/>
  <rect x="294" y="1129" width="666" height="96" rx="13" class="outside"/>
  <text x="627" y="1170" class="label" text-anchor="middle">Run the fresh rehearsal</text>
  <text x="627" y="1203" class="detail" text-anchor="middle">Record the real result; a planned rehearsal has no result yet</text>
  <path d="M627 1225v36" class="handoff"/>
  <text x="651" y="1252" class="small">Requirements met</text>
  <rect x="294" y="1265" width="666" height="88" rx="13" class="outside"/>
  <text x="627" y="1318" class="label" text-anchor="middle">Hand off the kits</text>
  <path d="M294 1177H141V467h145" class="handoff"/>
  <text x="163" y="606" font-size="19">Failed</text>
  <text x="163" y="632" font-size="19">fresh rehearsal?</text>
  <text x="163" y="668" font-size="19">Investigate</text>
  <text x="163" y="694" font-size="19">again</text>
</svg>
