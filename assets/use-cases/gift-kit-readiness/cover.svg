<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="gift-readiness-cover-title gift-readiness-cover-desc">
  <title id="gift-readiness-cover-title">Compare complete corrections before releasing gift kits</title>
  <desc id="gift-readiness-cover-desc">A printed gift insert leads to two complete correction arrangements. The internal correction costs $300 and reaches handoff at minute 35; the external correction costs $400 and reaches handoff at minute 20. The external option also depends on a valid confirmation. Both include time for a fresh rehearsal and handoff; the comparison does not approve release.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 289h87v82h51m-51 0v142h51" stroke="#b7cbd1"/>
    <path d="m321 359 13 12-13 12m0 118 13 12-13 12" stroke="#177681"/>
    <path d="M117 181h89l30 30v134H117z" fill="#fff"/>
    <path d="M206 181v30h30" fill="#e5eef1"/>
    <path d="M136 237h76m-76 19h52" stroke="#9caeb8" stroke-width="3"/>
    <rect x="138" y="277" width="23" height="23" fill="#ddd0ee" stroke="#7850c2"/>
    <path d="M177 278h34m-34 19h18m-57 21h74" stroke="#7850c2" stroke-width="3"/>
    <!-- Each option contains the whole correction, rehearsal and handoff. -->
    <rect x="338" y="278" width="461" height="135" rx="14" fill="#f2f8f7" stroke="#a4ceca" stroke-width="3"/>
    <rect x="338" y="442" width="461" height="135" rx="14" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="3"/>
    <g stroke-width="3">
      <circle cx="736" cy="351" r="34" fill="#fff" stroke="#177681"/>
      <circle cx="736" cy="515" r="34" fill="#fff" stroke="#7850c2"/>
      <path d="M736 326v25l16 11" stroke="#177681"/>
      <path d="M736 490v25l16 11" stroke="#7850c2"/>
    </g>
    <path d="M543 578v31h-72" stroke="#b7a0d5" stroke-dasharray="6 8" stroke-width="3"/>
    <rect x="367" y="590" width="102" height="65" rx="6" fill="#fff" stroke="#b7a0d5" stroke-width="3"/>
    <path d="M384 608h68m-68 15h68m-68 15h42" stroke="#b7a0d5" stroke-width="3"/>
  </g>
  <g fill="#193743" font-family="Helvetica,Arial,sans-serif">
    <text x="338" y="211" font-size="27" font-weight="600">Repair the whole journey.</text>
    <text x="364" y="317" font-size="24" font-weight="600">Internal correction</text>
    <text x="364" y="356" font-size="29">$300</text>
    <text x="364" y="388" font-size="22" fill="#48616d">Handoff at minute 35</text>
    <text x="364" y="481" font-size="24" font-weight="600">External correction</text>
    <text x="364" y="520" font-size="29">$400</text>
    <text x="364" y="552" font-size="22" fill="#48616d">Handoff at minute 20</text>
    <text x="489" y="638" font-size="20" fill="#7850c2">Confirmation required</text>
  </g>
</svg>
