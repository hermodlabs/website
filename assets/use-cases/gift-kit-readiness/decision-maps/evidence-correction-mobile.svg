<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="bccc37bcd913521d20fb6c69c5c2e09920d372605ea7cfa925cb97267f3392ac" data-view="evidence-correction" data-variant="mobile"><title id="title">Scoped evidence changes sufficient work.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Source-bound explanatory views of the current worked cases. Declared stakeholder concerns remain separate from calculated findings and records of actual operating events. The illustrations do not calculate eligibility or grant authority.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="360" height="790" rx="16" fill="#fcfbfe"/><text x="18" y="34" fill="#342d43" font-size="21" font-weight="650" text-anchor="start"><tspan x="18" dy="0">What evidence changes.</tspan></text><text x="18" y="67" fill="#6c6578" font-size="16" font-weight="400" text-anchor="start"><tspan x="18" dy="0">GIFT-324 · the same current campaign</tspan></text><g data-node="conservative-screen"><rect x="18" y="99" width="324" height="120" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="180" y="143.345" fill="#342d43" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Conservative screen</tspan><tspan x="180" dy="20.925">8 declared fault combinations</tspan><tspan x="180" dy="20.925">Complete external correction: $400</tspan></text></g><g data-node="diagnostic-records"><rect x="18" y="252" width="324" height="118" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="180" y="295.34499999999997" fill="#342d43" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Current scoped diagnostic records</tspan><tspan x="180" dy="20.925">Unreadable insert; correct artwork</tspan><tspan x="180" dy="20.925">and usable checkout</tspan></text></g><g data-edge="screen-requests-review"><path d="M 18 159 H 7 V 421 H 18" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="records-inform-review"><path d="M 180 370 V 394" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="review-records"><rect x="18" y="394" width="324" height="61" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="419.475" fill="#342d43" font-size="15" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">Check source records</tspan><tspan x="180" dy="20.25">Apply inputs and recalculate</tspan></text></g><g data-edge="review-supports-fault"><path d="M 180 455 V 501" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="insert-fault"><rect x="18" y="501" width="324" height="90" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="180" y="540.6400000000001" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Scoped diagnostic basis</tspan><tspan x="180" dy="21.6">Supports insert-only correction</tspan></text></g><g data-edge="fault-supports-correction"><path d="M 180 591 V 639" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="smaller-correction"><rect x="18" y="639" width="324" height="102" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="684.6400000000001" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Insert replacement: $100</tspan><tspan x="180" dy="21.6">Planned handoff at 1,435</tspan></text></g></g></svg>
