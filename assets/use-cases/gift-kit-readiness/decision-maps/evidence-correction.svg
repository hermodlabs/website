<svg xmlns="http://www.w3.org/2000/svg" width="650" height="490" viewBox="0 0 650 490" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="0b79af3391d7d04e279dbdae75b712dd58f44bef9b3bc9e4b6806a7d9617d740" data-view="evidence-correction" data-variant="desktop"><title id="title">Reviewed evidence changes sufficient work.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Fictional gift-kit examples. Current v3 operating reviews are separate from the v2 rehearsal-policy authoring branch. These explanatory relationships do not evaluate business rules or authenticate records.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="650" height="490" rx="16" fill="#fcfbfe"/><text x="24" y="36" fill="#342d43" font-size="23" font-weight="650" text-anchor="start"><tspan x="24" dy="0">Reviewed evidence changes sufficient work.</tspan></text><text x="24" y="67" fill="#6c6578" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="24" dy="0">GIFT-324 · the same current campaign</tspan></text><g data-node="conservative-screen"><rect x="24" y="99" width="280" height="134" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="164" y="151.35500000000002" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="164" dy="0">Unreviewed conservative screen</tspan><tspan x="164" dy="19.575000000000003">8 published fault combinations</tspan><tspan x="164" dy="19.575000000000003">Complete external correction: $400</tspan></text></g><g data-node="diagnostic-records"><rect x="346" y="99" width="280" height="134" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="486" y="151.35500000000002" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="486" dy="0">Current scoped diagnostic records</tspan><tspan x="486" dy="19.575000000000003">Unreadable insert; correct artwork</tspan><tspan x="486" dy="19.575000000000003">and usable checkout</tspan></text></g><g data-edge="screen-requests-review"><path d="M 164 233 V 258 H 250 V 280" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="records-inform-review"><path d="M 486 233 V 258 H 400 V 280" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="review-records"><rect x="145" y="280" width="360" height="56" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="325" y="312.93" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="middle"><tspan x="325" dy="0">People review the inputs and findings</tspan></text></g><g data-edge="review-supports-fault"><path d="M 250 336 V 360 H 164 V 389" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="insert-fault"><rect x="24" y="389" width="280" height="78" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="164" y="423.1425" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="164" dy="0">Reviewed diagnostic basis</tspan><tspan x="164" dy="19.575000000000003">Supports insert-only correction</tspan></text></g><g data-edge="fault-supports-correction"><path d="M 304 428 H 346" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="smaller-correction"><rect x="346" y="389" width="280" height="78" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="486" y="423.1425" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="486" dy="0">Insert replacement: $100</tspan><tspan x="486" dy="19.575000000000003">Planned handoff at 1,435</tspan></text></g></g></svg>
