<svg xmlns="http://www.w3.org/2000/svg" width="360" height="925" viewBox="0 0 360 925" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="0b79af3391d7d04e279dbdae75b712dd58f44bef9b3bc9e4b6806a7d9617d740" data-view="interests" data-variant="mobile"><title id="title">One promise. Several things to protect.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Fictional gift-kit examples. Current v3 operating reviews are separate from the v2 rehearsal-policy authoring branch. These explanatory relationships do not evaluate business rules or authenticate records.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="360" height="925" rx="16" fill="#fcfbfe"/><text x="18" y="34" fill="#342d43" font-size="21" font-weight="650" text-anchor="start"><tspan x="18" dy="0">One promise. Shared concerns.</tspan></text><g data-node="promise"><rect x="18" y="75" width="324" height="80" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="180" y="109.80749999999999" fill="#342d43" font-size="15.5" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">120 usable kits by day-end</tspan><tspan x="180" dy="20.925">Correction expense no more than $600</tspan></text></g><rect x="30" y="183" width="300" height="80" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="marketing"><text x="180" y="207" fill="#342d43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="180" dy="0">Marketing</tspan></text></g><g data-edge="marketing-cares"><path d="M 180 210 V 215" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="experience"><text x="180" y="231" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Whole recipient</tspan><tspan x="180" dy="21.6">journey works</tspan></text></g><rect x="30" y="280" width="300" height="80" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="production"><text x="180" y="304" fill="#342d43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="180" dy="0">Production</tspan></text></g><g data-edge="production-cares"><path d="M 180 307 V 312" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="achievable"><text x="180" y="328" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Achievable correction,</tspan><tspan x="180" dy="21.6">rehearsal and handoff</tspan></text></g><rect x="30" y="377" width="300" height="80" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="finance"><text x="180" y="401" fill="#342d43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="180" dy="0">Finance</tspan></text></g><g data-edge="finance-cares"><path d="M 180 404 V 409" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="expense"><text x="180" y="425" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Justified correction</tspan><tspan x="180" dy="21.6">expense</tspan></text></g><g data-edge="experience-informs"><path d="M 30 245 H 10 V 482 H 95 V 500" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="achievable-informs"><path d="M 330 342 H 350 V 482 H 265 V 500" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="expense-informs"><path d="M 130 457 V 500" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="leah"><text x="230" y="481" fill="#342d43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">Leah</tspan></text></g><g data-edge="leah-proposes"><path d="M 230 486 V 500" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="response"><rect x="30" y="500" width="300" height="62" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="536.27" fill="#342d43" font-size="15.5" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">Propose a complete correction</tspan></text></g><g data-edge="response-promise"><path d="M 30 530 H 3 V 115 H 18" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-requires"><path d="M 110 562 V 588 H 12 V 636 H 42" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-compares"><path d="M 180 562 V 580 H 8 V 754 H 42" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-human"><path d="M 250 562 V 590 H 4 V 856 H 42" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="hard-rules"><rect x="42" y="597" width="300" height="100" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="192" y="610.42" fill="#342d43" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="192" dy="0">Mandatory conditions</tspan><tspan x="192" dy="20.925">Complete correction</tspan><tspan x="192" dy="20.925">Cutoff; fresh rehearsal</tspan><tspan x="192" dy="20.925">Resources; permission</tspan><tspan x="192" dy="20.925">Booking when required</tspan></text></g><g data-node="priority"><rect x="42" y="715" width="300" height="78" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="192" y="738.345" fill="#342d43" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="192" dy="0">Compare passing plans</tspan><tspan x="192" dy="20.925">Lower expense first;</tspan><tspan x="192" dy="20.925">then earlier handoff</tspan></text></g><g data-node="human-work"><rect x="42" y="811" width="300" height="90" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="192" y="829.8824999999999" fill="#342d43" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="192" dy="0">Responsible people</tspan><tspan x="192" dy="20.925">Review and authorize</tspan><tspan x="192" dy="20.925">Perform the correction</tspan><tspan x="192" dy="20.925">Verify actual results</tspan></text></g></g></svg>
