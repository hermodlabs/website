<svg xmlns="http://www.w3.org/2000/svg" width="650" height="610" viewBox="0 0 650 610" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="bccc37bcd913521d20fb6c69c5c2e09920d372605ea7cfa925cb97267f3392ac" data-view="interests" data-variant="desktop"><title id="title">One promise. Several things to protect.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Source-bound explanatory views of the current worked cases. Declared stakeholder concerns remain separate from calculated findings and records of actual operating events. The illustrations do not calculate eligibility or grant authority.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="650" height="610" rx="16" fill="#fcfbfe"/><text x="24" y="36" fill="#342d43" font-size="23" font-weight="650" text-anchor="start"><tspan x="24" dy="0">One promise. Several things to protect.</tspan></text><g data-node="promise"><rect x="24" y="77" width="602" height="70" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="325" y="106.305" fill="#342d43" font-size="17" font-weight="550" text-anchor="middle"><tspan x="325" dy="0">120 usable kits by day-end</tspan><tspan x="325" dy="22.950000000000003">Correction expense no more than $600</tspan></text></g><rect x="24" y="189" width="190" height="96" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="marketing"><text x="119" y="213" fill="#342d43" font-size="16" font-weight="650" text-anchor="middle"><tspan x="119" dy="0">Marketing</tspan></text></g><g data-edge="marketing-cares"><path d="M 119 220 V 230" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="experience"><text x="119" y="248" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="119" dy="0">Whole recipient</tspan><tspan x="119" dy="19.575000000000003">journey works</tspan></text></g><rect x="230" y="189" width="190" height="96" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="production"><text x="325" y="213" fill="#342d43" font-size="16" font-weight="650" text-anchor="middle"><tspan x="325" dy="0">Production</tspan></text></g><g data-edge="production-cares"><path d="M 325 220 V 230" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="achievable"><text x="325" y="248" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="325" dy="0">Achievable correction,</tspan><tspan x="325" dy="19.575000000000003">rehearsal and handoff</tspan></text></g><rect x="436" y="189" width="190" height="96" rx="12" fill="#fff" stroke="#ddd7e8"/><g data-node="finance"><text x="531" y="213" fill="#342d43" font-size="16" font-weight="650" text-anchor="middle"><tspan x="531" dy="0">Finance</tspan></text></g><g data-edge="finance-cares"><path d="M 531 220 V 230" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="expense"><text x="531" y="248" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="531" dy="0">Justified correction</tspan><tspan x="531" dy="19.575000000000003">expense</tspan></text></g><g data-edge="experience-informs"><path d="M 119 285 V 310 H 220 V 350" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="achievable-informs"><path d="M 325 285 V 305 H 295 V 350" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="expense-informs"><path d="M 531 285 V 310 H 430 V 350" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="leah"><text x="325" y="330" fill="#342d43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="325" dy="0">Leah</tspan></text></g><g data-edge="leah-proposes"><path d="M 325 336 V 350" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="response"><rect x="170" y="350" width="310" height="60" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="325" y="384.93" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="middle"><tspan x="325" dy="0">Propose a complete correction</tspan></text></g><g data-edge="response-promise"><path d="M 170 380 H 12 V 112 H 24" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-requires"><path d="M 235 410 V 438 H 119 V 466" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-compares"><path d="M 325 410 V 466" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="response-human"><path d="M 415 410 V 438 H 531 V 466" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="hard-rules"><rect x="24" y="466" width="190" height="112" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="119" y="488.96" fill="#342d43" font-size="14" font-weight="400" text-anchor="middle"><tspan x="119" dy="0">Mandatory conditions</tspan><tspan x="119" dy="18.900000000000002">Complete correction</tspan><tspan x="119" dy="18.900000000000002">Cutoff; fresh rehearsal</tspan><tspan x="119" dy="18.900000000000002">Resources; permission</tspan><tspan x="119" dy="18.900000000000002">Booking when required</tspan></text></g><g data-node="priority"><rect x="230" y="466" width="190" height="112" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="325" y="507.86" fill="#342d43" font-size="14" font-weight="400" text-anchor="middle"><tspan x="325" dy="0">Compare passing plans</tspan><tspan x="325" dy="18.900000000000002">Lower expense first;</tspan><tspan x="325" dy="18.900000000000002">then earlier handoff</tspan></text></g><g data-node="human-work"><rect x="436" y="466" width="190" height="112" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="531" y="498.40999999999997" fill="#342d43" font-size="14" font-weight="400" text-anchor="middle"><tspan x="531" dy="0">Responsible people</tspan><tspan x="531" dy="18.900000000000002">Review and authorize</tspan><tspan x="531" dy="18.900000000000002">Perform the correction</tspan><tspan x="531" dy="18.900000000000002">Verify actual results</tspan></text></g></g></svg>
