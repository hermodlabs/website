<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="0b79af3391d7d04e279dbdae75b712dd58f44bef9b3bc9e4b6806a7d9617d740" data-view="operating-records" data-variant="mobile"><title id="title">A plan needs records of actual work.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Fictional gift-kit examples. Current v3 operating reviews are separate from the v2 rehearsal-policy authoring branch. These explanatory relationships do not evaluate business rules or authenticate records.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="360" height="920" rx="16" fill="#fcfbfe"/><text x="18" y="34" fill="#342d43" font-size="21" font-weight="650" text-anchor="start"><tspan x="18" dy="0">Records support completion.</tspan></text><text x="18" y="67" fill="#6c6578" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="18" dy="0">GIFT-321 · separate sourced operating records</tspan></text><g data-node="actual-authorization"><rect x="18" y="100" width="324" height="63" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="180" y="136.94" fill="#342d43" font-size="16" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">Separate $400 authorization</tspan></text></g><g data-edge="authorization-before-work"><path d="M 180 163 V 196" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="actual-correction"><rect x="18" y="196" width="324" height="88" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="180" y="223.84" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Correction recorded</tspan><tspan x="180" dy="21.6">120 kits</tspan><tspan x="180" dy="21.6">Complete at 1,420</tspan></text></g><g data-edge="correction-before-test"><path d="M 180 284 V 317" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="actual-pass"><rect x="18" y="317" width="324" height="88" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="344.84" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Fresh rehearsal passed</tspan><tspan x="180" dy="21.6">Corrected output</tspan><tspan x="180" dy="21.6">At 1,430</tspan></text></g><g data-edge="pass-before-handoff"><path d="M 180 405 V 438" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="actual-handoff"><rect x="18" y="438" width="324" height="88" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="180" y="465.84" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Handoff recorded</tspan><tspan x="180" dy="21.6">120 kits</tspan><tspan x="180" dy="21.6">At 1,435</tspan></text></g><g data-edge="authorization-supports-completion"><path d="M 342 131 H 352 V 604 H 342" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="correction-supports-completion"><path d="M 342 240 H 352 V 604 H 342" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="pass-supports-completion"><path d="M 342 361 H 352 V 604 H 342" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="handoff-supports-completion"><path d="M 180 526 V 559" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="completion-claim"><rect x="18" y="559" width="324" height="90" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="598.6400000000001" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Original completion supported</tspan><tspan x="180" dy="21.6">Before the later report</tspan></text></g><g data-node="later-failure"><rect x="18" y="714" width="324" height="90" rx="12" fill="#fbf0f2" stroke="#ddd7e8"/><text x="180" y="753.6400000000001" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Later rehearsal failed: 1,436</tspan><tspan x="180" dy="21.6">Same corrected output</tspan></text></g><g data-edge="failure-withdraws-completion"><path d="M 315 714 V 649" fill="none" stroke="#624b8b" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="failure-supersedes-pass"><path d="M 18 759 H 7 V 361 H 18" fill="none" stroke="#624b8b" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="35" y="686" fill="#624b8b" font-size="15" font-weight="400" text-anchor="start"><tspan x="35" dy="0">Withdraws current completion</tspan></text><text x="18" y="850" fill="#342d43" font-size="16" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Earlier records stay in history,</tspan></text><text x="18" y="875" fill="#342d43" font-size="16" font-weight="400" text-anchor="start"><tspan x="18" dy="0">including the recorded handoff.</tspan></text></g></svg>
