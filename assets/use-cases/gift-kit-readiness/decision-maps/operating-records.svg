<svg xmlns="http://www.w3.org/2000/svg" width="650" height="550" viewBox="0 0 650 550" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="bccc37bcd913521d20fb6c69c5c2e09920d372605ea7cfa925cb97267f3392ac" data-view="operating-records" data-variant="desktop"><title id="title">A plan needs records of actual work.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Source-bound explanatory views of the current worked cases. Declared stakeholder concerns remain separate from calculated findings and records of actual operating events. The illustrations do not calculate eligibility or grant authority.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="650" height="550" rx="16" fill="#fcfbfe"/><text x="24" y="36" fill="#342d43" font-size="23" font-weight="650" text-anchor="start"><tspan x="24" dy="0">A plan needs records of actual work.</tspan></text><text x="24" y="67" fill="#6c6578" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="24" dy="0">GIFT-321 · separate sourced operating records</tspan></text><g data-node="actual-authorization"><rect x="24" y="91" width="602" height="58" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="325" y="124.93" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="middle"><tspan x="325" dy="0">Separate $400 authorization</tspan></text></g><g data-edge="authorization-before-work"><path d="M 164 149 V 185" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="actual-correction"><rect x="24" y="185" width="184" height="100" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="116" y="220.35500000000002" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="116" dy="0">Correction recorded</tspan><tspan x="116" dy="19.575000000000003">120 kits</tspan><tspan x="116" dy="19.575000000000003">Complete at 1,420</tspan></text></g><g data-node="actual-pass"><rect x="233" y="185" width="184" height="100" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="325" y="220.35500000000002" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="325" dy="0">Fresh rehearsal passed</tspan><tspan x="325" dy="19.575000000000003">Corrected output</tspan><tspan x="325" dy="19.575000000000003">At 1,430</tspan></text></g><g data-node="actual-handoff"><rect x="442" y="185" width="184" height="100" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="534" y="220.35500000000002" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="534" dy="0">Handoff recorded</tspan><tspan x="534" dy="19.575000000000003">120 kits</tspan><tspan x="534" dy="19.575000000000003">At 1,435</tspan></text></g><g data-edge="correction-before-test"><path d="M 208 235 H 233" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="pass-before-handoff"><path d="M 417 235 H 442" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="authorization-supports-completion"><path d="M 24 120 H 12 V 340 H 116 V 374" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="correction-supports-completion"><path d="M 116 285 V 330 H 144 V 374" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="pass-supports-completion"><path d="M 325 285 V 342 H 190 V 374" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="handoff-supports-completion"><path d="M 534 285 V 354 H 235 V 374" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="completion-claim"><rect x="24" y="374" width="280" height="96" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="164" y="417.1425" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="164" dy="0">Original completion supported</tspan><tspan x="164" dy="19.575000000000003">Before the later report</tspan></text></g><g data-node="later-failure"><rect x="346" y="374" width="280" height="96" rx="12" fill="#fbf0f2" stroke="#ddd7e8"/><text x="486" y="417.1425" fill="#342d43" font-size="14.5" font-weight="400" text-anchor="middle"><tspan x="486" dy="0">Later rehearsal failed: 1,436</tspan><tspan x="486" dy="19.575000000000003">Same corrected output</tspan></text></g><g data-edge="failure-withdraws-completion"><path d="M 346 423 H 304" fill="none" stroke="#624b8b" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="failure-supersedes-pass"><path d="M 486 374 V 308 H 325 V 285" fill="none" stroke="#624b8b" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="350" y="302" fill="#624b8b" font-size="14" font-weight="400" text-anchor="start"><tspan x="350" dy="0">Supersedes the earlier pass</tspan></text><text x="24" y="515" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="start"><tspan x="24" dy="0">Current completion is withdrawn. Handoff history remains.</tspan></text></g></svg>
