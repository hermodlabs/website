<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="0b79af3391d7d04e279dbdae75b712dd58f44bef9b3bc9e4b6806a7d9617d740" data-view="rehearsal-policy" data-variant="mobile"><title id="title">Change the requirement. Keep the case distinct.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Fictional gift-kit examples. Current v3 operating reviews are separate from the v2 rehearsal-policy authoring branch. These explanatory relationships do not evaluate business rules or authenticate records.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="360" height="650" rx="16" fill="#fcfbfe"/><text x="18" y="34" fill="#342d43" font-size="21" font-weight="650" text-anchor="start"><tspan x="18" dy="0">A case value is not a rule.</tspan></text><text x="18" y="67" fill="#6c6578" font-size="16" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Separate version 2 authoring branch</tspan></text><g data-node="original-minimum"><rect x="18" y="97" width="324" height="60" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="180" y="132.44" fill="#342d43" font-size="16" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">Original minimum: 5m</tspan></text></g><g data-node="adapted-minimum"><rect x="18" y="178" width="324" height="60" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="180" y="213.44" fill="#342d43" font-size="16" font-weight="550" text-anchor="middle"><tspan x="180" dy="0">Adapted minimum: 10m</tspan></text></g><text x="18" y="279" fill="#342d43" font-size="16" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Hold that adapted rule fixed:</tspan></text><g data-node="planned-five"><rect x="18" y="303" width="324" height="55" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="180" y="335.94" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Case plans 5 minutes</tspan></text></g><g data-edge="five-requires-rule"><path d="M 18 330 H 7 V 208 H 18" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="five-informs"><path d="M 180 358 V 383" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="five-blocked"><rect x="18" y="383" width="324" height="58" rx="12" fill="#fbf0f2" stroke="#ddd7e8"/><text x="180" y="417.44" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">No complete proposal</tspan></text></g><g data-node="planned-ten"><rect x="18" y="482" width="324" height="55" rx="12" fill="#fff" stroke="#ddd7e8"/><text x="180" y="514.94" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Case plans 10 minutes</tspan></text></g><g data-edge="ten-requires-rule"><path d="M 342 509 H 352 V 208 H 342" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-edge="ten-informs"><path d="M 180 537 V 562" fill="none" stroke="#aaa0bb" stroke-width="1.6" marker-end="url(#arrow)"/></g><g data-node="ten-supported"><rect x="18" y="562" width="324" height="67" rx="12" fill="#e3f2ee" stroke="#ddd7e8"/><text x="180" y="590.1400000000001" fill="#342d43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Internal correction supported</tspan><tspan x="180" dy="21.6">$300 · handoff at minute 40</tspan></text></g></g></svg>
