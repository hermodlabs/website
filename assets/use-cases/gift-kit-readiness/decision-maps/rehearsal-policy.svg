<svg xmlns="http://www.w3.org/2000/svg" width="650" height="410" viewBox="0 0 650 410" role="img" aria-labelledby="title desc" data-model="gift-kit-decision-maps" data-model-sha256="0b79af3391d7d04e279dbdae75b712dd58f44bef9b3bc9e4b6806a7d9617d740" data-view="rehearsal-policy" data-variant="desktop"><title id="title">Change the requirement. Keep the case distinct.</title><desc id="desc">Declared business perspectives and source-bound worked findings distinguish a proposal, its conditions and actual completion records. Fictional gift-kit examples. Current v3 operating reviews are separate from the v2 rehearsal-policy authoring branch. These explanatory relationships do not evaluate business rules or authenticate records.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#aaa0bb"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="650" height="410" rx="16" fill="#fcfbfe"/><text x="24" y="36" fill="#342d43" font-size="23" font-weight="650" text-anchor="start"><tspan x="24" dy="0">Change the requirement. Keep the case distinct.</tspan></text><text x="24" y="67" fill="#6c6578" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Separate version 2 authoring branch</tspan></text><g data-node="original-minimum"><rect x="24" y="95" width="270" height="64" rx="12" fill="#f3f1f6" stroke="#ddd7e8"/><text x="159" y="131.93" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="middle"><tspan x="159" dy="0">Original minimum: 5m</tspan></text></g><g data-node="adapted-minimum"><rect x="356" y="95" width="270" height="64" rx="12" fill="#eee8f8" stroke="#ddd7e8"/><text x="491" y="131.93" fill="#342d43" font-size="14.5" font-weight="550" text-anchor="middle"><tspan x="491" dy="0">Adapted minimum: 10m</tspan></text></g><g data-node="planned-five"><rect x="2