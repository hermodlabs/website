<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="gift-desk-title gift-desk-desc">
  <title id="gift-desk-title">One flagged gift-kit case. A revised complete proposal.</title>
  <desc id="gift-desk-desc">A conceptual Gift-kit Handoff Desk uses the same pinned Decision Lab app through the SDK. For campaign GIFT-221 with insert revision 4, an old revision 3 booking leaves the in-house correction package preferred at $300 with handoff at T plus 40 minutes. After a genuinely current booking is recorded and the case is reassessed, the external package becomes preferred at $400 with handoff at T plus 25 minutes. Both proposed packages include correction, a ten-minute planned rehearsal and handoff within a cutoff at T plus 24 hours. This is an illustration, not a screenshot or evidence that work is complete.</desc>
