<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="gift-rehearsal-cover-title gift-rehearsal-cover-desc">
  <title id="gift-rehearsal-cover-title">A longer rehearsal changes what the review can support</title>
  <desc id="gift-rehearsal-cover-desc">A five-minute rehearsal is compared with a ten-minute rehearsal. The updated requirement connects to a revised gift-kit review and its workflow, followed by two explicit business scenarios: five minutes is insufficient under the new rule and ten minutes meets the revised duration requirement. Passing this check does not mean a real rehearsal passed or that the kits are approved for release.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="236" cy="240" r="57" fill="#fff"/>
    <path d="M236 197v43l26 17" stroke="#177681"/>
    <path d="M305 240h71m-13-12 13 12-13 12" stroke="#177681"/>
    <rect x="403" y="169" width="277" height="145" rx="14" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="3"/>
    <path d="M541 314v58" stroke="#7850c2"/>
    <path d="m529 359 12 13 12-13" stroke="#7850c2"/>
    <!-- The revised app and the workflow dependency are separate authored changes. -->
    <path d="M410 416h91m-13-12 13 12-13 12" stroke="#b7cbd1"/>
    <rect x="260" y="375" width="150" height="82" rx="9" fill="#fff"/>
    <rect x="507" y="375" width="213" height="82" rx="9" fill="#fff"/>
    <path d="M335 457v43h278v-43M474 500v32" stroke="#b7cbd1" stroke-width="3"/>
    <rect x="262" y="536" width="196" height="88" rx="10" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
    <rect x="489" y="536" width="225" height="88" rx="10" fill="#f2f8f7" stroke="#a4ceca" stroke-width="3"/>
  </g>
  <g fill="#193743" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="236" y="333" font-size="23">Fresh rehearsal</text>
    <text x="541" y="226" font-size="27" font-weight="600">Minimum duration</text>
    <text x="541" y="278" font-size="37" fill="#7850c2">5 → 10 minutes</text>
    <text x="335" y="425" font-size="23" font-weight="600">New app</text>
    <text x="613" y="425" font-size="23" font-weight="600">Updated workflow</text>
    <text x="360" y="571" font-size="22">5-minute case</text>
    <text x="360" y="602" font-size="21" fill="#667b86">Insufficient</text>
    <text x="601" y="571" font-size="22">10-minute case</text>
    <text x="601" y="602" font-size="21" fill="#177681">Duration met</text>
  </g>
</svg>
