<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="gift-booking-title gift-booking-desc">
  <title id="gift-booking-title">A quote needs current support.</title>
  <desc id="gift-booking-desc">Editorial comparison of a confirmation whose scope matches the campaign and a genuine earlier confirmation that covers another insert. Only a matching record can supply the required support for the current campaign. The illustration assigns no insert numbers and does not claim to perform an assessment or renew a booking.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="365" r="286" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="166" y="161" width="628" height="88" rx="14" fill="#fff" stroke="#b7cbd1"/>
    <path d="m198 193 20-10 20 10v27l-20 10-20-10zm0 0 20 10 20-10m-20 10v27" fill="#ddd0ee" stroke="#7850c2" stroke-width="2.5"/>
    <path d="M480 250v33H270v29m210-29h210v29" stroke="#b7cbd1"/>
    <rect x="95" y="313" width="350" height="199" rx="14" fill="#f2f8f7" stroke="#a4ceca"/>
    <rect x="515" y="313" width="350" height="199" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <rect x="122" y="341" width="36" height="43" rx="3" fill="#fff" stroke="#177681"/>
    <path d="M130 352h20m-20 10h13m-9 10 5 5 10-12" stroke="#177681" stroke-width="2"/>
    <rect x="542" y="341" width="36" height="43" rx="3" fill="#fff" stroke="#7850c2"/>
    <path d="M550 352h20m-20 10h13m-13 10h20" stroke="#7850c2" stroke-width="2"/>
    <path d="M270 513v38h420v-38" stroke="#b7cbd1"/>
    <rect x="145" y="565" width="670" height="76" rx="12" fill="#fff" stroke="#c6b2e1"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="480" y="89" text-anchor="middle" font-size="31" font-weight="600">A quote needs current support.</text>
    <text x="272" y="214" font-size="27" font-weight="600">The current campaign</text>
    <text x="180" y="370" font-size="24" font-weight="600">Current confirmation</text>
    <text x="122" y="429" font-size="24" fill="#177681">Matches this campaign</text>
    <text x="122" y="470" font-size="20" fill="#48616d">Supplies the required scope</text>
    <text x="600" y="370" font-size="24" font-weight="600">Earlier confirmation</text>
    <text x="542" y="429" font-size="24" fill="#7850c2">Covers another insert</text>
    <text x="542" y="470" font-size="20" fill="#48616d">Leaves current support missing</text>
    <text x="480" y="612" text-anchor="middle" font-size="26" font-weight="600" fill="#7850c2">Keep the record’s original scope.</text>
  </g>
</svg>
