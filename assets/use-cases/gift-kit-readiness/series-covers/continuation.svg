  <title id="gift-continuation-title">Continue the same gift-kit case.</title>
  <desc id="gift-continuation-desc">Editorial illustration of a native portable workflow case moving from CLI campaign screening into a custom SDK handoff desk. The SDK opens and calculates the case; the shared report view presents the resulting findings. The host application owns its interface and operating integration. This is a conceptual cover, not a screenshot or an invented assessment result.</desc>
