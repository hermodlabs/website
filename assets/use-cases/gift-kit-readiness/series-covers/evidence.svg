<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="gift-evidence-title gift-evidence-desc">
  <title id="gift-evidence-title">Three checks. One supported problem.</title>
  <desc id="gift-evidence-desc">Editorial illustration of three scoped gift-kit records: an unreadable printed code, a wrong destination and a successful checkout check. Together the modeled observations establish that both the printed code and destination need correction. The successful checkout does not clear the earlier faults. This illustration is not a screenshot or a new assessment.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="366" r="286" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="72" y="190" width="248" height="230" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <rect x="356" y="190" width="248" height="230" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <rect x="640" y="190" width="248" height="230" rx="14" fill="#f2f8f7" stroke="#a4ceca"/>
    <rect x="166" y="224" width="60" height="60" rx="5" fill="#fff" stroke="#7850c2"/>
    <path d="M177 236h13v13h-13zm26 0h13v13h-13zm-26 26h13v13h-13zm26-1h6m6 0v14m-12-1h6m-23-26 24 24" stroke="#7850c2" stroke-width="2.5"/>
    <path d="M448 258h64m-14-14 14 14-14 14" stroke="#7850c2"/>
    <path d="M447 231v54m65-54v54" stroke="#c6b2e1"/>
    <circle cx="764" cy="254" r="31" fill="#fff" stroke="#177681"/>
    <path d="m750 254 10 10 19-23" stroke="#177681" stroke-width="4"/>
    <path d="M196 420v33h568v-33m-284 33v39" stroke="#b7cbd1"/>
    <path d="m470 480 10 12 10-12" stroke="#177681"/>
    <rect x="128" y="492" width="704" height="126" rx="14" fill="#e8f3f2" stroke="#a4ceca"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743" text-anchor="middle">
    <text x="480" y="89" font-size="31" font-weight="600">Three checks. One supported problem.</text>
    <text x="480" y="131" font-size="22" fill="#48616d">Same batch · same configuration</text>
    <text x="196" y="329" font-size="25" font-weight="600">Printed code</text>
    <text x="196" y="372" font-size="23" fill="#7850c2">Unreadable</text>
    <text x="480" y="329" font-size="25" font-weight="600">Destination</text>
    <text x="480" y="372" font-size="23" fill="#7850c2">Wrong destination</text>
    <text x="764" y="329" font-size="25" font-weight="600">Checkout</text>
    <text x="764" y="372" font-size="23" fill="#177681">Successful check</text>
    <text x="480" y="534" font-size="21" fill="#48616d">What the modeled records establish</text>
    <text x="480" y="580" font-size="27" font-weight="600">Correct the printed code and destination.</text>
    <text x="480" y="664" font-size="19" fill="#48616d">A successful later step does not clear an earlier fault.</text>
  </g>
</svg>
