<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="gift-handoff-title gift-handoff-desc">
  <title id="gift-handoff-title">A plan is not a completed handoff.</title>
  <desc id="gift-handoff-desc">Editorial illustration separates a planned correction, rehearsal and handoff from sourced records of what actually happened. Later evidence can change the support for a readiness or completion claim while the physical history stays in place. It does not imply that a calculation performs the work or reverses a completed physical handoff.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="366" r="286" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="91" y="174" width="778" height="144" rx="14" fill="#f2f8f7" stroke="#a4ceca"/>
    <path d="M360 265h43m-11-10 11 10-11 10m186-10h43m-11-10 11 10-11 10" stroke="#177681"/>
    <rect x="91" y="383" width="242" height="137" rx="12" fill="#fff" stroke="#c6b2e1"/>
    <rect x="359" y="383" width="242" height="137" rx="12" fill="#fff" stroke="#c6b2e1"/>
    <rect x="627" y="383" width="242" height="137" rx="12" fill="#fff" stroke="#c6b2e1"/>
    <g stroke="#7850c2" stroke-width="2.5">
      <path d="M192 406h30l12 12v38h-42zm30 0v12h12m-33 11h24m-24 11h17"/>
      <path d="M460 406h30l12 12v38h-42zm30 0v12h12m-33 11h24m-24 11h17"/>
      <path d="M728 406h30l12 12v38h-42zm30 0v12h12m-33 11h24m-24 11h17"/>
    </g>
    <path d="M212 521v39h536v-39" stroke="#b7cbd1"/>
    <rect x="91" y="585" width="778" height="82" rx="12" fill="#f7f4fb" stroke="#c6b2e1"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743" text-anchor="middle">
    <text x="480" y="89" font-size="31" font-weight="600">A plan is not a completed handoff.</text>
    <text x="480" y="215" font-size="21" fill="#48616d">The proposed sequence</text>
    <text x="248" y="274" font-size="27" font-weight="600">Correction</text>
    <text x="480" y="274" font-size="27" font-weight="600">Rehearsal</text>
    <text x="713" y="274" font-size="27" font-weight="600">Handoff</text>
    <text x="480" y="354" font-size="19" fill="#48616d">Actual work needs its own sourced records</text>
    <text x="212" y="493" font-size="24">Corrected output</text>
    <text x="480" y="493" font-size="24">Fresh rehearsal</text>
    <text x="748" y="493" font-size="24">Physical handoff</text>
    <text x="480" y="618" font-size="24" font-weight="600" fill="#7850c2">Later evidence can change what is supported.</text>
    <text x="480" y="648" font-size="18" fill="#48616d">The recorded physical history stays in place.</text>
  </g>
</svg>
