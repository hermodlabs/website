<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="gifting-cover-title gifting-cover-desc">
  <title id="gifting-cover-title">Connect the gift to the recipient’s experience</title>
  <desc id="gifting-cover-desc">A gift box, printed insert and phone are connected along one path. The illustration brings physical production and the recipient’s digital journey into the same operational review.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="608" rx="278" ry="15" fill="#e8e8ee"/>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 362h54m-13-12 13 12-13 12M590 362h54m-13-12 13 12-13 12" fill="none" stroke="#177681"/>
    <!-- Physical production and the digital journey belong to the same experience. -->
    <rect x="146" y="343" width="164" height="161" rx="5" fill="#c6e3e1"/>
    <rect x="134" y="316" width="188" height="47" rx="5" fill="#e4f1ef"/>
    <path d="M227 316v188" fill="none" stroke="#177681" stroke-width="22"/>
    <path d="M227 316c-65 0-79-30-58-43 24-15 58 12 58 43Zm0 0c65 0 79-30 58-43-24-15-58 12-58 43Z" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
    <path d="M394 240h143l42 42v241H394z" fill="#fff"/>
    <path d="M537 240v42h42" fill="#e5eef1"/>
    <path d="M419 307h133m-133 25h90" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <!-- A code-like motif represents the printed insert, rather than a scannable code. -->
    <g fill="none" stroke="#7850c2" stroke-width="8">
      <rect x="421" y="367" width="34" height="34" rx="2"/>
      <rect x="495" y="367" width="34" height="34" rx="2"/>
      <rect x="421" y="441" width="34" height="34" rx="2"/>
      <path d="M480 370v29m-2 19h33m-33 0v30m0 24h28v-25h26m-69-31h-22"/>
    </g>
    <rect x="655" y="259" width="147" height="270" rx="20" fill="#fff"/>
    <path d="M704 277h49" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <rect x="674" y="310" width="109" height="158" rx="5" fill="#f7f4fb" stroke="#ddd0ee" stroke-width="3"/>
    <path d="M695 335h66m-66 21h45m-45 32h66m-66 20h66m-66 20h35" fill="none" stroke="#b7a0d5" stroke-width="4"/>
    <circle cx="729" cy="497" r="8" fill="#e5eef1" stroke="#9caeb8" stroke-width="3"/>
    <path d="M480 544v35H229v-52m251 52h249v-28" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-dasharray="7 10"/>
  </g>
  <path d="M180 617h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
</svg>
