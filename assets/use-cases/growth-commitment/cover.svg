<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Which growth can the business carry?</title>
  <desc id="cover-desc">Twelve thousand dollars of available growth cash and one hundred forty delivery hours bound three illustrated expansion arrangements: a small invoiced campaign, a medium prepaid campaign and a large invoiced campaign. The workflow also includes keeping the current approach. These editorial cards are not an assessment or a ranking.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
<circle cx="480" cy="360" r="286" fill="#fff"/>
  <text x="480" y="88" font-family="Helvetica,Arial,sans-serif" font-size="35" font-weight="600" fill="#193743" text-anchor="middle">Which growth can we carry?</text>
  <text x="480" y="132" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">One budget. One delivery allocation.</text>
  <rect x="117" y="188" width="344" height="108" rx="14" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <rect x="499" y="188" width="344" height="108" rx="14" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <text x="289" y="231" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#193743" text-anchor="middle">$12,000</text>
  <text x="289" y="270" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">Available growth cash</text>
  <text x="671" y="231" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#193743" text-anchor="middle">140 hours</text>
  <text x="671" y="270" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">Delivery capacity</text>
  <path d="M289 296v41h382v-41" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480 337v36" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="90" y="387" width="230" height="155" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="205" y="435" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="middle">Small campaign</text>
  <text x="205" y="479" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#48616d" text-anchor="middle">Invoice customers</text>
  <path d="M130 510h150" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="365" y="387" width="230" height="155" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="480" y="435" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="middle">Medium campaign</text>
  <text x="480" y="479" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#48616d" text-anchor="middle">Collect prepayment</text>
  <path d="M405 510h150" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="640" y="387" width="230" height="155" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="755" y="435" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="middle">Large campaign</text>
  <text x="755" y="479" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#48616d" text-anchor="middle">Invoice customers</text>
  <path d="M680 510h150" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="611" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="600" fill="#193743" text-anchor="middle">Funding + capacity + timing</text>
  <text x="480" y="651" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#48616d" text-anchor="middle">Compare complete arrangements before choosing.</text>
</svg>
