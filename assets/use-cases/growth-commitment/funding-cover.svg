<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="funding-cover-title funding-cover-desc">
  <title id="funding-cover-title">Profitable customer economics do not establish operating feasibility</title>
  <desc id="funding-cover-desc">The large invoiced campaign spends before collecting customer receipts. Its modeled funding requirement is twenty-eight thousand dollars against twelve thousand available. A proportional capacity bar shows two hundred delivery hours needed against one hundred forty available. The illustration summarizes two distinct operating constraints, not a cash forecast.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
<circle cx="480" cy="360" r="286" fill="#fff"/>
  <text x="480" y="89" font-family="Helvetica,Arial,sans-serif" font-size="35" font-weight="600" fill="#193743" text-anchor="middle">Profitable later. Fundable now?</text>
  <text x="480" y="132" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">A receipt can arrive after the cash is needed.</text>
  <rect x="101" y="186" width="758" height="250" rx="14" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <text x="130" y="228" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#193743" text-anchor="start">Large invoiced campaign</text>
  <path d="M156 311h650" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M177 282v57" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M760 282v57" fill="none" stroke="#7850c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="311" r="8" fill="#7850c2" stroke="#7850c2" stroke-width="3"/>
  <circle cx="760" cy="311" r="8" fill="#fff" stroke="#7850c2" stroke-width="3"/>
  <text x="177" y="276" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="middle">Spend first</text>
  <text x="760" y="276" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="middle">Collect later</text>
  <text x="480" y="373" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#193743" text-anchor="middle">$28,000 funding need</text>
  <text x="480" y="410" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">$12,000 available</text>
  <text x="117" y="488" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="start">Delivery hours</text>
  <rect x="117" y="510" width="726" height="57" rx="5" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="3"/>
  <rect x="117" y="510" width="508.2" height="57" rx="5" fill="#e4e9ec"/>
  <path d="M625.2 501v75" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="137" y="548" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="start">140 available</text>
  <text x="819" y="548" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="end">200 needed</text>
  <text x="480" y="637" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#193743" text-anchor="middle">Both limits matter before commitment.</text>
</svg>
