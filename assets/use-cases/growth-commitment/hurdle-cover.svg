<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="hurdle-cover-title hurdle-cover-desc">
  <title id="hurdle-cover-title">A fixed campaign expense needs additional customers</title>
  <desc id="hurdle-cover-desc">Four additional customer symbols each represent one thousand dollars of contribution before campaign expense. Together they cover the fixed four-thousand-dollar campaign. A fifth adds one thousand dollars after that expense. This conditional hurdle does not establish actual demand or count customers who would have bought anyway.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
<circle cx="480" cy="360" r="286" fill="#fff"/>
  <text x="480" y="90" font-family="Helvetica,Arial,sans-serif" font-size="35" font-weight="600" fill="#193743" text-anchor="middle">The campaign fits. Will it pay?</text>
  <text x="480" y="134" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#48616d" text-anchor="middle">$4,000 committed · $1,000 contribution per additional customer</text>
  <rect x="84" y="207" width="792" height="257" rx="14" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <text x="480" y="253" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#193743" text-anchor="middle">Four additional customers cover the expense.</text>
  <circle cx="177" cy="315" r="21" fill="#f7f4fb" stroke="#7850c2" stroke-width="3"/>
  <path d="M147 369v-9a30 30 0 0 1 60 0v9" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="177" y="419" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#193743" text-anchor="middle">$1,000</text>
  <circle cx="379" cy="315" r="21" fill="#f7f4fb" stroke="#7850c2" stroke-width="3"/>
  <path d="M349 369v-9a30 30 0 0 1 60 0v9" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="379" y="419" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#193743" text-anchor="middle">$1,000</text>
  <circle cx="581" cy="315" r="21" fill="#f7f4fb" stroke="#7850c2" stroke-width="3"/>
  <path d="M551 369v-9a30 30 0 0 1 60 0v9" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="581" y="419" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#193743" text-anchor="middle">$1,000</text>
  <circle cx="783" cy="315" r="21" fill="#f7f4fb" stroke="#7850c2" stroke-width="3"/>
  <path d="M753 369v-9a30 30 0 0 1 60 0v9" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="783" y="419" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#193743" text-anchor="middle">$1,000</text>
  <path d="M190 465v38h290v26" fill="none" stroke="#b7cbd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="249" y="540" width="462" height="90" rx="14" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <circle cx="293" cy="571" r="12" fill="#fff" stroke="#7850c2" stroke-width="3"/>
  <path d="M275 604v-5a18 18 0 0 1 36 0v5" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="578" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#193743" text-anchor="start">The fifth adds</text>
  <text x="340" y="612" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#7850c2" text-anchor="start">$1,000 beyond cost.</text>
  <text x="480" y="676" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#48616d" text-anchor="middle">Conditional arithmetic, not a demand forecast.</text>
</svg>
