<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="learning-cover-title learning-cover-desc">
  <title id="learning-cover-title">Learn only when the information can change a usable response</title>
  <desc id="learning-cover-desc">A current choice is compared with a paid imperfect test and a conditional response policy. In the worked policy, a favorable signal leads to the medium prepaid arrangement, while unfavorable and inconclusive signals lead to the small invoiced arrangement. These are modeled branches rather than observed test results; timing and costs must also be assessed.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
<circle cx="480" cy="360" r="286" fill="#fff"/>
  <text x="480" y="86" font-family="Helvetica,Arial,sans-serif" font-size="35" font-weight="600" fill="#193743" text-anchor="middle">Is it worth learning first?</text>
  <text x="480" y="129" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#48616d" text-anchor="middle">Compare choosing now with testing and responding.</text>
  <rect x="79" y="187" width="280" height="119" rx="14" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <text x="219" y="232" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#193743" text-anchor="middle">Choose now</text>
  <text x="219" y="274" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#48616d" text-anchor="middle">Use current information</text>
  <rect x="79" y="387" width="280" height="164" rx="14" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="219" y="434" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#193743" text-anchor="middle">Test first</text>
  <text x="219" y="474" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#48616d" text-anchor="middle">Pay a fee.</text>
  <text x="219" y="511" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#48616d" text-anchor="middle">Wait for an imperfect signal.</text>
  <path d="M359 468h53V240h66" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M412 468V390h66" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M412 468v72h66" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="492" y="184" width="389" height="113" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="514" y="224" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#7850c2" text-anchor="start">Favorable</text>
  <text x="514" y="266" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#193743" text-anchor="start">Medium · prepaid</text>
  <rect x="492" y="334" width="389" height="113" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="514" y="374" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#7850c2" text-anchor="start">Unfavorable</text>
  <text x="514" y="416" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#193743" text-anchor="start">Small · invoiced</text>
  <rect x="492" y="484" width="389" height="113" rx="14" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
  <text x="514" y="524" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#7850c2" text-anchor="start">Inconclusive</text>
  <text x="514" y="566" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#193743" text-anchor="start">Small · invoiced</text>
  <text x="480" y="656" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#193743" text-anchor="middle">Learning matters when a usable response can change.</text>
</svg>
