<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="signal-responses-mobile-title signal-responses-mobile-desc">
  <title id="signal-responses-mobile-title">An explicit response for every test signal</title>
  <desc id="signal-responses-mobile-desc">Conditional policy in the fictional worked example: favorable signal selects the medium prepaid arrangement; unfavorable signal selects the small invoiced arrangement; inconclusive signal also selects the small invoiced arrangement. These are modeled decisions following possible signals, not observed test outcomes or guaranteed recommendations.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="400" height="300" fill="#f6f5f8"/>
<text x="20" y="35" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="start">Modeled response policy</text>
  <rect x="16" y="58" width="143" height="58" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="194" y="58" width="190" height="58" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="87.5" y="94" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Favorable</text>
  <path d="M166 87h19" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="289" y="94" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Medium · prepaid</text>
  <rect x="16" y="137" width="143" height="58" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="194" y="137" width="190" height="58" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="87.5" y="173" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Unfavorable</text>
  <path d="M166 166h19" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="289" y="173" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Small · invoiced</text>
  <rect x="16" y="216" width="143" height="58" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="194" y="216" width="190" height="58" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="87.5" y="252" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Inconclusive</text>
  <path d="M166 245h19" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="289" y="252" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#193743" text-anchor="middle">Small · invoiced</text>
</svg>
