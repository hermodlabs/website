<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="signal-responses-title signal-responses-desc">
  <title id="signal-responses-title">An explicit response for every test signal</title>
  <desc id="signal-responses-desc">Conditional policy in the fictional worked example: favorable signal selects the medium prepaid arrangement; unfavorable signal selects the small invoiced arrangement; inconclusive signal also selects the small invoiced arrangement. These are modeled decisions following possible signals, not observed test outcomes or guaranteed recommendations.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7850c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="720" height="230" fill="#f6f5f8"/>
<text x="20" y="35" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="start">Modeled response policy</text>
  <rect x="20" y="55" width="245" height="45" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="366" y="55" width="334" height="45" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="142.5" y="85" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#193743" text-anchor="middle">Favorable</text>
  <path d="M282 77.5h65" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="533" y="85" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="middle">Medium · prepaid</text>
  <rect x="20" y="111" width="245" height="45" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="366" y="111" width="334" height="45" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="142.5" y="141" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#193743" text-anchor="middle">Unfavorable</text>
  <path d="M282 133.5h65" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="533" y="141" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="middle">Small · invoiced</text>
  <rect x="20" y="167" width="245" height="45" rx="8" fill="#fff" stroke="#b7cbd1" stroke-width="3"/>
  <rect x="366" y="167" width="334" height="45" rx="8" fill="#eee7f6" stroke="#c6b2e1" stroke-width="3"/>
  <text x="142.5" y="197" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#193743" text-anchor="middle">Inconclusive</text>
  <path d="M282 189.5h65" fill="none" stroke="#7850c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="533" y="197" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#193743" text-anchor="middle">Small · invoiced</text>
</svg>
