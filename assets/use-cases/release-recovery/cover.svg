    <rect x="531" y="396" width="48" height="47" rx="5" fill="#fff" stroke="#193743"/>
    <path d="M531 409h48m-37-19v13m25-13v13m-21 23h17m-6-6 6 6-6 6" stroke="#7850c2"/>
    <path d="M276 543v35h408v-35m-204 35v22" stroke="#b7cbd1"/>
    <rect x="174" y="601" width="612" height="66" rx="12" fill="#eee7f6" stroke="#c6b2e1"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="480" y="81" text-anchor="middle" font-size="32" font-weight="600">Same release. Four complete responses.</text>
    <text x="480" y="121" text-anchor="middle" font-size="22" fill="#48616d">Full scope · original deadline · recorded requirements</text>
    <text x="193" y="220" font-size="26" font-weight="600">Existing QA</text>
    <text x="123" y="275" font-size="25">Keep the original scope</text>
    <text x="123" y="309" font-size="21" fill="#48616d">Keep the original date</text>
    <text x="601" y="220" font-size="26" font-weight="600">Core only</text>
    <text x="531" y="275" font-size="25">Defer reporting</text>
    <text x="531" y="309" font-size="21" fill="#7850c2">Requires a scope agreement</text>
    <text x="219" y="428" font-size="26" font-weight="600">Qualified help</text>
    <text x="123" y="483" font-size="25">Transfer fixed QA work</text>
    <text x="123" y="517" font-size="21" fill="#7850c2">Keep scope and date</text>
    <text x="601" y="428" font-size="26" font-weight="600">Later date</text>
    <text x="531" y="483" font-size="25">Keep the full scope</text>
    <text x="531" y="517" font-size="21" fill="#48616d">Requires an exact-date agreement</text>
    <text x="480" y="644" text-anchor="middle" font-size="26" font-weight="600" fill="#7850c2">Keep the original promise in view.</text>
  </g>
