<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="release-cover-title release-cover-desc">
  <title id="release-cover-title">Same release. Four complete responses.</title>
  <desc id="release-cover-desc">Four authored release arrangements share one original promise: full scope with existing QA, core only with reporting deferred, full scope with qualified help, or full scope on a later date. A smaller scope or later date requires a separately accepted revision. These are candidate arrangements, not a ranking or an app screenshot.</desc>
