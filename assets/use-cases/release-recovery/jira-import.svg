<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="release-jira-title release-jira-desc">
  <title id="release-jira-title">Jira supplies workload. The operating basis is separate.</title>
  <desc id="release-jira-desc">The supplied CSV adapter maps remaining QA estimates into core and reporting workloads. Availability, qualification, bookings, spending and permission come from separate operating records. Both inputs are needed for the arrangement comparison. A Jira snapshot alone cannot establish release readiness.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="286" fill="#fff"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="78" y="169" width="365" height="280" rx="14" fill="#fff" stroke="#b7cbd1"/>
    <path d="M108 215h305m-305 29h305m-305 30h305m-305 30h305m-221-89v89m110-89v89" stroke="#c6b2e1" stroke-width="2"/>
    <rect x="517" y="169" width="365" height="280" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <path d="M548 207h31v41h-31zm7 11h17m-17 11h17m-17 10h11" stroke="#7850c2" stroke-width="2.5"/>
    <path d="M260 450v47h439v-47m-219 47v43m-11-13 11 13 11-13" stroke="#b7cbd1"/>
    <rect x="171" y="540" width="618" height="104" rx="13" fill="#eee7f6" stroke="#c6b2e1"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="480" y="85" text-anchor="middle" font-size="31" font-weight="600">Start with the source. Complete the basis.</text>
    <text x="480" y="128" text-anchor="middle" font-size="22" fill="#48616d">Importing a workload is one part of reviewing a release.</text>
    <text x="260" y="354" text-anchor="middle" font-size="28" font-weight="600">Jira CSV snapshot</text>
    <text x="108" y="400" font-size="22" fill="#48616d">Core + reporting QA estimates</text>
    <text x="604" y="238" font-size="26" font-weight="600">Operating records</text>
    <text x="548" y="295" font-size="23">Availability and qualification</text>
    <text x="548" y="334" font-size="23">Bookings and spending</text>
    <text x="548" y="373" font-size="23">Prerequisites and permission</text>
    <text x="480" y="582" text-anchor="middle" font-size="27" font-weight="600">Compare the four arrangements</text>
    <text x="480" y="620" text-anchor="middle" font-size="22" fill="#7850c2">Unknown work stays unknown.</text>
    <text x="480" y="687" text-anchor="middle" font-size="20" fill="#48616d">The adapter uses a declared mapping. It does not synchronize Jira.</text>
  </g>
</svg>
