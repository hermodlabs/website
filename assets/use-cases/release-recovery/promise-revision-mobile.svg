<svg xmlns="http://www.w3.org/2000/svg" width="400" height="288" viewBox="0 0 400 288" role="img" aria-labelledby="promise-revision-mobile-title promise-revision-mobile-desc">
  <title id="promise-revision-mobile-title">Deferring reporting proposes a different promise.</title>
  <desc id="promise-revision-mobile-desc">The original promise includes core functionality and reporting by Monday at 5 p.m. The proposed revision keeps core functionality due Monday at 5 p.m. but defers reporting. No later reporting deadline is specified. Customer agreement to this specific revision is required; the diagram does not record agreement.</desc>
  <rect width="400" height="288" fill="#fff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="20" y="30" font-size="21" font-weight="600">Original · Monday, 5 p.m.</text>
    <rect x="20" y="47" width="174" height="63" rx="5" fill="#eeecf1" stroke="#c9c4d0"/>
    <rect x="206" y="47" width="174" height="63" rx="5" fill="#eeecf1" stroke="#c9c4d0"/>
    <text x="107" y="85" text-anchor="middle" font-size="19">Core functionality</text>
    <text x="293" y="85" text-anchor="middle" font-size="19">Reporting</text>
    <text x="20" y="142" font-size="21" font-weight="600">Proposed revision</text>
    <text x="20" y="167" font-size="18" fill="#604095">Requires customer agreement</text>
    <rect x="20" y="181" width="174" height="82" rx="5" fill="#f0eaf8" stroke="#a68acb"/>
    <rect x="206" y="181" width="174" height="82" rx="5" fill="#fff" stroke="#a68acb" stroke-dasharray="5 4"/>
    <text x="107" y="215" text-anchor="middle" font-size="20" fill="#604095">Core functionality</text>
    <text x="107" y="243" text-anchor="middle" font-size="18" fill="#604095">Monday, 5 p.m.</text>
    <text x="293" y="215" text-anchor="middle" font-size="20" fill="#604095">Reporting</text>
    <text x="293" y="243" text-anchor="middle" font-size="18" fill="#604095">Deferred</text>
  </g>
</svg>
