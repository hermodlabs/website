<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="promise-revision-title promise-revision-desc">
  <title id="promise-revision-title">Deferring reporting proposes a different promise.</title>
  <desc id="promise-revision-desc">The original promise includes core functionality and reporting by Monday at 5 p.m. The proposed revision keeps core functionality due Monday at 5 p.m. but defers reporting. No later reporting deadline is specified. Customer agreement to this specific revision is required; the diagram does not record agreement.</desc>
  <rect width="720" height="220" fill="#fff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="24" y="30" font-size="21" font-weight="600">Original promise · Monday, 5 p.m.</text>
    <rect x="24" y="46" width="328" height="50" rx="5" fill="#eeecf1" stroke="#c9c4d0"/>
    <rect x="368" y="46" width="328" height="50" rx="5" fill="#eeecf1" stroke="#c9c4d0"/>
    <text x="188" y="78" text-anchor="middle" font-size="21">Core functionality</text>
    <text x="532" y="78" text-anchor="middle" font-size="21">Reporting</text>
    <text x="24" y="137" font-size="21" font-weight="600">Proposed revision · requires customer agreement</text>
    <rect x="24" y="153" width="328" height="50" rx="5" fill="#f0eaf8" stroke="#a68acb"/>
    <rect x="368" y="153" width="328" height="50" rx="5" fill="#fff" stroke="#a68acb" stroke-dasharray="5 4"/>
    <text x="188" y="185" text-anchor="middle" font-size="21" fill="#604095">Core · Monday, 5 p.m.</text>
    <text x="532" y="185" text-anchor="middle" font-size="21" fill="#604095">Reporting · deferred</text>
  </g>
</svg>
