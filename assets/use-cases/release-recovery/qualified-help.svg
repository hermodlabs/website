<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="release-help-title release-help-desc">
  <title id="release-help-title">Extra capacity helps when the work can transfer.</title>
  <desc id="release-help-desc">The release needs 12 hours of core QA and eight of reporting QA. A fixed four-hour independent-regression package can transfer to the additional resource only when build and environment qualification, the operating window and the expense requirements hold. The other 16 hours remain with the existing qualified allocation. This is a work-allocation illustration, not a schedule or probability estimate.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="286" fill="#fff"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="126" y="170" width="708" height="96" rx="13" fill="#fff" stroke="#b7cbd1"/>
    <path d="M480 267v36H278v39m202-39h202v39" stroke="#b7cbd1"/>
    <rect x="85" y="344" width="386" height="199" rx="14" fill="#fff" stroke="#b7cbd1"/>
    <rect x="511" y="344" width="364" height="199" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <rect x="114" y="374" width="44" height="41" rx="5" fill="#fff" stroke="#193743"/>
    <path d="M125 386h21m-21 14h14" stroke="#7850c2"/>
    <circle cx="550" cy="384" r="12" fill="#fff" stroke="#7850c2"/>
    <path d="M531 418v-9a19 19 0 0 1 38 0v9m14-33h17m-8-8v17" stroke="#7850c2"/>
    <path d="M692 544v28H480v23" stroke="#b7cbd1"/>
    <rect x="127" y="594" width="706" height="68" rx="12" fill="#eee7f6" stroke="#c6b2e1"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743">
    <text x="480" y="87" text-anchor="middle" font-size="31" font-weight="600">Can this work actually transfer?</text>
    <text x="480" y="130" text-anchor="middle" font-size="22" fill="#48616d">Additional help is a qualified activity, not a generic capacity number.</text>
    <text x="480" y="212" text-anchor="middle" font-size="27" font-weight="600">12h core QA + 8h reporting QA</text>
    <text x="480" y="246" text-anchor="middle" font-size="21" fill="#48616d">20 hours of declared remaining QA effort</text>
    <text x="181" y="404" font-size="26" font-weight="600">Existing allocation</text>
    <text x="114" y="464" font-size="31" font-weight="600">16 hours remain</text>
    <text x="114" y="509" font-size="21" fill="#48616d">8h core work + 8h reporting</text>
    <text x="622" y="404" font-size="26" font-weight="600">Qualified help</text>
    <text x="540" y="464" font-size="31" font-weight="600">4 hours transfer</text>
    <text x="540" y="509" font-size="21" fill="#7850c2">Independent regression · $400</text>
    <text x="480" y="638" text-anchor="middle" font-size="24" font-weight="600" fill="#7850c2">Right build. Right environment. Right window.</text>
  </g>
</svg>
