<svg xmlns="http://www.w3.org/2000/svg" width="400" height="452" viewBox="0 0 400 452" role="img" aria-labelledby="regression-timing-mobile-title regression-timing-mobile-desc">
  <title id="regression-timing-mobile-title">Qualified regression work overlaps the existing team's work.</title>
  <desc id="regression-timing-mobile-desc">Planned baseline schedule for the additional-help arrangement. The existing qualified team allocation performs primary core QA from midnight to 7 a.m., then integration and reporting from 7 a.m. to 4 p.m. Additional qualified help performs independent regression from 7 to 11 a.m., overlapping integration and reporting. The release owner's separate one-hour handoff runs from 4 to 5 p.m., ending exactly at Monday's 5 p.m. deadline with no modeled slack. All three lanes share the same elapsed-time scale. The team allocation may span shifts; it is not one person's sixteen-hour shift. These are planned activities, not records of completed work.</desc>
  <rect width="400" height="452" fill="#fff"/>
  <g stroke="#e1dde6" stroke-width="1">
    <path d="M24 47v352M168.9 47v352M251.8 47v352M355.3 47v352"/>
  </g>
  <path d="M376 47v352" stroke="#7850c2" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="24" y="30" font-size="20" font-weight="600">Existing qualified team allocation</text>
    <rect x="24" y="51" width="144.9" height="82" rx="4" fill="#eeecf1" stroke="#b9b3c2"/>
    <rect x="168.9" y="51" width="186.4" height="82" rx="4" fill="#e1dde8" stroke="#b9b3c2"/>
    <text x="96.5" y="78" text-anchor="middle" font-size="18" font-weight="600">Primary core</text>
    <text x="96.5" y="101" text-anchor="middle" font-size="18" font-weight="600">QA</text>
    <text x="96.5" y="123" text-anchor="middle" font-size="15">midnight–7 a.m.</text>
    <text x="262.1" y="78" text-anchor="middle" font-size="18" font-weight="600">Integration +</text>
    <text x="262.1" y="101" text-anchor="middle" font-size="18" font-weight="600">reporting</text>
    <text x="262.1" y="123" text-anchor="middle" font-size="16">7 a.m.–4 p.m.</text>
    <rect x="20" y="157" width="344" height="28" fill="#fff"/>
    <text x="24" y="178" font-size="20" font-weight="600">Additional qualified help</text>
    <rect x="168.9" y="197" width="82.9" height="57" rx="4" fill="#f0eaf8" stroke="#a68acb"/>
    <text x="210.4" y="233" text-anchor="middle" font-size="25" font-weight="600" fill="#604095">4h</text>
    <rect x="20" y="267" width="344" height="26" fill="#fff"/>
    <text x="24" y="286" font-size="18" fill="#604095">Independent regression · 7–11 a.m.</text>
    <rect x="20" y="315" width="344" height="29" fill="#fff"/>
    <text x="24" y="337" font-size="20" font-weight="600">Release owner · handoff</text>
    <rect x="355.3" y="355" width="20.7" height="39" rx="3" fill="#7850c2"/>
    <rect x="20" y="355" width="220" height="39" fill="#fff"/>
    <text x="24" y="382" font-size="19">4–5 p.m. · 1h</text>
    <text x="376" y="437" text-anchor="end" font-size="20" font-weight="600" fill="#604095">Monday, 5 p.m. deadline</text>
  </g>
</svg>
