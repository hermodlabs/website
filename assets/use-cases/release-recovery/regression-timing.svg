<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="regression-timing-title regression-timing-desc">
  <title id="regression-timing-title">Qualified regression work overlaps the existing team's work.</title>
  <desc id="regression-timing-desc">Planned baseline schedule for the additional-help arrangement. The existing qualified team allocation performs primary core QA from midnight to 7 a.m., then integration and reporting from 7 a.m. to 4 p.m. Additional qualified help performs independent regression from 7 to 11 a.m., overlapping integration and reporting. The release owner's separate one-hour handoff runs from 4 to 5 p.m., ending exactly at Monday's 5 p.m. deadline with no modeled slack. The team allocation may span shifts; it is not one person's sixteen-hour shift. These are planned activities, not records of completed work.</desc>
  <rect width="720" height="320" fill="#fff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="24" y="29" font-size="20" font-weight="600">Planned schedule</text>
    <text x="696" y="29" text-anchor="end" font-size="19" font-weight="600" fill="#604095">Monday, 5 p.m. deadline</text>
  </g>
  <g stroke="#e1dde6" stroke-width="1">
    <path d="M220 54v217M409.4 54v217M517.6 54v217M652.9 54v217"/>
  </g>
  <path d="M680 49v223" stroke="#7850c2" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="24" y="92" font-size="19" font-weight="600">Existing qualified</text>
    <text x="24" y="118" font-size="19">team allocation</text>
    <rect x="220" y="65" width="189.4" height="65" rx="4" fill="#eeecf1" stroke="#b9b3c2"/>
    <rect x="409.4" y="65" width="243.5" height="65" rx="4" fill="#e1dde8" stroke="#b9b3c2"/>
    <text x="314.7" y="93" text-anchor="middle" font-size="18" font-weight="600">Primary core QA</text>
    <text x="314.7" y="118" text-anchor="middle" font-size="17">midnight–7 a.m.</text>
    <text x="531.2" y="93" text-anchor="middle" font-size="18" font-weight="600">Integration + reporting</text>
    <text x="531.2" y="118" text-anchor="middle" font-size="17">7 a.m.–4 p.m.</text>
    <text x="24" y="176" font-size="19" font-weight="600">Additional qualified</text>
    <text x="24" y="202" font-size="19">help</text>
    <rect x="409.4" y="149" width="108.2" height="65" rx="4" fill="#f0eaf8" stroke="#a68acb"/>
    <text x="463.5" y="177" text-anchor="middle" font-size="18" font-weight="600" fill="#604095">Regression</text>
    <text x="463.5" y="202" text-anchor="middle" font-size="16" fill="#604095">7–11 a.m.</text>
    <text x="24" y="248" font-size="19" font-weight="600">Release owner</text>
    <text x="24" y="273" font-size="18">Handoff · 4–5 p.m.</text>
    <rect x="652.9" y="235" width="27.1" height="35" rx="3" fill="#7850c2"/>
    <text x="637" y="259" text-anchor="end" font-size="18" fill="#604095">1h</text>
    <g font-size="16" fill="#625e68">
      <text x="220" y="295" text-anchor="middle">0h</text>
      <text x="409.4" y="295" text-anchor="middle">7h</text>
      <text x="517.6" y="295" text-anchor="middle">11h</text>
      <text x="652.9" y="295" text-anchor="end">16h</text>
      <text x="680" y="315" text-anchor="end">17h</text>
    </g>
  </g>
</svg>
