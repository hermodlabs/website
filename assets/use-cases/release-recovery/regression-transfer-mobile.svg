<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" role="img" aria-labelledby="regression-transfer-mobile-title regression-transfer-mobile-desc">
  <title id="regression-transfer-mobile-title">Transfer only the four-hour independent-regression activity.</title>
  <desc id="regression-transfer-mobile-desc">In the proposed allocation, the existing qualified allocation retains eight hours of other core QA and eight hours of reporting QA, sixteen hours in total. Additional qualified help takes the fixed four-hour independent-regression activity for 400 dollars. All twenty hours of QA remain in the plan. The bars share an effort scale; this is a proposed allocation, not a completed assignment or a complete schedule.</desc>
  <rect width="400" height="290" fill="#fff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#29272d">
    <text x="20" y="31" font-size="24" font-weight="600">Proposed allocation</text>
    <text x="20" y="73" font-size="22" font-weight="600">Existing qualified allocation</text>
    <text x="380" y="73" font-size="22" font-weight="600" text-anchor="end">16h</text>
    <rect x="20" y="87" width="144" height="64" fill="#efedf2" stroke="#b9b4c1"/>
    <rect x="164" y="87" width="144" height="64" fill="#e4e1e9" stroke="#b9b4c1"/>
    <text x="92" y="112" font-size="22" font-weight="600" text-anchor="middle">8h</text>
    <text x="92" y="139" font-size="20" text-anchor="middle">Other core QA</text>
    <text x="236" y="112" font-size="22" font-weight="600" text-anchor="middle">8h</text>
    <text x="236" y="139" font-size="20" text-anchor="middle">Reporting QA</text>
    <text x="20" y="198" font-size="22" font-weight="600">Additional qualified help</text>
    <text x="380" y="198" font-size="22" font-weight="600" text-anchor="end">$400</text>
    <rect x="20" y="212" width="72" height="44" fill="#7850c2"/>
    <text x="56" y="242" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">4h</text>
    <text x="108" y="233" font-size="22">Fixed independent</text>
    <text x="108" y="260" font-size="22">regression</text>
  </g>
</svg>
