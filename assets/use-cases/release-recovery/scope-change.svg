<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="release-scope-title release-scope-desc">
  <title id="release-scope-title">A smaller release changes the promise.</title>
  <desc id="release-scope-desc">The original promise includes both core functionality and reporting. The reduced arrangement includes core functionality now and defers reporting. Feasibility of that smaller arrangement and recorded agreement to the scope revision are separate requirements; the original promise remains visible.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="360" r="286" fill="#fff"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="192" width="350" height="244" rx="14" fill="#fff" stroke="#b7cbd1"/>
    <rect x="530" y="192" width="350" height="244" rx="14" fill="#f7f4fb" stroke="#c6b2e1"/>
    <path d="M449 313h61m-14-14 14 14-14 14" stroke="#7850c2" stroke-width="4"/>
    <rect x="108" y="282" width="294" height="51" rx="6" fill="#eee7f6" stroke="#c6b2e1"/>
    <rect x="108" y="352" width="294" height="51" rx="6" fill="#eee7f6" stroke="#c6b2e1"/>
    <rect x="558" y="282" width="294" height="51" rx="6" fill="#eee7f6" stroke="#c6b2e1"/>
    <rect x="558" y="352" width="294" height="51" rx="6" fill="#fff" stroke="#c6b2e1" stroke-dasharray="7 7"/>
    <path d="M705 437v58H480v25" stroke="#b7cbd1"/>
    <rect x="164" y="520" width="632" height="104" rx="13" fill="#fff" stroke="#c6b2e1"/>
    <path d="M196 550h31v41h-31zm7 10h17m-17 10h17m-13 11 4 4 8-10" stroke="#7850c2" stroke-width="2.5"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" fill="#193743" text-anchor="middle">
    <text x="480" y="88" font-size="32" font-weight="600">A smaller release changes the promise.</text>
    <text x="480" y="131" font-size="22" fill="#48616d">Feasibility and agreement answer different questions.</text>
    <text x="255" y="243" font-size="27" font-weight="600">Original scope</text>
    <text x="705" y="243" font-size="27" font-weight="600">Proposed scope</text>
    <text x="255" y="316" font-size="25">Core functionality</text>
    <text x="255" y="386" font-size="25">Reporting</text>
    <text x="705" y="316" font-size="25">Core functionality</text>
    <text x="705" y="386" font-size="25" fill="#7850c2">Reporting deferred</text>
    <text x="513" y="560" font-size="25" font-weight="600">Record agreement to the revision.</text>
    <text x="513" y="598" font-size="21" fill="#48616d">The calculation cannot obtain it for Nina.</text>
    <text x="480" y="672" font-size="21" fill="#48616d">The original scope and deadline remain part of the record.</text>
  </g>
</svg>
