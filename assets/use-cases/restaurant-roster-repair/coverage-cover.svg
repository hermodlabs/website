<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="coverage-cover-title coverage-cover-desc">
  <title id="coverage-cover-title">A replacement must cover the whole service</title>
  <desc id="coverage-cover-desc">Two illustrative service timelines compare a partial replacement, which leaves an interval uncovered, with a complete repair. The coverage gap is marked with an outline and diagonal hatching as well as color.</desc>
  <defs><pattern id="coverage-cover-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v12" stroke="#b7a0d5" stroke-width="4"/></pattern></defs>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="480" y="127" text-anchor="middle" font-size="35" font-weight="700">Who covers the remaining service?</text>
    <rect x="104" y="181" width="752" height="194" rx="18" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
    <text x="139" y="226" font-size="27" font-weight="700">Partial replacement</text>
    <path d="M145 287h670" stroke="#d3dfe5" stroke-width="4" stroke-linecap="round"/>
    <rect x="145" y="266" width="392" height="42" rx="8" fill="#c6e3e1" stroke="#177681" stroke-width="3"/>
    <rect x="548" y="266" width="266" height="42" rx="8" fill="url(#coverage-cover-hatch)" stroke="#7850c2" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="341" y="344" text-anchor="middle" font-size="23">Available</text>
    <text x="681" y="344" text-anchor="middle" font-size="23" fill="#7850c2">Uncovered interval</text>
    <rect x="104" y="406" width="752" height="194" rx="18" fill="#fff" stroke="#a4ceca" stroke-width="3"/>
    <text x="139" y="451" font-size="27" font-weight="700">Complete repair</text>
    <path d="M145 512h670" stroke="#d3dfe5" stroke-width="4" stroke-linecap="round"/>
    <rect x="145" y="491" width="392" height="42" rx="8" fill="#c6e3e1" stroke="#177681" stroke-width="3"/>
    <rect x="548" y="491" width="266" height="42" rx="8" fill="#ddd0ee" stroke="#7850c2" stroke-width="3"/>
    <path d="m667 507 9 10 17-20" fill="none" stroke="#7850c2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="569" text-anchor="middle" font-size="23">Qualified coverage throughout service</text>
    <text x="480" y="656" text-anchor="middle" font-size="25">Check the interval, then the complete roster.</text>
  </g>
</svg>
