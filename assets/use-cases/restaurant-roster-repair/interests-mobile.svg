<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1220" viewBox="0 0 360 1220" role="img" aria-labelledby="roster-interests-mobile-title roster-interests-mobile-desc">
  <title id="roster-interests-mobile-title">One roster. Several requirements.</title>
  <desc id="roster-interests-mobile-desc">Employees provide actual availability and value predictable assignments. Kitchen and service leads need qualified coverage throughout service. Owner or finance sets a binding expense boundary. The planning report compares complete repairs. These requirements and findings inform Elena's proposal; they do not allow her to override employee availability. People confirm and communicate changes outside the calculation.</desc>
  <defs><marker id="roster-interests-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#48616d" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
  <rect width="360" height="1220" rx="14" fill="#f6f5f8"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="18" y="36" font-size="27" font-weight="700"><tspan x="18">One roster.</tspan><tspan x="18" dy="33">Several requirements.</tspan></text>
    <text x="18" y="104" font-size="18" fill="#48616d"><tspan x="18">What informs or constrains</tspan><tspan x="18" dy="25">Elena’s proposal?</tspan></text>
    <g fill="none" stroke="#48616d" stroke-width="2.3" stroke-linejoin="round">
      <path d="M312 228h24v684H180v26" marker-end="url(#roster-interests-mobile-arrow)"/>
      <path d="M312 409h24m-24 181h24m-24 181h24"/>
    </g>
    <g id="roster-mobile-employees">
      <rect x="18" y="157" width="294" height="148" rx="11" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="2"/>
      <text x="35" y="192" font-size="23" font-weight="700">Employees</text>
      <text x="35" y="226" font-size="19"><tspan x="35">Actual availability is a condition.</tspan><tspan x="35" dy="28">Predictable published</tspan><tspan x="35" dy="28">assignments matter too.</tspan></text>
    </g>
    <g id="roster-mobile-service">
      <rect x="18" y="338" width="294" height="148" rx="11" fill="#f2f8f7" stroke="#a4ceca" stroke-width="2"/>
      <text x="35" y="373" font-size="23" font-weight="700"><tspan x="35">Kitchen &amp; service leads</tspan></text>
      <text x="35" y="410" font-size="20"><tspan x="35">Qualified role coverage</tspan><tspan x="35" dy="29">throughout service</tspan></text>
    </g>
    <g id="roster-mobile-finance">
      <rect x="18" y="519" width="294" height="148" rx="11" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="2"/>
      <text x="35" y="554" font-size="23" font-weight="700">Owner / finance</text>
      <text x="35" y="591" font-size="20"><tspan x="35">A binding expense boundary</tspan><tspan x="35" dy="29">is one of the requirements.</tspan></text>
    </g>
    <g id="roster-mobile-report">
      <rect x="18" y="700" width="294" height="148" rx="11" fill="#f2f8f7" stroke="#a4ceca" stroke-width="2"/>
      <text x="35" y="735" font-size="23" font-weight="700">Planning report</text>
      <text x="35" y="772" font-size="20"><tspan x="35">Compares complete repairs</tspan><tspan x="35" dy="29">and explains the findings</tspan><tspan x="35" dy="29">supporting her proposal.</tspan></text>
    </g>
    <g id="roster-mobile-elena">
      <rect x="18" y="940" width="324" height="161" rx="11" fill="#fff" stroke="#7850c2" stroke-width="2.5"/>
      <text x="35" y="978" font-size="25" font-weight="700">Elena · manager</text>
      <text x="35" y="1015" font-size="20"><tspan x="35">Compare complete repairs.</tspan><tspan x="35" dy="29">Select a supported proposal.</tspan></text>
    </g>
    <text x="18" y="1142" font-size="18" fill="#48616d"><tspan x="18">People confirm and communicate</tspan><tspan x="18" dy="25">assignment changes outside</tspan><tspan x="18" dy="25">the calculation.</tspan></text>
  </g>
</svg>
