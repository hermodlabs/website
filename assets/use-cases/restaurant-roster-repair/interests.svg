<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="roster-interests-title roster-interests-desc">
  <title id="roster-interests-title">One roster. Several requirements.</title>
  <desc id="roster-interests-desc">Employees' actual availability and interest in predictable published assignments, kitchen and service leads' qualified coverage requirements, and the owner or finance team's binding expense boundary inform Elena's decision. A planning report compares complete repairs and supports her proposal. Elena remains the manager deciding what to propose; people confirm and communicate assignment changes outside the calculation. Arrows indicate information or requirements that inform or constrain her decision, not automatic approvals or permission to override availability.</desc>
  <defs><marker id="roster-interests-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#48616d" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="720" rx="16" fill="#f6f5f8"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="30" y="48" font-size="34" font-weight="700">One roster. Several requirements.</text>
    <text x="30" y="88" font-size="24" fill="#48616d">Recorded requirements inform Elena’s proposal.</text>
    <g fill="none" stroke="#48616d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#roster-interests-arrow)">
      <path d="M170 308v22h205v30"/>
      <path d="M790 308v22H585v30"/>
      <path d="M290 466h40"/>
      <path d="M670 466h-40"/>
    </g>
    <g id="roster-employees">
      <rect x="30" y="137" width="280" height="171" rx="13" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="2"/>
      <text x="50" y="174" font-size="26" font-weight="700">Employees</text>
      <text x="50" y="210" font-size="22"><tspan x="50">Actual availability</tspan><tspan x="50" dy="29">is a condition.</tspan></text>
      <text x="50" y="273" font-size="21" fill="#7850c2">Predictable assignments</text>
      <text x="50" y="299" font-size="21" fill="#7850c2">matter too.</text>
    </g>
    <g id="roster-finance">
      <rect x="650" y="137" width="280" height="171" rx="13" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="2"/>
      <text x="670" y="174" font-size="26" font-weight="700">Owner / finance</text>
      <text x="670" y="210" font-size="22"><tspan x="670">Sets a binding</tspan><tspan x="670" dy="29">expense boundary.</tspan></text>
      <text x="670" y="281" font-size="21" fill="#7850c2">Expense is one constraint.</text>
    </g>
    <g id="roster-service">
      <rect x="30" y="385" width="260" height="159" rx="13" fill="#f2f8f7" stroke="#a4ceca" stroke-width="2"/>
      <text x="50" y="421" font-size="24" font-weight="700"><tspan x="50">Kitchen &amp;</tspan><tspan x="50" dy="28">service leads</tspan></text>
      <text x="50" y="485" font-size="21"><tspan x="50">Qualified role coverage</tspan><tspan x="50" dy="28">throughout service</tspan></text>
    </g>
    <g id="roster-elena">
      <rect x="330" y="360" width="300" height="184" rx="13" fill="#fff" stroke="#7850c2" stroke-width="3"/>
      <text x="350" y="400" font-size="28" font-weight="700">Elena · manager</text>
      <text x="350" y="437" font-size="22"><tspan x="350">Compare complete repairs.</tspan><tspan x="350" dy="30">Select a supported</tspan><tspan x="350" dy="30">proposal.</tspan></text>
    </g>
    <g id="roster-report">
      <rect x="670" y="385" width="260" height="159" rx="13" fill="#f2f8f7" stroke="#a4ceca" stroke-width="2"/>
      <text x="690" y="422" font-size="24" font-weight="700">Planning report</text>
      <text x="690" y="462" font-size="21"><tspan x="690">Compares complete</tspan><tspan x="690" dy="28">repairs and explains</tspan><tspan x="690" dy="28">supporting findings</tspan></text>
    </g>
    <text x="480" y="593" text-anchor="middle" font-size="23" font-weight="700">Arrows show what informs or constrains the decision.</text>
    <path d="M30 618h900" stroke="#d3dfe5" stroke-width="2"/>
    <text x="480" y="656" text-anchor="middle" font-size="23" fill="#48616d"><tspan x="480">People confirm and communicate assignment changes</tspan><tspan x="480" dy="29">outside the calculation.</tspan></text>
  </g>
</svg>
