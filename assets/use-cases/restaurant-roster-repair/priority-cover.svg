<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="priority-cover-title priority-cover-desc">
  <title id="priority-cover-title">Two workable repairs can favor different priorities</title>
  <desc id="priority-cover-desc">Two roster repair cards both meet recorded requirements. A cost symbol marks lower expense on one card, while a stable roster symbol marks fewer changed assignments on the other. The illustration does not declare either priority universally preferable.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <g stroke="#193743" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="102" y="226" width="340" height="327" rx="18" fill="#fff" stroke="#a4ceca" stroke-width="3"/>
    <rect x="518" y="226" width="340" height="327" rx="18" fill="#fff" stroke="#c6b2e1" stroke-width="3"/>
    <circle cx="272" cy="328" r="54" fill="#f2f8f7" stroke="#177681" stroke-width="3"/>
    <path d="M272 292v72m17-58c-6-12-35-11-35 5s35 14 35 30-29 18-36 6" fill="none" stroke="#177681"/>
    <rect x="635" y="277" width="106" height="102" rx="8" fill="#f7f4fb" stroke="#7850c2" stroke-width="3"/>
    <path d="M635 307h106m-75-30v16m43-16v16m-56 34h18m14 0h18m14 0h8m-72 22h18m14 0h18m14 0h8" fill="none" stroke="#7850c2" stroke-width="3"/>
    <path d="M155 480h234m182 0h234" stroke="#d3dfe5" stroke-width="2"/>
    <path d="m163 516 10 11 19-22m387 11 10 11 19-22" fill="none" stroke="#177681" stroke-width="4"/>
    <path d="M442 390h76" fill="none" stroke="#9caeb8" stroke-width="3" stroke-dasharray="7 8"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743" text-anchor="middle">
    <text x="480" y="139" font-size="35" font-weight="700">Both work. What should come first?</text>
    <text x="272" y="425" font-size="29" font-weight="700">Lower expense</text>
    <text x="272" y="460" font-size="22">More assignment changes</text>
    <text x="688" y="425" font-size="29" font-weight="700">Fewer changes</text>
    <text x="688" y="460" font-size="22">More additional expense</text>
    <text x="291" y="525" font-size="21">Requirements met</text>
    <text x="707" y="525" font-size="21">Requirements met</text>
    <text x="480" y="626" font-size="26">Make the comparison priority explicit.</text>
  </g>
</svg>
