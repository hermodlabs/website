<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1220" viewBox="0 0 360 1220" role="img" aria-labelledby="restaurant-roster-timeline-mobile-title restaurant-roster-timeline-mobile-desc" data-source="source/model.mjs" data-source-sha256="9bcde49d127341add4641b754c23286909ac19fffa9a2b2782ec4985043541e4">
<title id="restaurant-roster-timeline-mobile-title">Follow every affected roster position</title>
<desc id="restaurant-roster-timeline-mobile-desc">Three affected positions in the complete remaining roster. Saturday dinner, Cook 2, 6 p.m.–10 p.m.: published Nora has called out; Bring in Rowan: Rowan; Repair three assignments: Theo. Sunday lunch, Cook 1, noon–4 p.m.: published Theo; Bring in Rowan: Theo; Repair three assignments: Ben. Sunday lunch, Server, noon–4 p.m.: published Ben; Bring in Rowan: Ben; Repair three assignments: Ava. 3 affected positions shown; 6 other recorded positions stay unchanged. Whole-remaining-roster coverage is assessed separately in the retained Decision Lab results; this diagram presents the supplied assignments.</desc>
<rect width="360" height="1220" rx="14" fill="#f6f5f8"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#193743"><text x="18" y="36" font-size="27" font-weight="700">Repair the whole roster.</text><text x="18" y="75" font-size="19" fill="#48616d">Follow every affected position</text><text x="18" y="102" font-size="19" fill="#48616d">across Saturday and Sunday.</text><rect x="18" y="131" width="324" height="267" rx="12" fill="#fff" stroke="#d3dfe5" stroke-width="2"/><text x="34" y="164" font-size="23" font-weight="700">Saturday dinner</text><text x="34" y="193" font-size="19" fill="#48616d">Cook 2 · 6 p.m.–10 p.m.</text><text x="34" y="237" font-size="18" >Published</text><text x="326" y="237" font-size="22" font-weight="700" text-anchor="end">Nora</text><text x="326" y="260" font-size="18" text-anchor="end" fill="#7850c2">Reported callout</text><text x="34" y="294" font-size="18" >Bring in Rowan</text><text x="326" y="294" font-size="22" font-weight="700" text-anchor="end">Rowan</text><text x="326" y="317" font-size="18" text-anchor="end" fill="#7850c2">Changed</text><text x="34" y="351" font-size="18" >Repair three assignments</text><text x="326" y="351" font-size="22" font-weight="700" text-anchor="end">Theo</text><text x="326" y="374" font-size="18" text-anchor="end" fill="#7850c2">Changed</text><rect x="18" y="419" width="324" height="267" rx="12" fill="#fff" stroke="#d3dfe5" stroke-width="2"/><text x="34" y="452" font-size="23" font-weight="700">Sunday lunch</text><text x="34" y="481" font-size="19" fill="#48616d">Cook 1 · noon–4 p.m.</text><text x="34" y="525" font-size="18" >Published</text><text x="326" y="525" font-size="22" font-weight="700" text-anchor="end">Theo</text><text x="326" y="548" font-size="18" text-anchor="end" fill="#48616d">Published assignment</text><text x="34" y="582" font-size="18" >Bring in Rowan</text><text x="326" y="582" font-size="22" font-weight="700" text-anchor="end">Theo</text><text x="326" y="605" font-size="18" text-anchor="end" fill="#48616d">Unchanged</text><text x="34" y="639" font-size="18" >Repair three assignments</text><text x="326" y="639" font-size="22" font-weight="700" text-anchor="end">Ben</text><text x="326" y="662" font-size="18" text-anchor="end" fill="#7850c2">Changed</text><rect x="18" y="707" width="324" height="267" rx="12" fill="#fff" stroke="#d3dfe5" stroke-width="2"/><text x="34" y="740" font-size="23" font-weight="700">Sunday lunch</text><text x="34" y="769" font-size="19" fill="#48616d">Server · noon–4 p.m.</text><text x="34" y="813" font-size="18" >Published</text><text x="326" y="813" font-size="22" font-weight="700" text-anchor="end">Ben</text><text x="326" y="836" font-size="18" text-anchor="end" fill="#48616d">Published assignment</text><text x="34" y="870" font-size="18" >Bring in Rowan</text><text x="326" y="870" font-size="22" font-weight="700" text-anchor="end">Ben</text><text x="326" y="893" font-size="18" text-anchor="end" fill="#48616d">Unchanged</text><text x="34" y="927" font-size="18" >Repair three assignments</text><text x="326" y="927" font-size="22" font-weight="700" text-anchor="end">Ava</text><text x="326" y="950" font-size="18" text-anchor="end" fill="#7850c2">Changed</text><text x="18" y="1032" font-size="20" font-weight="700">Theo moves to Saturday.</text><text x="18" y="1063" font-size="19" >Ben covers Theo’s Sunday cooking;</text><text x="18" y="1091" font-size="19" >Ava covers Ben’s serving position.</text><text x="18" y="1147" font-size="18" fill="#48616d">3 affected positions shown.</text><text x="18" y="1173" font-size="18" fill="#48616d">All 6 other recorded positions</text><text x="18" y="1199" font-size="18" fill="#48616d">stay unchanged.</text></g>
</svg>
