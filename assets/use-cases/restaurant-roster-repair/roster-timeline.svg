<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="restaurant-roster-timeline-title restaurant-roster-timeline-desc" data-source="source/model.mjs" data-source-sha256="9bcde49d127341add4641b754c23286909ac19fffa9a2b2782ec4985043541e4">
<title id="restaurant-roster-timeline-title">A complete repair follows the assignment chain</title>
<desc id="restaurant-roster-timeline-desc">Three affected positions in the complete remaining roster. Saturday dinner, Cook 2, 6 p.m.–10 p.m.: published Nora has called out; Bring in Rowan: Rowan; Repair three assignments: Theo. Sunday lunch, Cook 1, noon–4 p.m.: published Theo; Bring in Rowan: Theo; Repair three assignments: Ben. Sunday lunch, Server, noon–4 p.m.: published Ben; Bring in Rowan: Ben; Repair three assignments: Ava. 3 affected positions shown; 6 other recorded positions stay unchanged. Whole-remaining-roster coverage is assessed separately in the retained Decision Lab results; this diagram presents the supplied assignments.</desc>
<rect width="960" height="760" rx="14" fill="#f6f5f8"/>
