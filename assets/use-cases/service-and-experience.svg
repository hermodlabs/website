<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="service-experience-title service-experience-desc">
  <title id="service-experience-title">Connect the people behind a service experience</title>
  <desc id="service-experience-desc">A restaurant table and staffing board, a venue entrance with a clock, and a recipient holding a gift share one connected operating path. They represent the people, timing and handoffs behind restaurant, venue and gifting services.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="610" rx="306" ry="15" fill="#e8e8ee"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 535v35h495v-35" stroke="#9caeb8" stroke-width="4" stroke-dasharray="8 11"/>
    <path d="M480 530v40" stroke="#9caeb8" stroke-width="4" stroke-dasharray="8 11"/>
  </g>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Restaurant service depends on the people available to deliver it. -->
    <rect x="168" y="230" width="136" height="150" rx="12" fill="#fff"/>
    <rect x="198" y="218" width="76" height="25" rx="7" fill="#ddd0ee" stroke="#7850c2" stroke-width="3"/>
    <circle cx="193" cy="275" r="9" fill="#c6e3e1" stroke="#177681" stroke-width="3"/>
    <circle cx="193" cy="313" r="9" fill="#ddd0ee" stroke="#7850c2" stroke-width="3"/>
    <path d="M215 275h64m-64 38h64m-92 38h62" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <path d="m266 348 6 6 12-14" fill="none" stroke="#177681" stroke-width="4"/>
    <path d="M146 410v54h40m-40 0v65m40-65v65M324 410v54h-40m40 0v65m-40-65v65" fill="none" stroke-width="4"/>
    <ellipse cx="235" cy="432" rx="76" ry="20" fill="#c6e3e1"/>
    <path d="M235 452v77m-35 0h70" fill="none" stroke-width="4"/>
    <ellipse cx="235" cy="428" rx="27" ry="8" fill="#fff" stroke="#177681" stroke-width="3"/>
    <path d="M191 425v11m88-11v11" fill="none" stroke="#177681" stroke-width="3"/>
    <!-- A venue brings together a place, an operating window and its guests. -->
    <path d="M379 285h202v244H379z" fill="#fff"/>
    <path d="M362 285h236l-29-53H391z" fill="#ddd0ee"/>
    <path d="M396 232v53m42-53v53m42-53v53m42-53v53m42-53v53" stroke="#b7a0d5" stroke-width="3"/>
    <rect x="424" y="338" width="112" height="191" rx="4" fill="#e5eef1"/>
    <path d="M480 338v191m-16-112v27m32-27v27" fill="none" stroke="#7850c2" stroke-width="4"/>
    <rect x="412" y="303" width="136" height="17" rx="5" fill="#c6e3e1" stroke="#177681" stroke-width="3"/>
    <path d="M364 529h232v22H364z" fill="#fff" stroke-width="4"/>
    <circle cx="480" cy="168" r="48" fill="#fff" stroke-width="4"/>
    <path d="M480 135v33l22 13" fill="none" stroke="#7850c2" stroke-width="4"/>
    <circle cx="480" cy="168" r="4" fill="#193743" stroke="none"/>
    <!-- A physical handoff contributes to the recipient's experience. -->
    <circle cx="729" cy="276" r="31" fill="#fff"/>
    <path d="M678 384v-27a51 51 0 0 1 102 0v27" fill="#ddd0ee"/>
    <path d="M679 361l-21 32m121-32 21 32" fill="none" stroke-width="4"/>
    <rect x="656" y="406" width="146" height="121" rx="4" fill="#c6e3e1"/>
    <rect x="645" y="380" width="168" height="38" rx="5" fill="#e4f1ef"/>
    <path d="M729 380v147" fill="none" stroke="#177681" stroke-width="16"/>
    <path d="M729 380c-49 0-63-24-46-35 18-12 46 10 46 35Zm0 0c49 0 63-24 46-35-18-12-46 10-46 35Z" fill="#c6e3e1" stroke="#177681" stroke-width="4"/>
    <circle cx="235" cy="570" r="8" fill="#fff" stroke="#177681" stroke-width="4"/>
    <circle cx="480" cy="570" r="8" fill="#fff" stroke="#7850c2" stroke-width="4"/>
    <circle cx="730" cy="570" r="8" fill="#fff" stroke="#177681" stroke-width="4"/>
  </g>
  <path d="M180 627h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
