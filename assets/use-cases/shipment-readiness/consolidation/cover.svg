<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="consolidation-cover-title consolidation-cover-desc">
  <title id="consolidation-cover-title">A third shipment option needs its own requirement</title>
  <desc id="consolidation-cover-desc">Three illustrated freight routes show Direct at $4,000 on Friday, Backup at $6,000 on Thursday at noon, and Consolidated at $5,000 on Thursday at 6 p.m. A separate confirmation record connects to the consolidated route. Adding a quote does not establish that its loading slot is confirmed.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="353" r="292" fill="#fff"/>
  <g fill="none" stroke="#193743" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 205h112m-14-12 14 12-14 12M204 360h112m-14-12 14 12-14 12M204 515h112m-14-12 14 12-14 12" stroke="#b7cbd1"/>
    <path d="M334 205h376m-14-12 14 12-14 12M334 360h376m-14-12 14 12-14 12" stroke="#c6e3e1" stroke-width="7"/>
    <path d="M334 515h376m-14-12 14 12-14 12" stroke="#ddd0ee" stroke-width="7"/>
    <g fill="#c6e3e1">
      <path d="m145 180 36-16 36 16v48l-36 16-36-16z"/>
      <path d="m145 335 36-16 36 16v48l-36 16-36-16z"/>
    </g>
    <path d="m145 490 36-16 36 16v48l-36 16-36-16z" fill="#ddd0ee"/>
    <path d="m145 180 36 16 36-16m-36 16v48m-18-72 36 16v18m-54 129 36 16 36-16m-36 16v48m-18-72 36 16v18m-54 129 36 16 36-16m-36 16v48m-18-72 36 16v18"/>
    <g fill="#fff">
      <circle cx="754" cy="205" r="35"/>
      <circle cx="754" cy="360" r="35"/>
      <circle cx="754" cy="515" r="35"/>
    </g>
    <path d="M754 182v23l14 10M754 337v23l14 10M754 492v23l14 10" stroke="#177681"/>
    <path d="M579 557v29h-79" stroke="#7850c2" stroke-dasharray="7 9"/>
    <rect x="381" y="565" width="121" height="82" rx="8" fill="#f7f4fb" stroke="#7850c2"/>
    <path d="M403 587h76m-76 18h76m-76 18h46" stroke="#b7a0d5" stroke-width="3"/>
  </g>
  <g fill="#193743" font-family="Helvetica,Arial,sans-serif">
    <text x="334" y="160" font-size="27" font-weight="600">Direct</text>
    <text x="334" y="245" font-size="23">$4,000 · Friday noon</text>
    <text x="334" y="315" font-size="27" font-weight="600">Backup</text>
    <text x="334" y="400" font-size="23">$6,000 · Thursday noon</text>
    <text x="334" y="470" font-size="27" font-weight="600" fill="#7850c2">Consolidated</text>
    <text x="334" y="555" font-size="23">$5,000 · Thursday 6 p.m.</text>
    <text x="521" y="620" font-size="21" fill="#7850c2">Slot confirmation required</text>
  </g>
</svg>
