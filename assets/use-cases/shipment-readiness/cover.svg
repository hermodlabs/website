<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="shipment-use-case-cover-title shipment-use-case-cover-desc">
  <title id="shipment-use-case-cover-title">Review the whole shipment plan</title>
  <desc id="shipment-use-case-cover-desc">A shipment carton, delivery clock, and review sheet connect to two complete plans. The illustration highlights timing, records, and comparison without implying that a shipment has been approved.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="608" rx="278" ry="15" fill="#e8e8ee"/>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A timed commitment and supporting records feed the same review. -->
    <path d="M317 279h64m-13-12 13 12-13 12M670 312v47h-55" fill="none" stroke="#177681"/>
    <circle cx="251" cy="279" r="64" fill="#fff"/>
    <path d="M251 232v-8m47 55h8m-55 47v8m-47-55h-8M251 242v37l25 18" fill="none" stroke="#177681" stroke-width="4"/>
    <circle cx="251" cy="279" r="4" fill="#193743" stroke="none"/>
    <path d="M633 188h68l31 31v92h-99z" fill="#fff"/>
    <path d="M701 188v31h31" fill="#e5eef1"/>
    <path d="M653 247h59m-59 23h59m-59 23h35" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <!-- Two alternatives keep their requirements together. -->
    <rect x="382" y="209" width="232" height="288" rx="16" fill="#ddd0ee"/>
    <rect x="361" y="229" width="232" height="288" rx="16" fill="#fff"/>
    <path d="M384 260h127" fill="none" stroke="#7850c2" stroke-width="4"/>
    <rect x="383" y="286" width="188" height="83" rx="9" fill="#f2f7f7" stroke="#c6e3e1" stroke-width="3"/>
    <path d="M401 309h106m-106 20h145m-145 20h84" fill="none" stroke="#177681" stroke-width="4"/>
    <rect x="383" y="387" width="188" height="83" rx="9" fill="#f7f4fb" stroke="#ddd0ee" stroke-width="3"/>
    <path d="M401 410h106m-106 20h145m-145 20h84" fill="none" stroke="#7850c2" stroke-width="4"/>
    <!-- Physical shipment remains a separate operational action. -->
    <path d="M612 432h53v46" fill="none" stroke="#9caeb8" stroke-width="4" stroke-dasharray="7 10"/>
    <path d="m626 484 66-29 66 29v92l-66 29-66-29z" fill="#c6e3e1"/>
    <path d="m626 484 66 29 66-29m-66 29v92m-33-135 66 29v28l-25 11v-29" fill="none" stroke="#193743" stroke-width="4"/>
    <path d="m643 550 21 9m-21 7 21 9" fill="none" stroke="#177681" stroke-width="4"/>
    <path d="M203 519h107m-107 27h145m-145 27h80" fill="none" stroke="#d3dfe5" stroke-width="4"/>
  </g>
  <path d="M180 617h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
</svg>
