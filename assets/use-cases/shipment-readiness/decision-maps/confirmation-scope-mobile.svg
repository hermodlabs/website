<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1390" viewBox="0 0 560 1390" role="img" aria-labelledby="confirmation-scope-mobile-title confirmation-scope-mobile-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="e6fb533e46eeb69182a0cdbcc25845e7f0831f4fba857231909f8c2089e7b2bd" data-view="confirmation-scope" data-variant="mobile">
<title id="confirmation-scope-mobile-title">What a confirmation must cover</title>
<desc id="confirmation-scope-mobile-desc">One current SLOT-C104 record must refer to ORD-104 revision 1, Consolidated and SP-B, cover the full 11 p.m. to midnight loading window, be known by 8 a.m. selection and confirmed by the noon cutoff. The illustrated checks belong to the separate arrival-first authoring exercise; additional scope fields and rules remain in the native model.</desc>
<defs><marker id="confirmation-scope-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#48616d" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1390" rx="16" fill="#f7f6f9"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="28" y="52" font-size="34" font-weight="700" fill="#193743" text-anchor="start"><tspan x="28" dy="0">One scoped confirmation</tspan></text><text x="28" y="94" font-size="28" font-weight="400" fill="#48616d" text-anchor="start"><tspan x="28" dy="0">Arrival-first authoring exercise</tspan></text><rect x="28" y="132" width="464" height="114" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="slot-record" data-type="record" data-status="evaluated-binding"><text x="50" y="172" font-size="28" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">SLOT-C104</tspan><tspan x="50" dy="34">Current status: confirmed</tspan></text></g><g data-edge="record-scope" data-from="slot-record" data-to="slot-shipment" data-relation="applies-to" data-status="declared-context"><path d="M28 213H12V366H28" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><rect x="28" y="310" width="464" height="142" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="50" y="344" font-size="28" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="50" dy="0">Exact shipment</tspan></text><g data-node="slot-shipment" data-type="scope" data-status="evaluated-binding"><text x="50" y="383" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">ORD-104 · revision 1</tspan><tspan x="50" dy="34">Consolidated · SP-B</tspan></text></g><g data-edge="scope-required-by-slot" data-from="slot-requirement" data-to="slot-shipment" data-relation="requires" data-status="declared-context"><path d="M492 1180H536V410H492" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><g data-edge="record-window" data-from="slot-record" data-to="slot-window" data-relation="applies-to" data-status="declared-context"><path d="M28 213H12V562H28" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><rect x="28" y="506" width="464" height="142" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="50" y="540" font-size="28" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="50" dy="0">Full interval</tspan></text><g data-node="slot-window" data-type="interval" data-status="evaluated-binding"><text x="50" y="579" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Full loading window</tspan><tspan x="50" dy="34">11 p.m.–midnight</tspan></text></g><g data-edge="window-required-by-slot" data-from="slot-requirement" data-to="slot-window" data-relation="requires" data-status="declared-context"><path d="M492 1180H536V606H492" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><g data-edge="record-known" data-from="slot-record" data-to="slot-known" data-relation="applies-to" data-status="declared-context"><path d="M28 213H12V758H28" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><rect x="28" y="702" width="464" height="142" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="50" y="736" font-size="28" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="50" dy="0">Available at selection</tspan></text><g data-node="slot-known" data-type="interval" data-status="evaluated-binding"><text x="50" y="775" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Known at 7:45 a.m.</tspan><tspan x="50" dy="34">Selection at 8 a.m.</tspan></text></g><g data-edge="known-required-by-slot" data-from="slot-requirement" data-to="slot-known" data-relation="requires" data-status="declared-context"><path d="M492 1180H536V802H492" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-mobile-arrow)"/></g><g data-edge="record-confirmed" data-from="slot-record" data-to="slot-confirm