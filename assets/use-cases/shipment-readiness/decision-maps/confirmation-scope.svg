<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="confirmation-scope-desktop-title confirmation-scope-desktop-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="e6fb533e46eeb69182a0cdbcc25845e7f0831f4fba857231909f8c2089e7b2bd" data-view="confirmation-scope" data-variant="desktop">
<title id="confirmation-scope-desktop-title">What a confirmation must cover</title>
<desc id="confirmation-scope-desktop-desc">One current SLOT-C104 record must refer to ORD-104 revision 1, Consolidated and SP-B, cover the full 11 p.m. to midnight loading window, be known by 8 a.m. selection and confirmed by the noon cutoff. The illustrated checks belong to the separate arrival-first authoring exercise; additional scope fields and rules remain in the native model.</desc>
<defs><marker id="confirmation-scope-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#48616d" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="840" rx="16" fill="#f7f6f9"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" font-size="36" font-weight="700" fill="#193743" text-anchor="start"><tspan x="40" dy="0">What a confirmation must cover</tspan></text><text x="40" y="91" font-size="24" font-weight="400" fill="#48616d" text-anchor="start"><tspan x="40" dy="0">Arrival-first authoring exercise</tspan></text><rect x="310" y="132" width="380" height="105" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="slot-record" data-type="record" data-status="evaluated-binding"><text x="332" y="172" font-size="25" font-weight="700" fill="#193743" text-anchor="start"><tspan x="332" dy="0">SLOT-C104</tspan><tspan x="332" dy="30">Current status: confirmed</tspan></text></g><g data-edge="record-scope" data-from="slot-record" data-to="slot-shipment" data-relation="applies-to" data-status="declared-context"><path d="M310 190H20V375H40" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><rect x="40" y="300" width="435" height="128" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="62" y="334" font-size="24" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="62" dy="0">Exact shipment</tspan></text><g data-node="slot-shipment" data-type="scope" data-status="evaluated-binding"><text x="62" y="373" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="62" dy="0">ORD-104 · revision 1</tspan><tspan x="62" dy="29">Consolidated · SP-B</tspan></text></g><g data-edge="scope-required-by-slot" data-from="slot-requirement" data-to="slot-shipment" data-relation="requires" data-status="declared-context"><path d="M375 640V620H490V445H258V428" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><g data-edge="record-window" data-from="slot-record" data-to="slot-window" data-relation="applies-to" data-status="declared-context"><path d="M690 190H980V375H960" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><rect x="525" y="300" width="435" height="128" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="547" y="334" font-size="24" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="547" dy="0">Full interval</tspan></text><g data-node="slot-window" data-type="interval" data-status="evaluated-binding"><text x="547" y="373" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="547" dy="0">Full loading window</tspan><tspan x="547" dy="29">11 p.m.–midnight</tspan></text></g><g data-edge="window-required-by-slot" data-from="slot-requirement" data-to="slot-window" data-relation="requires" data-status="declared-context"><path d="M625 640V620H510V445H738V428" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><g data-edge="record-known" data-from="slot-record" data-to="slot-known" data-relation="applies-to" data-status="declared-context"><path d="M310 190H20V540H40" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><rect x="40" y="465" width="435" height="128" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="62" y="499" font-size="24" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="62" dy="0">Available at selection</tspan></text><g data-node="slot-known" data-type="interval" data-status="evaluated-binding"><text x="62" y="538" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="62" dy="0">Known at 7:45 a.m.</tspan><tspan x="62" dy="29">Selection at 8 a.m.</tspan></text></g><g data-edge="known-required-by-slot" data-from="slot-requirement" data-to="slot-known" data-relation="requires" data-status="declared-context"><path d="M375 640V620H258V593" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#confirmation-scope-desktop-arrow)"/></g><g data-edge="record-confirmed" data