<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1570" viewBox="0 0 560 1570" role="img" aria-labelledby="shipping-interests-mobile-title shipping-interests-mobile-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="f8cfcf24f314082466d22be0003b1e5bed82153a4bd17e4f52879d578a10f13a" data-view="shipping-interests" data-variant="mobile">
<title id="shipping-interests-mobile-title">What Maya must reconcile</title>
<desc id="shipping-interests-mobile-desc">Launch, finance and the carrier coordinator have declared interests. Maya recommends an arrangement within the recorded delivery, expense, capacity, readiness, record and booking requirements, using the agreed cost-first priority. Responsible owners separately authorize and book. This is a decision map, not an authority chart or automatic action.</desc>
<defs><marker id="shipping-interests-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#48616d" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1570" rx="16" fill="#f7f6f9"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="28" y="52" font-size="34" font-weight="700" fill="#193743" text-anchor="start"><tspan x="28" dy="0">What Maya must reconcile</tspan></text><text x="28" y="94" font-size="28" font-weight="400" fill="#48616d" text-anchor="start"><tspan x="28" dy="0">Interests, requirements and priority</tspan></text><rect x="28" y="128" width="464" height="126" rx="12" fill="#f7f4fb" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="launch" data-type="role" data-status="declared-context"><text x="50" y="164" font-size="30" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Launch</tspan></text></g><g data-node="earlier-goods" data-type="goal" data-status="declared-context"><text x="50" y="204" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Wants the goods</tspan><tspan x="50" dy="32">earlier</tspan></text></g><g data-edge="launch-interest" data-from="launch" data-to="earlier-goods" data-relation="cares-about" data-status="declared-context"><path d="M469 162V210" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><g data-edge="earliness-informs-proposal" data-from="earlier-goods" data-to="shipment-proposal" data-relation="informs" data-status="declared-context"><path d="M492 226H522V576H190V620" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="276" width="464" height="126" rx="12" fill="#f7f4fb" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="finance" data-type="role" data-status="declared-context"><text x="50" y="312" font-size="30" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Finance</tspan></text></g><g data-node="avoid-premium" data-type="goal" data-status="declared-context"><text x="50" y="352" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Avoid unnecessary</tspan><tspan x="50" dy="32">expense</tspan></text></g><g data-edge="finance-interest" data-from="finance" data-to="avoid-premium" data-relation="cares-about" data-status="declared-context"><path d="M469 310V358" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><g data-edge="expense-informs-proposal" data-from="avoid-premium" data-to="shipment-proposal" data-relation="informs" data-status="declared-context"><path d="M492 374H522V576H280V620" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="424" width="464" height="126" rx="12" fill="#f7f4fb" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="carrier-coordinator" data-type="role" data-status="declared-context"><text x="50" y="460" font-size="30" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Carrier coordinator</tspan></text></g><g data-node="timely-proposal" data-type="goal" data-status="declared-context"><text x="50" y="500" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Needs a timely</tspan><tspan x="50" dy="32">proposal</tspan></text></g><g data-edge="carrier-interest" data-from="carrier-coordinator" data-to="timely-proposal" data-relation="cares-about" data-status="declared-context"><path d="M469 458V506" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><g data-edge="cutoff-informs-proposal" data-from="timely-proposal" data-to="shipment-proposal" data-relation="informs" data-status="declared-context"><path d="M492 522H522V576H370V620" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="620" width="464" height="140" rx="12" fill="#fff" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="maya" data-type="role" data-status="declared-context"><text x="50" y="658" font-size="30" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Maya recommends</tspan></text></g><g data-node="shipment-proposal" data-type="decision" data-status="declared-context"><text x="50" y="703" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Which complete arrangement</tspan><tspan x="50" dy="34">should Maya put forward?</tspan></text></g><g data-edge="maya-proposes" data-from="maya" data-to="shipment-proposal" data-relation="proposes" data-status="declared-context"><path d="M470 656V708" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><g data-edge="proposal-meets-basis" data-from="shipment-proposal" data-to="mandatory-basis" data-relation="must-satisfy" data-status="declared-context"><path d="M150 760V808" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="808" width="464" height="242" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="50" y="842" font-size="28" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="50" dy="0">Must satisfy</tspan></text><g data-node="mandatory-basis" data-type="requirement" data-status="evaluated-binding"><text x="50" y="881" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">100 units by Friday 5 p.m.</tspan><tspan x="50" dy="34">Expense at most $5,000</tspan><tspan x="50" dy="34">Capacity and readiness</tspan><tspan x="50" dy="34">Current records + permissions</tspan><tspan x="50" dy="34">An open booking window</tspan></text></g><g data-edge="proposal-compares-by-cost" data-from="shipment-proposal" data-to="cost-first-policy" data-relation="compares-by" data-status="declared-context"><path d="M492 725H536V1090H400V1114" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="1114" width="464" height="176" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="50" y="1148" font-size="28" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="50" dy="0">Then compare by</tspan></text><g data-node="cost-first-policy" data-type="preference" data-status="evaluated-binding"><text x="50" y="1187" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Lowest complete expense</tspan><tspan x="50" dy="34">among arrangements that pass;</tspan><tspan x="50" dy="34">arrival breaks ties</tspan></text></g><g data-edge="proposal-informs-action" data-from="shipment-proposal" data-to="authorize-and-book" data-relation="informs" data-status="declared-context"><path d="M28 725H12V1322H170V1350" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="1350" width="464" height="130" rx="12" fill="#fff" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="operating-owners" data-type="role" data-status="declared-context"><text x="50" y="1388" font-size="30" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Responsible owners</tspan></text></g><g data-node="authorize-and-book" data-type="action" data-status="declared-context"><text x="50" y="1430" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Separately authorize</tspan><tspan x="50" dy="34">and book the shipment</tspan></text></g><g data-edge="owners-perform-action" data-from="operating-owners" data-to="authorize-and-book" data-relation="performs" data-status="declared-context"><path d="M470 1387V1430" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-mobile-arrow)"/></g><rect x="28" y="1490" width="28" height="24" rx="4" fill="#f7f4fb" stroke="#a18aba" stroke-width="2" stroke-dasharray="5 4"/><text x="72" y="1511" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="72" dy="0">Declared context</tspan></text><rect x="28" y="1535" width="28" height="24" rx="4" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="72" y="1556" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="72" dy="0">Retained app/case basis</tspan></text></g>
