dy="29">Capacity and readiness</tspan><tspan x="62" dy="29">Current records + permissions</tspan><tspan x="62" dy="29">An open booking window</tspan></text></g><rect x="520" y="495" width="440" height="224" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><text x="542" y="529" font-size="24" font-weight="700" fill="#356b70" text-anchor="start"><tspan x="542" dy="0">Then compare by</tspan></text><g data-node="cost-first-policy" data-type="preference" data-status="evaluated-binding"><text x="542" y="568" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="542" dy="0">Lowest complete expense</tspan><tspan x="542" dy="29">among arrangements that pass;</tspan><tspan x="542" dy="29">arrival breaks ties</tspan></text></g><g data-edge="proposal-informs-action" data-from="shipment-proposal" data-to="authorize-and-book" data-relation="informs" data-status="declared-context"><path d="M500 432V755H500V780" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#shipping-interests-desktop-arrow)"/></g><rect x="245" y="780" width="510" height="106" rx="12" fill="#fff" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="operating-owners" data-type="role" data-status="declared-context"><text x="267" y="815" font-size="26" font-weight="700" fill="#193743" text-anchor="start"><tspan x="267" dy="0">Responsible owners</tspan></text></g><g data-node="authorize-and-book" data-type="action" data-status="declared-context"><text x="267" y="850" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="267" dy="0">Separately authorize</tspan><tspan x="267" dy="27">and book the shipment</tspan></text></g><g data-edge="owners-perform-action" data-from="operating-owners" data-to="authorize-and-book" data-relation="performs" data-status="declared-context"><path d="M732 813V852" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-desktop-arrow)"/></g><rect x="