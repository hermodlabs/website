<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="shipping-interests-desktop-title shipping-interests-desktop-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="e6fb533e46eeb69182a0cdbcc25845e7f0831f4fba857231909f8c2089e7b2bd" data-view="shipping-interests" data-variant="desktop">
<title id="shipping-interests-desktop-title">What Maya must reconcile</title>
<desc id="shipping-interests-desktop-desc">Launch, finance and the carrier coordinator have declared interests. Maya recommends an arrangement within the recorded delivery, expense, capacity, readiness, record and booking requirements, using the agreed cost-first priority. Responsible owners separately authorize and book. This is a decision map, not an authority chart or automatic action.</desc>
<defs><marker id="shipping-interests-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#48616d" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="940" rx="16" fill="#f7f6f9"/>
