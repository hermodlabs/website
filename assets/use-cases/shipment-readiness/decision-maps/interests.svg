400" fill="#193743" text-anchor="start"><tspan x="375" dy="0">Avoid unnecessary</tspan><tspan x="375" dy="28">expense</tspan></text></g><g data-edge="finance-interest" data-from="finance" data-to="avoid-premium" data-relation="cares-about" data-status="declared-context"><path d="M625 159V202" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-desktop-arrow)"/></g><g data-edge="expense-informs-proposal" data-from="avoid-premium" data-to="shipment-proposal" data-relation="informs" data-status="declared-context"><path d="M500 250V280H500V310" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-desktop-arrow)"/></g><rect x="670" y="124" width="290" height="126" rx="12" fill="#f7f4fb" stroke="#a18aba" stroke-width="2" stroke-dasharray="7 5"/><g data-node="carrier-coordinator" data-type="role" data-status="declared-context"><text x="690" y="160" font-size="26" font-weight="700" fill="#193743" text-anchor="start"><tspan x="690" dy="0">Carrier coordinator</tspan></text></g><g data-node="timely-proposal" data-type="goal" data-status="declared-context"><text x="690" y="201" font-size="24" font-weight="400" fill="#193743" text-anchor="start"><tspan x="690" dy="0">Needs a timely</tspan><tspan x="690" dy="28">proposal</tspan></text></g><g data-edge="carrier-interest" data-from="carrier-coordinator" data-to="timely-proposal" data-relation="cares-about" data-status="declared-context"><path d="M940 159V202" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-desktop-arrow)"/></g><g data-edge="cutoff-informs-proposal" data-from="timely-proposal" data-to="shipment-proposal" data-relation="informs" data-status="declared-context"><path d="M815 250V280H580V310" fill="none" stroke="#7850c2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#shipping-interests-desktop-arrow)"/></g><rect x="245" y="310" width="510" hei