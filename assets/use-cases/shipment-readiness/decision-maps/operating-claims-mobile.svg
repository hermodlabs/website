<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1520" viewBox="0 0 560 1520" role="img" aria-labelledby="operating-claims-mobile-title operating-claims-mobile-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="f8cfcf24f314082466d22be0003b1e5bed82153a4bd17e4f52879d578a10f13a" data-view="operating-claims" data-variant="mobile">
<title id="operating-claims-mobile-title">A connected basis. Distinct claims.</title>
<desc id="operating-claims-mobile-desc">A calculated finding informs Maya’s separate choice. Authorization and reservation refer to the chosen arrangement. Authorization precedes reservation, and reservation precedes delivery; earlier records do not prove later events. The completion review needs each required record and tests the original promise. These connections are explanatory and perform no action.</desc>
<defs><marker id="operating-claims-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#48616d" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1520" rx="16" fill="#f7f6f9"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="28" y="52" font-size="34" font-weight="700" fill="#193743" text-anchor="start"><tspan x="28" dy="0">Distinct claims. Linked basis.</tspan></text><text x="28" y="94" font-size="28" font-weight="400" fill="#48616d" text-anchor="start"><tspan x="28" dy="0">Linked records. Separate actions.</tspan></text><rect x="28" y="132" width="464" height="108" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="reviewed-finding" data-type="finding" data-status="evaluated-binding"><text x="50" y="172" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Calculated finding</tspan><tspan x="50" dy="34">A supported arrangement</tspan></text></g><g data-edge="finding-informs-choice" data-from="reviewed-finding" data-to="chosen-arrangement" data-relation="informs" data-status="declared-context"><path d="M260 240V293" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#operating-claims-mobile-arrow)"/></g><text x="285" y="276" font-size="28" font-weight="400" fill="#48616d" text-anchor="start"><tspan x="285" dy="0">informs</tspan></text><rect x="28" y="293" width="464" height="108" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="chosen-arrangement" data-type="decision" data-status="evaluated-binding"><text x="50" y="333" font-size="28" font-weight="700" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Maya’s recorded choice</tspan><tspan x="50" dy="34">Consolidated</tspan></text></g><rect x="28" y="482" width="464" height="130" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="scoped-authorization" data-type="record" data-status="evaluated-binding"><text x="50" y="522" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Scoped authorization</tspan><tspan x="50" dy="34">Permission for this</tspan><tspan x="50" dy="34">action</tspan></text></g><g data-edge="authority-precedes-reservation" data-from="scoped-authorization" data-to="carrier-reservation" data-relation="precedes" data-status="declared-context"><path d="M260 612V664" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#operating-claims-mobile-arrow)"/></g><rect x="28" y="664" width="464" height="130" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="carrier-reservation" data-type="record" data-status="evaluated-binding"><text x="50" y="704" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Quote-linked</tspan><tspan x="50" dy="34">reservation record</tspan><tspan x="50" dy="34">Carrier booking</tspan></text></g><g data-edge="booking-precedes-delivery" data-from="carrier-reservation" data-to="accepted-delivery" data-relation="precedes" data-status="declared-context"><path d="M260 794V846" fill="none" stroke="#48616d" stroke-width="2.5" marker-end="url(#operating-claims-mobile-arrow)"/></g><rect x="28" y="846" width="464" height="130" rx="12" fill="#f1f7f6" stroke="#809d9d" stroke-width="2"/><g data-node="accepted-delivery" data-type="record" data-status="evaluated-binding"><text x="50" y="886" font-size="28" font-weight="400" fill="#193743" text-anchor="start"><tspan x="50" dy="0">Accepted delivery</tspan><tspan x="50" dy="34">Quantity received</tspan><tspan x="50" dy="34">Actual receipt time</tspan></text></g><g data-edge="authority-for-choice" data-from="scoped-authorization" data-to="chosen-arrangement" data-relation="applies-to" data-status="declared-context"><path d="M28 522H12V348H28" fill="none" stroke="#48616d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#operating-claims-mobile-arrow)"/></g><g data-edge="booking-for-choice" data-from="carrier-reservation" data-to="chosen-arrangement" data-relation="applies-to" data-status="declared-context"><path d="M492 704H524V348H492" fill="none" stroke="#48616d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#operating-claims-mobile-arrow)"