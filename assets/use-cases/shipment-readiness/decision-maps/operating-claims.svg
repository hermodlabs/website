<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="operating-claims-desktop-title operating-claims-desktop-desc" data-model="shipment-readiness-decision-maps" data-model-sha256="e6fb533e46eeb69182a0cdbcc25845e7f0831f4fba857231909f8c2089e7b2bd" data-view="operating-claims" data-variant="desktop">
<title id="operating-claims-desktop-title">A connected basis. Distinct claims.</title>
<desc id="operating-claims-desktop-desc">A reviewed finding informs Maya’s separate choice. Authorization and reservation refer to the chosen arrangement. Authorization precedes reservation, and reservation precedes delivery; earlier records do not prove later events. The completion review needs each required record and tests the original promise. These connections are explanatory and perform no action.</desc>
