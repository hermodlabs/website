<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-labelledby="component-view-title component-view-desc">
<title id="component-view-title">The components of the Python and Decision Lab integration</title>
<desc id="component-view-desc">Offline scikit-learn training creates a fitted model. In the team’s Python program, an estimator uses that model, then an adapter coordinates calls to Decision Lab’s public Python SDK. The SDK evaluates pinned planning and information-value app definitions. Complete planning eligibility and cost findings return to the adapter and are combined with reviewed probabilities, check likelihoods, fees and timing for the information-value assessment. Findings return to the team’s report renderer. Solid boxes denote executable components; dashed boxes denote data or authored artifacts. The app definitions are loaded configuration, not separate network services.</desc>
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#193743} .heading{font-weight:600} .muted{fill:#53717b} .teal{fill:#177681} .purple{fill:#7850c2}
  .component{fill:#fff;stroke:#177681;stroke-width:2} .sdk{fill:#f1eafa;stroke:#7850c2;stroke-width:2}
  .artifact{fill:#f6f5f8;stroke:#53717b;stroke-width:2;stroke-dasharray:7 5} .app{fill:#fff;stroke:#7850c2;stroke-width:2;stroke-dasharray:7 5}
  .flow{fill:none;stroke:#193743;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .association{fill:none;stroke:#53717b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .actor{fill:none;stroke:#193743;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8" fill="none" stroke="#193743" stroke-width="1.4"/></marker></defs>
<rect width="960" height="1060" fill="#f6f5f8"/>

