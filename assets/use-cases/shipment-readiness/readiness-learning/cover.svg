  <title id="readiness-learning-cover-title">Connect Python machine learning to Decision Lab</title>
  <desc id="readiness-learning-cover-desc">A Python scikit-learn model supplies estimated probabilities to a Python adapter. The adapter binds the estimates to authored cases and calls Decision Lab's public SDK for planning and learning. Business requirements feed those cases separately. Evaluated results return to a Python report for review.</desc>
