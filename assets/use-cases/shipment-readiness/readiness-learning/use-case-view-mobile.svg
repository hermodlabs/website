<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1090" viewBox="0 0 360 1090" role="img" aria-labelledby="use-case-view-mobile-title use-case-view-mobile-desc">
<title id="use-case-view-mobile-title">Who uses the Python shipment assessment application?</title>
<desc id="use-case-view-mobile-desc">The analyst supplies facts, reviews the numerical basis and generates the assessment. Maya reads the generated report and chooses what to propose. Current registration confirmation, spending authorization and freight reservation are outside the application. Association lines indicate supported goals, not execution order.</desc>
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#193743} .heading{font-weight:600} .muted{fill:#53717b} .teal{fill:#177681} .purple{fill:#7850c2}
  .component{fill:#fff;stroke:#177681;stroke-width:2} .sdk{fill:#f1eafa;stroke:#7850c2;stroke-width:2}
  .artifact{fill:#f6f5f8;stroke:#53717b;stroke-width:2;stroke-dasharray:7 5} .app{fill:#fff;stroke:#7850c2;stroke-width:2;stroke-dasharray:7 5}
  .flow{fill:none;stroke:#193743;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .association{fill:none;stroke:#53717b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .actor{fill:none;stroke:#193743;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8" fill="none" stroke="#193743" stroke-width="1.4"/></marker></defs>
<rect width="360" height="1090" fill="#f6f5f8"/>

<text x="20" y="35" font-size="24" class="heading">Who uses the assessment?</text>
<text x="20" y="63" font-size="17" class="muted">Support for Maya’s proposed next step.</text>
<g class="actor"><circle cx="180" cy="103" r="12"/><path d="M180 115v35m-22-22h44m-22 22-20 27m20-27 20 27"/></g>
<text x="180" y="202" text-anchor="middle" font-size="21" class="heading">Analyst</text>
<rect x="48" y="235" width="288" height="558" rx="14" fill="#e8f3f2" stroke="#177681" stroke-width="2"/>
<text x="192" y="269" text-anchor="middle" font-size="21" class="heading teal">Python shipment</text><text x="192" y="295" text-anchor="middle" font-size="21" class="heading teal">assessment application</text>
<g class="association"><path d="M158 125H20v458m0-224h46m-46 112h46m-46 112h46M202 850h148V712h-32"/></g>
<g fill="#fff" stroke="#b7cbd1" stroke-width="2"><ellipse cx="192" cy="359" rx="126" ry="39"/><ellipse cx="192" cy="471" rx="126" ry="39"/><ellipse cx="192" cy="583" rx="126" ry="39"/><ellipse cx="192" cy="712" rx="126" ry="39"/></g>
<g text-anchor="middle" font-size="20"><text x="192" y="354">Supply shipment</text><text x="192" y="379">facts</text><text x="192" y="466">Review the</text><text x="192" y="491">numerical basis</text><text x="192" y="578">Generate the</text><text x="192" y="603">assessment</text><text x="192" y="707">Read the</text><text x="192" y="732">generated report</text></g>
<g class="actor"><circle cx="180" cy="825" r="12"/><path d="M180 837v35m-22-22h44m-22 22-20 27m20-27 20 27"/></g>
<text x="180" y="924" text-anchor="middle" font-size="21" class="heading">Maya</text><text x="180" y="949" text-anchor="middle" font-size="17" class="muted">Chooses what to propose</text>
<rect x="16" y="977" width="328" height="98" rx="12" fill="#fff" stroke="#b7cbd1" stroke-width="2"/>
<text x="32" y="1005" font-size="18" class="heading">Outside this application</text><text x="32" y="1032" font-size="17">Obtain confirmation, authorize</text><text x="32" y="1057" font-size="17">spending and reserve freight.</text>

</svg>
