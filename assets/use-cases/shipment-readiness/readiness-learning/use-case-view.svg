<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="use-case-view-title use-case-view-desc">
<title id="use-case-view-title">Who uses the Python shipment assessment application?</title>
<desc id="use-case-view-desc">The analyst supplies shipment facts, reviews the numerical basis and generates an assessment using a standalone Python application. Maya reads its generated report and decides what to propose. Obtaining current registration confirmation, authorizing spending and reserving freight remain outside the application. Lines connect actors to supported goals; they do not show execution order.</desc>
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#193743} .heading{font-weight:600} .muted{fill:#53717b} .teal{fill:#177681} .purple{fill:#7850c2}
  .component{fill:#fff;stroke:#177681;stroke-width:2} .sdk{fill:#f1eafa;stroke:#7850c2;stroke-width:2}
  .artifact{fill:#f6f5f8;stroke:#53717b;stroke-width:2;stroke-dasharray:7 5} .app{fill:#fff;stroke:#7850c2;stroke-width:2;stroke-dasharray:7 5}
  .flow{fill:none;stroke:#193743;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .association{fill:none;stroke:#53717b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .actor{fill:none;stroke:#193743;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8" fill="none" stroke="#193743" stroke-width="1.4"/></marker></defs>
<rect width="960" height="800" fill="#f6f5f8"/>

<text x="40" y="54" font-size="30" class="heading">Who uses the assessment?</text>
<text x="40" y="89" font-size="22" class="muted">The application supports a proposal before Maya’s reservation cutoff.</text>
<rect x="280" y="132" width="640" height="485" rx="16" fill="#e8f3f2" stroke="#177681" stroke-width="2"/>
<text x="600" y="169" text-anchor="middle" font-size="25" class="heading teal">Python shipment assessment application</text>
<g class="association"><path d="M145 287h78V245h112M223 287v57h112M223 344v100h112M145 550h190"/></g>
<g fill="#fff" stroke="#b7cbd1" stroke-width="2"><ellipse cx="600" cy="245" rx="265" ry="38"/><ellipse cx="600" cy="344" rx="265" ry="38"/><ellipse cx="600" cy="444" rx="265" ry="38"/><ellipse cx="600" cy="550" rx="265" ry="38"/></g>
<g text-anchor="middle" font-size="24"><text x="600" y="253">Supply shipment facts</text><text x="600" y="352">Review the numerical basis</text><text x="600" y="452">Generate the assessment</text><text x="600" y="558">Read the generated report</text></g>
<g class="actor"><circle cx="110" cy="229" r="12"/><path d="M110 241v35m-22-22h44m-22 22-20 27m20-27 20 27"/></g>
<text x="110" y="331" text-anchor="middle" font-size="24" class="heading">Analyst</text>
<text x="110" y="360" text-anchor="middle" font-size="20" class="muted">Prepares the analysis</text>
<g class="actor"><circle cx="110" cy="492" r="12"/><path d="M110 504v35m-22-22h44m-22 22-20 27m20-27 20 27"/></g>
<text x="110" y="594" text-anchor="middle" font-size="24" class="heading">Maya</text>
<text x="110" y="623" text-anchor="middle" font-size="20" class="muted">Chooses proposed</text><text x="110" y="648" text-anchor="middle" font-size="20" class="muted">next step</text>
<rect x="280" y="658" width="640" height="109" rx="12" fill="#fff" stroke="#b7cbd1" stroke-width="2"/>
<text x="304" y="692" font-size="23" class="heading">Operating actions stay outside this application</text>
<text x="304" y="724" font-size="21">Obtain confirmation · authorize spending · reserve freight</text>
<text x="40" y="750" font-size="18" class="muted">Lines show supported goals,</text><text x="40" y="776" font-size="18" class="muted">not a sequence of steps.</text>

</svg>
