<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="reservation-cover-title reservation-cover-desc">
  <title id="reservation-cover-title">One shipment exception. A current recommendation.</title>
  <desc id="reservation-cover-desc">An illustrated Shipment Reservation Desk brings scoped confirmation records and three shipment arrangements into one interface. An old-revision confirmation leaves Direct preferred. After a current confirmation is recorded and the same Decision Lab app reassesses the shipment, Consolidated becomes preferred at $5,000, arriving Thursday evening. This is a conceptual illustration, not an application screenshot.</desc>
