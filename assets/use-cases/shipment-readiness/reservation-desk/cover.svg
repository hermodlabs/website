    <text x="827" y="180" text-anchor="end" font-size="19" fill="#177681">Same app · SDK</text>
    <text x="154" y="261" font-size="21" font-weight="600">Order 105 · revision 2</text>
    <text x="171" y="313" font-size="19" fill="#53717b">Direct quote</text>
