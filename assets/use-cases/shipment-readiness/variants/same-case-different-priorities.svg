<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="shipment-priorities-title shipment-priorities-desc">
  <title id="shipment-priorities-title">One shipment case, two decision priorities</title>
  <desc id="shipment-priorities-desc">An app author configures two apps from the same planning template and retains the same 18 mandatory checks. The cost-first app minimizes expense. The arrival-first app minimizes arrival time, using expense to break ties. A case worker runs the identical fictional shipment snapshot in both apps: a direct arrangement costs 4,000 dollars and arrives Friday, November 20, at noon; a backup arrangement costs 6,000 dollars and arrives Thursday, November 19, at noon. Both arrangements meet the configured requirements. The cost-first app recommends direct, while the arrival-first app recommends backup. Arriving one day earlier costs 2,000 dollars more; the business must justify that priority.</desc>
  <defs>
    <marker id="shipment-priorities-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#48616d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#193743}
      .role{font-size:18px;font-weight:700;letter-spacing:1.8px}
      .heading{font-size:26px;font-weight:700}
      .body{font-size:22px;fill:#48616d}
      .small{font-size:20px;fill:#48616d}
      .flow{fill:none;stroke:#48616d;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#shipment-priorities-arrow)}
    </style>
  </defs>
  <rect width="960" height="850" rx="18" fill="#f6f5f8"/>
  <text x="48" y="56" font-size="34" font-weight="700">Same shipment. Different decision priorities.</text>
  <text x="48" y="94" class="body">One planning template · The same 18 mandatory checks</text>

  <!-- The worker provides one identical input snapshot to both apps. -->
  <text x="48" y="150" class="role">CASE WORKER · SAME SHIPMENT FACTS</text>
  <rect x="108" y="172" width="744" height="166" rx="14" fill="#fff" stroke="#cbd6dc" stroke-width="2"/>
  <text x="480" y="210" class="heading" text-anchor="middle">One shared fictional input snapshot</text>
  <text x="134" y="246" class="body">Direct: $4,000 · Fri, Nov 20, noon</text>
  <text x="134" y="279" class="body">Backup: $6,000 · Thu, Nov 19, noon</text>
  <text x="134" y="313" font-size="18" fill="#48616d">All dates: 2026 · UTC−06</text>
  <rect x="612" y="232" width="216" height="62" rx="10" fill="#f2f8f7"/>
  <text x="720" y="258" font-size="19" font-weight="700" text-anchor="middle">Both meet all</text>
  <text x="720" y="282" font-size="19" text-anchor="middle">configured requirements</text>

  <path d="M480 339v26H252v21" class="flow"/>
  <path d="M480 365h228v21" class="flow"/>

  <!-- Each app interprets the shared facts using its authored preference. -->
  <rect x="48" y="396" width="408" height="158" rx="14" fill="#f2f8f7" stroke="#177681" stroke-width="2.5"/>
  <rect x="504" y="396" width="408" height="158" rx="14" fill="#f7f4fb" stroke="#7850c2" stroke-width="2.5"/>
  <g>
    <text x="74" y="427" font-size="17" font-weight="700" letter-spacing="1">APP AUTHOR · CONFIGURE PRIORITY</text>
    <text x="74" y="464" class="heading">Cost-first app</text>
    <text x="74" y="501" class="body">Prefer the lowest expense.</text>
    <text x="74" y="533" class="small">Among feasible arrangements</text>
    <text x="530" y="427" font-size="17" font-weight="700" letter-spacing="1">APP AUTHOR · CONFIGURE PRIORITY</text>
    <text x="530" y="464" class="heading">Arrival-first app</text>
    <text x="530" y="501" class="body">Prefer the earliest arrival.</text>
    <text x="530" y="533" class="small">Expense breaks arrival-time ties</text>
  </g>
  <path d="M252 555v55" class="flow"/>
  <path d="M708 555v55" class="flow"/>

  <!-- Distinct recommendations follow from the authored priorities. -->
  <rect x="48" y="620" width="408" height="138" rx="14" fill="#fff" stroke="#177681" stroke-width="2.5"/>
  <rect x="504" y="620" width="408" height="138" rx="14" fill="#fff" stroke="#7850c2" stroke-width="2.5"/>
  <path d="M64 620h376" stroke="#177681" stroke-width="6" stroke-linecap="round"/>
  <path d="M520 620h376" stroke="#7850c2" stroke-width="6" stroke-linecap="round"/>
  <text x="74" y="658" class="small">COST-FIRST RECOMMENDATION</text>
  <text x="74" y="695" class="heading">Direct · $4,000</text>
  <text x="74" y="731" class="body">Friday, Nov 20 · noon</text>
  <text x="530" y="658" class="small">ARRIVAL-FIRST RECOMMENDATION</text>
  <text x="530" y="695" class="heading">Backup · $6,000</text>
  <text x="530" y="731" class="body">Thursday, Nov 19 · noon</text>

  <text x="480" y="802" font-size="24" font-weight="700" text-anchor="middle">One day earlier costs $2,000 more.</text>
  <text x="480" y="833" class="small" text-anchor="middle">The business must justify the priority. The feasibility findings are unchanged.</text>
</svg>
