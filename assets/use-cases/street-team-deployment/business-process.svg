<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1640" width="1200" height="1640" role="img" aria-labelledby="street-process-title street-process-desc">
  <title id="street-process-title">From a quiet evening to a bounded outreach decision</title>
  <desc id="street-process-desc">A proposed business process records the review scope, assembles complete promotion plans, checks staffing, access, timing and budget, and compares break-even thresholds. Missing or failed requirements return to the recorded facts. A manager separately authorizes a bounded deployment with a review time. People carry it out and collect actual admissions and cost records, reconsider the remaining opportunity, and design future comparisons. Calculated eligibility and financial thresholds do not authorize work, predict demand or establish causal impact.</desc>
  <defs>
    <marker id="street-process-review-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#177681"/></marker>
    <marker id="street-process-work-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#667b86"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#193743}
      .street-process-label{font-size:27px;font-weight:700}
      .street-process-detail{font-size:22px;fill:#48616d}
      .street-process-section{font-size:19px;font-weight:700;letter-spacing:1.5px}
      .street-process-review{fill:#f2f8f7;stroke:#177681;stroke-width:3}
      .street-process-choice{fill:#f7f4fb;stroke:#7850c2;stroke-width:3}
      .street-process-work{fill:#fff;stroke:#899ba4;stroke-width:2.5;stroke-dasharray:8 7}
      .street-process-flow{fill:none;stroke:#177681;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#street-process-review-arrow)}
      .street-process-handoff{fill:none;stroke:#667b86;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:8 7;marker-end:url(#street-process-work-arrow)}
    </style>
  </defs>
  <rect width="1200" height="1640" rx="18" fill="#f6f5f8"/>
  <text x="60" y="64" font-size="36" font-weight="700">Before the next promotion push</text>
  <text x="60" y="103" class="street-process-detail">A proposed business process · Hermod Labs</text>
  <g transform="translate(60 136)">
    <rect width="27" height="20" rx="4" class="street-process-review"/>
    <text x="39" y="17" font-size="20">Decision review</text>
    <rect x="279" width="27" height="20" rx="4" class="street-process-choice"/>
    <text x="318" y="17" font-size="20">Manager's choice</text>
    <rect x="619" width="27" height="20" rx="4" class="street-process-work"/>
    <text x="658" y="17" font-size="20">Actual operating work</text>
  </g>
  <rect x="38" y="187" width="1124" height="683" rx="15" fill="#fff"/>
  <text x="63" y="228" class="street-process-section">BUILD AND REVIEW THE PROPOSAL</text>
  <rect x="302" y="251" width="794" height="110" rx="13" class="street-process-review"/>
  <text x="699" y="293" class="street-process-label" text-anchor="middle">Record the scope and current facts</text>
  <text x="699" y="329" class="street-process-detail" text-anchor="middle">Venue · date · crew · location · offer · review time · sources</text>
  <path d="M699 361v35" class="street-process-flow"/>
  <rect x="302" y="400" width="794" height="110" rx="13" class="street-process-review"/>
  <text x="699" y="442" class="street-process-label" text-anchor="middle">Assemble complete deployment plans</text>
  <text x="699" y="478" class="street-process-detail" text-anchor="middle">People + place + timing + offer + transport + cost</text>
  <path d="M699 510v35" class="street-process-flow"/>
  <rect x="302" y="549" width="794" height="118" rx="13" class="street-process-review"/>
  <text x="699" y="592" class="street-process-label" text-anchor="middle">Check the recorded requirements</text>
  <text x="699" y="628" class="street-process-detail" text-anchor="middle">Floor coverage · location access · timing · spending limit</text>
  <path d="M302 608H142V306h152" class="street-process-flow"/>
  <rect x="64" y="412" width="160" height="99" rx="9" fill="#fff"/>
  <text x="144" y="440" font-size="19" text-anchor="middle">Missing or</text>
  <text x="144" y="467" font-size="19" text-anchor="middle">failed checks?</text>
  <text x="144" y="494" font-size="19" text-anchor="middle">Revise the plan.</text>
  <path d="M699 667v35" class="street-process-flow"/>
  <rect x="302" y="706" width="794" height="118" rx="13" class="street-process-review"/>
  <text x="699" y="749" class="street-process-label" text-anchor="middle">Compare financial thresholds</text>
  <text x="699" y="785" class="street-process-detail" text-anchor="middle">Additional cost ÷ contribution per additional customer</text>
  <text x="699" y="851" font-size="21" text-anchor="middle" fill="#7850c2">A break-even threshold is not a forecast of customer arrivals.</text>
  <rect x="38" y="892" width="1124" height="204" rx="15" fill="#efebf5"/>
  <path d="M1096 765h30v242h-26" class="street-process-handoff"/>
  <text x="63" y="933" class="street-process-section">MANAGER</text>
  <rect x="302" y="952" width="794" height="110" rx="13" class="street-process-choice"/>
  <text x="699" y="994" class="street-process-label" text-anchor="middle">Authorize a bounded deployment, or hold it</text>
  <text x="699" y="1030" class="street-process-detail" text-anchor="middle">Named owner · spending authority · stop conditions · review time</text>
  <rect x="38" y="1118" width="1124" height="476" rx="15" fill="#edf1f3"/>
  <path d="M699 1062v114" class="street-process-handoff"/>
  <text x="63" y="1159" class="street-process-section">OPERATIONS AND LEARNING</text>
  <rect x="302" y="1180" width="794" height="110" rx="13" class="street-process-work"/>
  <text x="699" y="1222" class="street-process-label" text-anchor="middle">Carry out the plan and retain actual records</text>
  <text x="699" y="1258" class="street-process-detail" text-anchor="middle">Deployment · admissions · retained sales · offers · costs</text>
  <path d="M699 1290v31" class="street-process-handoff"/>
  <rect x="302" y="1325" width="794" height="110" rx="13" class="street-process-work"/>
  <text x="699" y="1367" class="street-process-label" text-anchor="middle">Review the remaining cost and opportunity</text>
  <text x="699" y="1403" class="street-process-detail" text-anchor="middle">Continue · change the plan · stop further spending</text>
  <path d="M699 1435v31" class="street-process-handoff"/>
  <rect x="302" y="1470" width="794" height="88" rx="13" class="street-process-work"/>
  <text x="699" y="1508" class="street-process-label" text-anchor="middle">Design the next comparison deliberately</text>
  <text x="699" y="1542" class="street-process-detail" text-anchor="middle">Comparable occasions · planned allocation · uncertainty retained</text>
  <text x="60" y="1621" font-size="19" fill="#48616d">Recorded arrivals alone do not establish how many extra visits the promotion caused.</text>
</svg>
