<svg xmlns="http://www.w3.org/2000/svg" width="600" height="990" viewBox="0 0 600 990" role="img" aria-labelledby="staff-roles-mobile-title staff-roles-mobile-desc" data-model="street-team-staff-allocation" data-model-version="1.2.1" data-model-sha256="a53130736595e5865f3231709bd239a92795ccddcb6e28ffee1390407d9bf617" data-context="five-available" data-view="roles">
<title id="staff-roles-mobile-title">One staff pool. Several priorities.</title>
<desc id="staff-roles-mobile-desc">Alex wants to improve profit and makes the deployment decision within his delegated spending and operating limits. The floor team wants people on the floor to maintain customer service; promoters want people doing outreach. Both teams report to and influence Alex, who reports to the owner. Reporting does not introduce an additional owner approval step. Choosing and specifically authorizing an assignment remain separate. These roles and interests are declared context.</desc>
