<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="staff-roles-desktop-title staff-roles-desktop-desc" data-model="street-team-staff-allocation" data-model-version="1.2.1" data-model-sha256="d5773186dffa4e97bfb7ee2e9a5411cd65722cd1b81671e102f629067bbb3010" data-context="five-available" data-view="roles">
<title id="staff-roles-desktop-title">One staff pool. Several priorities.</title>
<desc id="staff-roles-desktop-desc">Alex wants to improve profit and makes the deployment decision within his delegated spending and operating limits. The floor team wants people on the floor to maintain customer service; promoters want people doing outreach. Both teams report to and influence Alex, who reports to the owner. Reporting does not introduce an additional owner approval step. Choosing and specifically authorizing an assignment remain separate. These roles and interests are declared context.</desc>
