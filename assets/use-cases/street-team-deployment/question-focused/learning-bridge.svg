<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
<title id="title">From a promotion hurdle to a learning decision</title>
<desc id="desc">The working operating review supplies eligibility and the financial hurdle. A proposed next process compares promotion with baseline on eligible evenings, records actual delivery and retained contribution, and supports a spending decision once reviewed evidence exists.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m0 0 8 4.5-8 4.5" fill="none" stroke="#667d82" stroke-width="1.4"/></marker></defs>
<rect x="1" y="1" width="1198" height="518" rx="22" fill="#f8faf9" stroke="#dce5e1"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#183c3c">
<text x="40" y="52" font-size="16" letter-spacing="1.3" font-weight="650">THE NEXT SPENDING QUESTION</text>
<text x="40" y="98" font-size="30" font-weight="650">Does the promotion add enough contribution?</text>
<path d="M292 244H325 M574 244H607 M856 244H889" stroke="#667d82" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="145" width="250" height="206" rx="14" fill="#e8f2ed" stroke="#a8c4b7"/>
<rect x="322" y="145" width="250" height="206" rx="14" fill="#fff" stroke="#d2deda"/>
<rect x="604" y="145" width="250" height="206" rx="14" fill="#fff" stroke="#d2deda"/>
<rect x="886" y="145" width="274" height="206" rx="14" fill="#fff" stroke="#d2deda"/>
<g font-size="14" font-weight="650" letter-spacing=".8"><text x="60" y="176">WORKING APP</text><text x="342" y="176">PROPOSED COMPARISON</text><text x="624" y="176">EVIDENCE TO COLLECT</text><text x="906" y="176">LATER SPENDING REVIEW</text></g>
<g font-size="22" font-weight="650"><text x="60" y="216">Eligible evenings</text><text x="342" y="216">Promotion or</text><text x="342" y="245">baseline</text><text x="624" y="216">Actual delivery</text><text x="624" y="245">and contribution</text><text x="906" y="216">Continue, change</text><text x="906" y="245">or stop?</text></g>
<g font-size="17" fill="#4b6666"><text x="60" y="273">Check coverage, timing,</text><text x="60" y="298">access and spending.</text><text x="60" y="326">$200 hurdle: 5 / 6 guests</text><text x="342" y="282">Design fair assignment</text><text x="342" y="307">before spending.</text><text x="624" y="282">Keep costs, cancellations</text><text x="624" y="307">and outcomes visible.</text><text x="906" y="282">Use reviewed findings;</text><text x="906" y="307">allow an inconclusive result.</text></g>
<path d="M322 380H1160" stroke="#a7b8b2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="322" y="415" font-size="18" font-weight="650">Learning brief agreed; study design and results still required.</text>
<text x="40" y="470" font-size="17" fill="#4b6666">5 genuinely additional guests cover $200 at $40 contribution; 6 exceed it. Customer response is unknown.</text>
</g></svg>
