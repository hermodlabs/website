<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="street-staffing-title street-staffing-desc">
  <title id="street-staffing-title">The same outreach plan changes when fewer people are available</title>
  <desc id="street-staffing-desc">A fictional staffing comparison holds the two-person outreach plan and its financial assumptions fixed. With seven available staff, two outside leave five inside, meeting a minimum of four. With five available, the same deployment leaves three inside and fails. A smaller one-person alternative leaves four inside; its illustrative cost is $200 and break-even is five additional customers at $40 contribution each. These simplified counts assume everyone is qualified. Financial thresholds are not forecasts.</desc>
  <rect width="1200" height="800" rx="18" fill="#f6f5f8"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="40" y="60" font-size="34" font-weight="700">The plan is unchanged. The available crew is not.</text>
    <text x="40" y="103" font-size="23" fill="#48616d">Same plan: two people outside · $400 additional cost · minimum four people inside</text>
    <text x="40" y="137" font-size="23" fill="#48616d">At $40 contribution per additional customer, the break-even threshold is 10.</text>
  </g>
  <rect x="40" y="176" width="540" height="342" rx="16" fill="#f2f8f7" stroke="#a4ceca" stroke-width="3"/>
  <rect x="620" y="176" width="540" height="342" rx="16" fill="#fbf2f3" stroke="#d7afb7" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="68" y="218" font-size="27" font-weight="700">Seven people available</text>
    <text x="648" y="218" font-size="27" font-weight="700">Five people available</text>
  </g>
  <g fill="none" stroke="#193743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(82 253)">
      <g fill="#c6e3e1"><circle cx="16" cy="12" r="11"/><path d="M0 55V40a16 16 0 0 1 32 0v15"/><circle cx="63" cy="12" r="11"/><path d="M47 55V40a16 16 0 0 1 32 0v15"/><circle cx="110" cy="12" r="11"/><path d="M94 55V40a16 16 0 0 1 32 0v15"/><circle cx="157" cy="12" r="11"/><path d="M141 55V40a16 16 0 0 1 32 0v15"/><circle cx="204" cy="12" r="11"/><path d="M188 55V40a16 16 0 0 1 32 0v15"/></g>
      <path d="M247-3v69" stroke="#b7cbd1" stroke-dasharray="5 6"/>
      <g fill="#ddd0ee"><circle cx="292" cy="12" r="11"/><path d="M276 55V40a16 16 0 0 1 32 0v15"/><circle cx="339" cy="12" r="11"/><path d="M323 55V40a16 16 0 0 1 32 0v15"/></g>
    </g>
    <g transform="translate(662 253)">
      <g fill="#c6e3e1"><circle cx="16" cy="12" r="11"/><path d="M0 55V40a16 16 0 0 1 32 0v15"/><circle cx="63" cy="12" r="11"/><path d="M47 55V40a16 16 0 0 1 32 0v15"/><circle cx="110" cy="12" r="11"/><path d="M94 55V40a16 16 0 0 1 32 0v15"/></g>
      <path d="M247-3v69" stroke="#d7afb7" stroke-dasharray="5 6"/>
      <g fill="#ddd0ee"><circle cx="292" cy="12" r="11"/><path d="M276 55V40a16 16 0 0 1 32 0v15"/><circle cx="339" cy="12" r="11"/><path d="M323 55V40a16 16 0 0 1 32 0v15"/></g>
    </g>
    <circle cx="91" cy="453" r="20" fill="#fff" stroke="#177681"/><path d="m81 453 7 8 13-17" stroke="#177681"/>
    <circle cx="671" cy="453" r="20" fill="#fff" stroke="#8c4855"/><path d="m663 445 16 16m0-16-16 16" stroke="#8c4855"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="82" y="345" font-size="22">5 inside</text><text x="358" y="345" font-size="22">2 outside</text>
    <text x="662" y="345" font-size="22">3 inside</text><text x="938" y="345" font-size="22">2 outside</text>
    <text x="68" y="397" font-size="26" font-weight="700">7 − 2 = 5 inside</text>
    <text x="648" y="397" font-size="26" font-weight="700">5 − 2 = 3 inside</text>
    <text x="124" y="461" font-size="25" font-weight="700" fill="#177681">Meets the staffing minimum</text>
    <text x="704" y="461" font-size="25" font-weight="700" fill="#8c4855">Blocked by the staffing minimum</text>
    <text x="68" y="495" font-size="21" fill="#48616d">Still check the plan's other requirements.</text>
    <text x="648" y="495" font-size="21" fill="#48616d">The break-even threshold has not changed.</text>
  </g>
  <rect x="40" y="549" width="1120" height="160" rx="16" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="68" y="591" font-size="27" font-weight="700">A smaller alternative for the five-person crew</text>
    <text x="68" y="633" font-size="25">One person outside → four inside → staffing minimum met</text>
    <text x="68" y="674" font-size="23" fill="#7850c2">$200 additional cost ÷ $40 contribution = five additional customers to break even</text>
    <text x="40" y="754" font-size="21" fill="#48616d">Fictional, simplified counts: all available people are assumed qualified for their assigned roles.</text>
    <text x="40" y="785" font-size="21" fill="#48616d">A staffing pass is not an approval. A break-even threshold is not a demand forecast.</text>
  </g>
</svg>
