<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="team-review-title team-review-desc">
  <title id="team-review-title">One promotion review, with a responsibility for each fact</title>
  <desc id="team-review-desc">The floor lead supplies qualified staffing, the event coordinator supplies timing and access records, the venue manager supplies spending limits and delegation, and the finance reviewer supplies contribution and separate loss assumptions. The shared review checks operating options and shows financial thresholds. Sam then chooses and records a specific authorization. Changed operating facts require reassessment; changed financial assumptions require management reconsideration.</desc>
  <rect width="1200" height="800" rx="18" fill="#f6f5f8"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="40" y="60" font-size="34" font-weight="700">One review. A clear responsibility for each fact.</text>
    <text x="40" y="103" font-size="23" fill="#48616d">Use current information from the people who can check it.</text>
  </g>
  <g fill="#fff" stroke="#c8d4dc" stroke-width="3">
    <rect x="40" y="143" width="260" height="157" rx="16"/>
    <rect x="326" y="143" width="260" height="157" rx="16"/>
    <rect x="612" y="143" width="260" height="157" rx="16"/>
    <rect x="898" y="143" width="260" height="157" rx="16"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743" text-anchor="middle">
    <g font-size="24" font-weight="700">
      <text x="170" y="188">Floor lead</text><text x="456" y="188">Event coordinator</text><text x="742" y="188">Venue manager</text><text x="1028" y="188">Finance reviewer</text>
    </g>
    <g font-size="23" fill="#48616d">
      <text x="170" y="236">Qualified staffing</text><text x="170" y="268">for the full absence</text>
      <text x="456" y="236">Event timing</text><text x="456" y="268">and access records</text>
      <text x="742" y="236">Spending limit</text><text x="742" y="268">and delegation</text>
      <text x="1028" y="236">Contribution and</text><text x="1028" y="268">separate discount loss</text>
    </g>
  </g>
  <g fill="none" stroke="#177681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 300v32h858v-32M456 300v32m286-32v32M600 332v29m-11-13 11 13 11-13"/>
    <path d="M600 465v43m-11-13 11 13 11-13"/>
  </g>
  <rect x="240" y="363" width="720" height="102" rx="16" fill="#f2f8f7" stroke="#a4ceca" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743" text-anchor="middle">
    <text x="600" y="404" font-size="28" font-weight="700">Review the current situation together</text>
    <text x="600" y="440" font-size="23">Workable deployments · financial thresholds · reviewed findings</text>
  </g>
  <rect x="240" y="510" width="720" height="112" rx="16" fill="#f7f4fb" stroke="#c6b2e1" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743" text-anchor="middle">
    <text x="600" y="554" font-size="28" font-weight="700">Sam makes the bounded choice</text>
    <text x="600" y="592" font-size="23">Record the deployment, amount, operating date and authorization.</text>
  </g>
  <path d="M240 567H141V413h88m-13-11 13 11-13 11" fill="none" stroke="#7850c2" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="40" y="684" font-size="26" font-weight="700">When circumstances change</text>
    <text x="40" y="727" font-size="23">Staffing, timing, access or spending changes → reassess the operating basis.</text>
    <text x="40" y="765" font-size="23" fill="#48616d">Contribution or loss assumptions change → update the thresholds and reconsider the choice.</text>
  </g>
</svg>
