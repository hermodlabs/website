<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="timing-late-title timing-late-desc">
  <title id="timing-late-title">A 9 p.m. event exit misses the unchanged outreach and arrival windows</title>
  <desc id="timing-late-desc">Gantt chart using the same fictional seven-person staffing baseline, expense and crew schedule as the original scenario. All times are p.m. Sam still authorizes by 7:45; crew travel is 7:45 to 8, outreach is 8 to 8:45, and return is 8:45 to 9. Only event exit changes to 9, 15 minutes after outreach ends. A hypothetical 30-minute customer journey would end at 9:30, 15 minutes after the latest useful arrival of 9:15. The dashed journey tests that allowance only: the crew is no longer doing outreach at 9, and no contact, acceptance or arrival is established. The event-based deployment fails both timing conditions.</desc>
  <rect x="1" y="1" width="558" height="758" rx="16" fill="#f6f5f8" stroke="#d7afb7" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="24" y="41" font-size="21" font-weight="700" fill="#48616d">CHANGE ONLY THE EVENT EXIT</text>
    <text x="24" y="83" font-size="32" font-weight="700">Exit: 9 p.m.</text>
    <text x="24" y="124" font-size="27" font-weight="700" fill="#8c4855">Timing conditions fail</text>
    <text x="24" y="161" font-size="22" fill="#48616d">Authorize by 7:45 · dispatch at 7:45</text>
    <g font-size="21" text-anchor="middle" fill="#48616d">
      <text x="42" y="198">7:45</text><text x="110" y="198">8:00</text>
      <text x="178" y="198">8:15</text><text x="246" y="198">8:30</text>
      <text x="314" y="198">8:45</text><text x="382" y="198">9:00</text>
      <text x="450" y="198" font-weight="700">9:15</text><text x="518" y="198">9:30</text>
    </g>
  </g>
  <path d="M42 211H518" fill="none" stroke="#b7cbd1" stroke-width="2"/>
  <g fill="none" stroke="#d9dce3" stroke-width="1.5">
    <path d="M42 252V294m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42"/>
    <path d="M42 351V383m68-32v32m68-32v32m68-32v32m68-32v32m68-32v32m68-32v32m68-32v32"/>
    <path d="M42 454V496m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42m68-42v42"/>
  </g>
  <path d="M450 211V539" fill="none" stroke="#48616d" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#193743">
    <text x="24" y="240" font-size="25" font-weight="700">Crew schedule · unchanged</text>
    <rect x="42" y="252" width="340" height="42" rx="6" fill="#ddd0ee"/>
    <rect x="110" y="252" width="204" height="42" fill="#7850c2"/>
    <g font-size="22" font-weight="700" text-anchor="middle">
      <text x="76" y="281">Out</text><text x="212" y="281" fill="#fff">Outreach</text><text x="348" y="281">Back</text>
    </g>
    <text x="24" y="337" font-size="25" font-weight="700">Event exit</text>
    <path d="m382 355 12 12-12 12-12-12Z" fill="#8c4855" stroke="#fff" stroke-width="2"/>
    <text x="382" y="407" font-size="24" font-weight="700" text-anchor="middle" fill="#8c4855">9:00</text>
    <text x="24" y="438" font-size="25" font-weight="700">Customer journey · if accepted</text>
    <rect x="382" y="454" width="136" height="42" rx="6" fill="#f7e6ea" stroke="#8c4855" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="450" y="483" font-size="24" text-anchor="middle">30 min</text>
    <circle cx="518" cy="475" r="6" fill="#fff" stroke="#8c4855" stroke-width="2.5"/>
    <text x="518" y="529" font-size="24" font-weight="700" text-anchor="end" fill="#8c4855">9:30 arrival</text>
    <text x="450" y="562" font-size="22" text-anchor="end" fill="#48616d">Latest useful arrival: 9:15</text>
    <rect x="24" y="583" width="512" height="96" rx="10" fill="#fbf2f3" stroke="#d7afb7" stroke-width="2"/>
    <text x="42" y="619" font-size="24" font-weight="700">Exit: 15 min after outreach ends.</text>
    <text x="42" y="656" font-size="24">Arrival: 15 min after the limit.</text>
    <text x="24" y="715" font-size="22" fill="#48616d">Journey shown only to test the timing.</text>
    <text x="24" y="745" font-size="22" fill="#48616d">The crew is no longer doing outreach.</text>
  </g>
</svg>
