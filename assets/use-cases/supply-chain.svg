<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="supply-chain-cover-title supply-chain-cover-desc">
  <title id="supply-chain-cover-title">Connect the order to the receiving commitment</title>
  <desc id="supply-chain-cover-desc">An order, a warehouse with packed goods, and a receiving location with a clock are connected by a freight route. The illustration brings supply, transport, and delivery timing into the same view.</desc>
  <rect width="960" height="720" fill="#f6f5f8"/>
  <circle cx="480" cy="346" r="286" fill="#fff"/>
  <ellipse cx="480" cy="608" rx="278" ry="15" fill="#e8e8ee"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- The order and its fulfillment share a connected operational path. -->
    <path d="M294 349h65m-13-12 13 12-13 12M599 349h65m-13-12 13 12-13 12" stroke="#177681" stroke-width="5"/>
    <path d="M483 447v42M634 541h76V410" stroke="#9caeb8" stroke-width="4" stroke-dasharray="8 11"/>
  </g>
  <g stroke="#193743" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A customer order sets out what must be supplied. -->
    <path d="M160 254h94l39 39v159H160z" fill="#fff"/>
    <path d="M254 254v39h39" fill="#e5eef1"/>
    <path d="M184 319h64m-64 24h84m-84 25h84" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <rect x="184" y="393" width="25" height="25" rx="4" fill="#ddd0ee" stroke="#7850c2" stroke-width="4"/>
    <path d="M225 397h43m-43 18h30" fill="none" stroke="#7850c2" stroke-width="4"/>
    <!-- Inventory and packing are part of the same chain as transportation. -->
    <path d="m363 303 117-77 117 77v144H363z" fill="#fff"/>
    <path d="m350 310 130-85 130 85" fill="none" stroke="#177681" stroke-width="7"/>
    <rect x="420" y="333" width="120" height="114" fill="#e5eef1" stroke-width="4"/>
    <path d="M420 354h120m-120 20h120m-120 20h120" fill="none" stroke="#c8d4dc" stroke-width="4"/>
    <rect x="379" y="384" width="60" height="63" rx="3" fill="#c6e3e1" stroke-width="4"/>
    <path d="M409 384v24m-11 18h22" fill="none" stroke="#177681" stroke-width="4"/>
    <rect x="514" y="398" width="65" height="49" rx="3" fill="#ddd0ee" stroke-width="4"/>
    <path d="M546 398v20" fill="none" stroke="#7850c2" stroke-width="4"/>
    <!-- The receiving location has its own time commitment. -->
    <path d="M667 302h127v108H667z" fill="#fff"/>
    <path d="M653 302h155l-23-44h-109z" fill="#ddd0ee"/>
    <rect x="706" y="353" width="48" height="57" fill="#e5eef1" stroke-width="4"/>
    <path d="M730 353v57" fill="none" stroke="#9caeb8" stroke-width="4"/>
    <circle cx="742" cy="226" r="49" fill="#fff"/>
    <path d="M742 191v35l21 14" fill="none" stroke="#7850c2" stroke-width="4"/>
    <path d="M742 184v-5m42 47h5m-47 42v5m-42-47h-5" fill="none" stroke="#9caeb8" stroke-width="3"/>
    <circle cx="742" cy="226" r="4" fill="#193743" stroke="none"/>
    <!-- Freight connects preparation to the receiving location. -->
    <rect x="390" y="493" width="145" height="78" rx="7" fill="#c6e3e1"/>
    <path d="M535 511h53l36 37v23h-89z" fill="#fff"/>
    <path d="M554 523h27l23 25h-50z" fill="#e5eef1" stroke-width="4"/>
    <path d="M413 513v35m26-35v35m26-35v35m26-35v35" fill="none" stroke="#9dc8c7" stroke-width="4"/>
    <circle cx="430" cy="574" r="20" fill="#fff"/>
    <circle cx="582" cy="574" r="20" fill="#fff"/>
    <circle cx="430" cy="574" r="6" fill="#193743" stroke="none"/>
    <circle cx="582" cy="574" r="6" fill="#193743" stroke="none"/>
  </g>
  <path d="M180 617h600" stroke="#d3dfe5" stroke-width="3" stroke-linecap="round"/>
</svg>
